[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scienceunbound"
version = "0.1.0"
description = "Privacy-safe, verified, citable reports for research that would otherwise stay in the file drawer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["streamlit>=1.50", "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8", "httpx>=0.27", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scienceunbound = "scienceunbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
