the self and away from the task.","citations":["kluger_denisi1996"],"cues":[]},{"id":"default_moves_choices_not_total","name":"A default can move individual choices without raising the total","behaviour":"A preset amount can shift what each person gives or does, and the overall total can stay about the same.","actor":"targeted","signal":"Total amount and number of people taking part, before and after the default, by group.","source":"Records of choices before and after the change","unmeasured":"Individual choices change, so the default looks effective while the total stays flat.","mitigations":["Compare totals as well as individual choices","Test the default on a sample first"],"strength":"extrapolation","basis":"In a large online fundraising field experiment, defaults strongly affected individual behaviour, yet aggregate donation levels were unaffected by defaults. Co-donations to the platform increased with the default amount (Altmann and colleagues 2019). That it holds for workplace defaults is a prediction.","citations":["altmann2019"],"cues":[]},{"id":"households_offset_resources","name":"Households may offset extra school resources they expect","behaviour":"When people expect extra resources, they can cut back their own, so the net gain shrinks.","actor":"nearby","signal":"Own spending or effort per person before and after the extra resource is announced.","source":"Spending or effort records before and after the change","unmeasured":"The new resource is counted. What people stopped putting in is not.","mitigations":["Announce the extra resource late or tie it to what people put in","Track people's own input as well as the new resource"],"strength":"extrapolation","basis":"Using school grants in Zambia and India, households offset anticipated grants more than unanticipated grants. Unanticipated grants improved test scores, while anticipated grants had no measurable effect on them (Das and colleagues 2013). That it happens when an organisation adds resources is a prediction.","citations":["das2013"],"cues":[]},{"id":"staff_ease_off_when_help_arrives","name":"Extra staff can lead existing staff to ease off","behaviour":"When extra help arrives, the existing team can reduce its own effort.","actor":"nearby","signal":"Hours worked and tasks completed per existing staff member, before and after the extra help.","source":"Time and output records","unmeasured":"Total capacity rises on paper, so the drop in effort of existing staff is hidden.","mitigations":["Set what the existing team still owns","Track output per person as well as the total"],"strength":"extrapolation","basis":"Funding Kenyan school committees to hire contract teachers cut class size from 82 to 44 pupils, but test scores did not rise significantly for students in existing classes (Duflo, Dupas and Kremer 2015). Civil-service teachers reduced their effort. That it happens elsewhere is a prediction.","citations":["duflo2015"],"cues":[]},{"id":"self_set_deadlines_weaker","name":"Self-set deadlines can help, but less than outside ones","behaviour":"A deadline people set for themselves can be too loose to work fully.","actor":"targeted","signal":"Share of tasks finished on time under self-set deadlines, against outside deadlines.","source":"Task completion records","unmeasured":"Everyone has a deadline, so the plan looks complete while the deadlines are loose.","mitigations":["Add an outside check on the self-set date","Compare self-set and outside deadlines on a sample"],"strength":"mixed","basis":"Self-imposed deadlines helped people control procrastination and improved task performance, but they were less effective than externally imposed deadlines (Ariely and Wertenbroch 2002).","citations":["ariely2002"],"cues":[]},{"id":"commitment_product_losses","name":"A commitment can leave many people worse off","behaviour":"If the penalty for missing a commitment is too weak, people can default and lose money.","actor":"targeted","signal":"Share who miss the commitment and the amount lost per person.","source":"Records of commitments and outcomes","unmeasured":"The average result looks good, so the people who defaulted are not seen.","mitigations":["Make the penalty strong enough to matter","Let people start with a small commitment"],"strength":"extrapolation","basis":"In a field experiment in the Philippines, an installment-savings commitment raised average bank savings, but 55 per cent of clients defaulted and lost money (John 2020). The author attributes this to penalties too low to overcome self-control problems. That it holds for workplace commitments is a prediction.","citations":["john2018"],"cues":[]},{"id":"rank_feedback_backfires","name":"Rank feedback can reduce return and output","behaviour":"People told how they rank against others can do less.","actor":"targeted","signal":"Rate of return to the task and output per person, for those who see their rank and those who do not.","source":"Task and output records","unmeasured":"The top of the ranking improves, so the people who stopped coming back are not seen.","mitigations":["Show progress against a personal goal, not rank","Compare people who see rank with people who do not"],"strength":"extrapolation","basis":"In a crowd-sourcing field experiment with no pay consequence, workers given rank feedback were less likely to return to work and less productive on the job than a control group (Barankay 2011). It is a working paper. That it holds in organisations is a prediction.","citations":["barankay2011"],"cues":[]},{"id":"saving_licenses_use_elsewhere","name":"Saving in one area can license using more in another","behaviour":"People who cut one resource after feedback can use more of another.","actor":"targeted","signal":"Change in use of a related resource per person, for those who got feedback and those who did not.","source":"Records of related use","unmeasured":"Only the target resource is tracked, so the rise elsewhere is not seen.","mitigations":["Track the nearest related behaviour as well","Give feedback on the related resource too"],"strength":"extrapolation","basis":"In 154 apartments, residents given weekly water-use feedback cut water use by 6.0 per cent but raised electricity use by 5.6 per cent relative to controls (Tiefenbeck and colleagues 2013). The authors say the findings fit moral licensing and call for more work on the mechanism. That it happens in organisations is a prediction.","citations":["tiefenbeck2013"],"cues":[]},{"id":"peer_comparison_uneven","name":"Peer-comparison messages may affect groups differently","behaviour":"The same comparison message can work for one group and be rejected by another.","actor":"targeted","signal":"Response rate and opt-out rate to the message, by group.","source":"Message analytics by group","unmeasured":"The average response looks fine, so the groups that rejected it are not seen.","mitigations":["Test the message with each group first","Track opt-outs by group"],"strength":"extrapolation","basis":"In a home electricity report experiment, the report was two to four times more effective with political liberals than with conservatives. Conservatives were also more likely to opt out of the report and to say they disliked it (Costa and Kahn 2013). That it holds for workplace messages is a prediction.","citations":["costa_kahn2013"],"cues":[]},{"id":"low_rate_message_lowers_rate","name":"Saying that few people do it can lower the rate","behaviour":"A message that laments how few people act can make acting seem less normal.","actor":"targeted","signal":"Rate of the desired behaviour after the message, for those told the rate is low and those told it is high.","source":"Behaviour records by message version","unmeasured":"The message is about the problem, so no one checks whether it lowers the rate.","mitigations":["Say what most colleagues do, not what few do","Test the wording before the launch"],"strength":"extrapolation","basis":"In two get-out-the-vote field experiments, messages stressing high expected turnout motivated voters more than messages stressing low turnout. The authors suggest that lamenting low participation may undermine turnout, mainly among infrequent or occasional voters (Gerber and Rogers 2009). That it holds in organisations is a prediction.","citations":["gerber_rogers2009"],"cues":[]},{"id":"training_effects_fade","name":"Training effects can fade and explain little behaviour","behaviour":"Training can leave a record of attendance while the behaviour changes little.","actor":"targeted","signal":"Share applying the skill three and twelve months after the training, against attendance.","source":"Follow-up checks of behaviour","unmeasured":"Attendance is recorded and looks complete, so no one checks what people do later.","mitigations":["Follow up after three months and again after a year","Add reminders or practice close to the moment of use"],"strength":"extrapolation","basis":"A meta-analysis of 168 papers (201 studies) found financial-literacy interventions explain 0.1 per cent of the variance in the behaviours studied, with negligible effects 20 months or more after even large interventions (Fernandes, Lynch and Netemeyer 2014). That it holds for workplace training is a prediction.","citations":["fernandes2014"],"cues":[]},{"id":"reviewers_over_rely","name":"Human reviewers can over-rely on, or selectively follow, advice","behaviour":"Reviewers can lean on the recommendation instead of checking it independently.","actor":"enforcers","signal":"Share of recommendations accepted unchanged, and the share of known errors caught.","source":"Review logs and error checks","unmeasured":"Reviews are completed on every case, so a rubber stamp looks like oversight.","mitigations":["Seed known errors to test the reviewers","Ask for the reviewer's own judgement before showing the advice"],"strength":"extrapolation","basis":"Three experiments in the Netherlands tested automation bias (over-reliance on algorithmic advice despite warning signals) and selective adherence (following advice when it matches stereotypes). The authors conclude that automating administrative decisions could harm vulnerable citizens (Alon-Barkat and Busuioc 2023). That it holds in other organisations is a prediction.","citations":["alonbarkat2023"],"cues":[]},{"id":"blame_shifted_to_owner","name":"Blame can fall on the named owner","behaviour":"Delegating a decision to one named person can move the blame onto that person and away from those behind the decision.","actor":"nearby","signal":"Share of problems where others point to the named owner, and time to the first action by anyone else.","source":"Incident reviews and workflow logs","unmeasured":"The owner is named, so the plan looks complete while the blame moves.","mitigations":["Name the decision-maker as well as the owner","Review what others did as well as the owner"],"strength":"extrapolation","basis":"In a laboratory experiment, responsibility attribution could be effectively shifted, and a simple responsibility measure predicted punishment better than inequity-aversion or reciprocity measures (Bartling and Fischbacher 2012). In laboratory experiments, third-party punishment fell when a passive intermediary was added (Coffman 2011). That blame lands on the named owner in organisations is a prediction.","citations":["bartling2012","coffman2011"],"cues":[]},{"id":"payment_reduces_supply","name":"Paying for a prosocial act can reduce supply among some groups","behaviour":"Adding a payment can lower the supply of a prosocial act for some people.","actor":"targeted","signal":"Rate of giving or volunteering, by group, before and after the payment.","source":"Records of giving by group","unmeasured":"Total supply looks stable, so a fall in one group is not seen.","mitigations":["Let people direct the payment to a cause they choose","Compare groups before and after the payment"],"strength":"extrapolation","basis":"In a field experiment on blood donation, women showed a significant crowding-out effect when a payment of 50 Swedish kronor was offered. Men showed no significant difference (Mellström and Johannesson 2008). Letting women direct the payment to charity offset the crowding-out. That it holds for workplace payments is a prediction.","citations":["mellstrom2008"],"cues":[]},{"id":"disclosure_biases_advice","name":"Disclosing a conflict can make advice more biased","behaviour":"Once an advisor has disclosed, they can feel licensed to push the advice further.","actor":"enforcers","signal":"Share of advisers who disclose, and how often their advice favours their own interest.","source":"Advice records and disclosure forms","unmeasured":"Disclosure is recorded, so the advice looks safe.","mitigations":["Remove the conflict instead of only disclosing it","Check advice from advisers who disclosed"],"strength":"extrapolation","basis":"A laboratory study reports that disclosure can increase bias in advice, because advisors may feel licensed by having disclosed. Advisees also discount biased advice less than they should (Cain, Loewenstein and Moore 2005). That it holds when organisations explain is a prediction.","citations":["cain2005"],"cues":[]},{"id":"report_cards_select_cases","name":"Published report cards can shift who gets treated and worsen outcomes","behaviour":"Providers can respond to a published score by choosing which cases to take on.","actor":"targeted","signal":"Share of difficult cases taken on by each provider, before and after publication.","source":"Case records by provider","unmeasured":"The published scores improve, so the cases that were turned away are not seen.","mitigations":["Adjust the published score for case difficulty","Track the cases that were referred elsewhere"],"strength":"extrapolation","basis":"Cardiac surgery report cards in New York and Pennsylvania led providers to select patients and better matched patients to hospitals. On net they raised resource use and worsened health outcomes, particularly for sicker patients (Dranove and colleagues 2003). It is one health-care setting. That it holds elsewhere is a prediction.","citations":["dranove2003"],"cues":[]},{"id":"monitoring_crowds_out_effort","name":"More monitoring can crowd out some workers' own effort","behaviour":"Beyond a point, monitoring can reduce the effort people give on their own.","actor":"targeted","signal":"Output per person at different levels of checking, and the share who do the minimum when unobserved.","source":"Output records by level of checking","unmeasured":"Checked output looks fine, so the effort given freely is not seen.","mitigations":["Keep checking at a level people see as fair","Compare output with and without extra checks"],"strength":"extrapolation","basis":"In a laboratory principal-agent experiment, most people in the employee role responded to monitoring's disciplining effect, but there was some evidence that intrinsic motivation was crowded out once monitoring exceeded a threshold (Dickinson and Villeval 2008). That it holds at work is a prediction.","citations":["dickinson2008"],"cues":[]},{"id":"explanations_may_not_stop_over_reliance","name":"Adding explanations may not stop people over-relying on advice","behaviour":"Reviewers shown the system's reasons can still accept its advice without checking it.","actor":"enforcers","signal":"Share of advice accepted without a check, with and without the explanation.","source":"Review logs","unmeasured":"Explanations are shown, so the process looks safer than it is.","mitigations":["Make reviewers decide before they see the advice","Slow the review down for high-stakes cases"],"strength":"extrapolation","basis":"In an experiment with 199 participants, adding explanations to the AI decisions was not found to reduce overreliance, while cognitive forcing designs significantly did (Buçinca, Malaya and Gajos 2021). The most effective designs received the least favourable ratings. That it holds in other organisations is a prediction.","citations":["bucinca2021"],"cues":[]},{"id":"short_term_incentive_weakens_motive","name":"A short-term incentive can still weaken the underlying motive","behaviour":"A reward can work now while weakening the reason people had before.","actor":"targeted","signal":"Rate of the behaviour in the weeks after the incentive ends, against before it started.","source":"Behaviour records over time","unmeasured":"The incentive period looks successful, so the later fall is not linked to it.","mitigations":["Follow the behaviour after the incentive ends","Explain the purpose alongside the reward"],"strength":"extrapolation","basis":"A review reports that monetary incentives can change how people perceive a task, with negative effects, and that some incentives work in the short term but still weaken intrinsic motivations. It covers education, public goods contributions and lifestyle change (Gneezy, Meier and Rey-Biel 2011). That it holds at work is a prediction.","citations":["gneezy2011"],"cues":[]},{"id":"removing_screen_lets_through","name":"Removing a screening step can let more irregular claims through","behaviour":"A step that seems only to slow work can keep errors and fraud out.","actor":"nearby","signal":"Rate of irregular claims per thousand before and after the step is removed.","source":"Claims and audit records","unmeasured":"Processing gets faster and cheaper, so the rise in errors comes later and is not linked.","mitigations":["Keep the check for a sample of cases","Track irregular claims for a year after the change"],"strength":"extrapolation","basis":"Across nearly 11.5 million Paycheck Protection Program loans, screening reduced loan irregularities and cut fraud losses by at least 744 million dollars (Aman-Rana, Gingerich and Sukhtankar 2023). These were government loans in a working paper, not an internal process. That it holds in other organisations is a prediction.","citations":["amanrana2023"],"cues":[]},{"id":"measures_become_the_goal","name":"Managers can treat the measures as the goal itself","behaviour":"With a set of measures, people can chase the numbers rather than the strategy they stand for.","actor":"targeted","signal":"Share of decisions explained by a measure rather than by the strategy, in reviews.","source":"Review notes and decision records","unmeasured":"The measures are met, so the loss of the goal behind them is not seen.","mitigations":["Involve managers in choosing the measures","Ask in each review what the measure stands for"],"strength":"extrapolation","basis":"In an experiment, involvement in strategy selection reduced surrogation, in which managers treat performance measures as if they were the strategic goals. Strategy deliberation alone did not reduce it (Choi, Hecht and Tayler 2013). That it holds for a basket of measures at work is a prediction.","citations":["choi2013"],"cues":[]}],"interventions":[{"id":"mandate","name":"Make it mandatory","plain":"Require everyone to do it, by a deadline.","family":"control","runs_through":["reactance","social_proximity"],"counters":["present_bias","attention"],"side_effects":["minimum_compliance","goodwill_withdrawn","adjacent_voluntary_drop","breaches_spread"],"cues":[],"unless":[],"levers":[],"counter_why":{"present_bias":"A deadline that everyone must meet prevents the task from drifting indefinitely.","attention":"A requirement puts the task on everyone's list."},"example":"Every manager must finish the module by 31 March.","actions":{"start":{"label":"Make it required or stricter","example":"Require the module for every manager by 31 March."},"adjust":{"label":"Change the requirement","example":"Keep it required, and let managers pick the format."},"stop":{"label":"Loosen or drop the requirement","example":"Make the module optional for those who passed last year."}},"removes":false},{"id":"monitor","name":"Monitor the behaviour","plain":"Supervisors observe, log or audit the behaviour.","family":"control","runs_through":["reactance"],"counters":[],"side_effects":["goodwill_withdrawn","performing_for_tracker","monitoring_crowds_out_effort"],"cues":[],"unless":[],"levers":[],"counter_why":{},"example":"Supervisors spot-check ten expense claims a week.","actions":{"start":{"label":"Monitor more, or more closely","example":"Start spot-checking ten calls a week."},"adjust":{"label":"Change what or how you monitor","example":"Check calls at random instead of every Friday."},"stop":{"label":"Monitor less, or stop","example":"Check one call a month instead of five a week."}},"removes":false},{"id":"approval_step","name":"Add an approval step","plain":"Require one more sign-off before it can happen.","family":"control","runs_through":["diffusion","hassle"],"counters":[],"side_effects":["threshold_bunching","ownership_drops","decisions_slow"],"cues":[],"unless":["sign off alone","signs off alone","approve alone","approves alone","without a second signature","single signature"],"levers":[],"counter_why":{},"example":"Spend over £500 needs a second manager's sign-off.","actions":{"start":{"label":"Add a sign-off or tighten it","example":"Lower the sign-off limit from £1,000 to £500."},"adjust":{"label":"Change who signs or how","example":"Move the sign-off from the line manager to finance."},"stop":{"label":"Raise the sign-off limit","example":"Raise the sign-off limit from £500 to £1,000."}},"removes":false},{"id":"automate","name":"Automate a judgement","plain":"Let a model or system make or rank the decision.","family":"control","runs_through":["automation_bias"],"counters":["capacity"],"side_effects":["override_collapse","judgement_fades"],"cues":[],"unless":[],"levers":[],"counter_why":{"capacity":"The system takes on volume that is beyond people's capacity."},"example":"A model ranks incoming complaints by risk.","actions":{"start":{"label":"Automate more decisions","example":"Let the model rank every complaint, on every channel."},"adjust":{"label":"Change how the system works","example":"Retrain the model and show its score beside each case."},"stop":{"label":"Automate less, or switch it off","example":"Send complaints over £10,000 back to manual review."}},"removes":false},{"id":"numeric_target","name":"Set a numeric target","plain":"Set a number that people are expected to reach.","family":"control","runs_through":["metric_gaming"],"counters":["present_bias"],"side_effects":["period_end_bunching","cheapest_margin","unmeasured_quality_slips"],"cues":[],"unless":[],"levers":[],"counter_why":{"present_bias":"A dated number gives people something to be held to."},"example":"Each branch must reach 40 client reviews a quarter.","actions":{"start":{"label":"Add a target or raise it","example":"Raise the target from 40 to 50 reviews a quarter."},"adjust":{"label":"Change how the target works","example":"Set next quarter’s target from this quarter’s result."},"stop":{"label":"Lower the target or drop it","example":"Drop the 40-review target."}},"removes":false},{"id":"publish_rate","name":"Publish a compliance statistic","plain":"Tell people what share complies.","family":"control","runs_through":["descriptive_norm","metric_gaming"],"counters":["attention"],"side_effects":["drift_to_stated_rate","cheapest_margin","report_cards_select_cases","rank_feedback_backfires"],"cues":[],"unless":[],"levers":["mindspace:norms"],"counter_why":{"attention":"It makes the issue visible."},"example":"Post the share of teams that filed on time.","actions":{"start":{"label":"Publish it, or publish more often","example":"Post each team’s on-time rate every week."},"adjust":{"label":"Change what the figure shows","example":"Show the share who filed on time, not the share who did not."},"stop":{"label":"Publish less, or stop","example":"Stop the weekly email with the rate."}},"removes":false},{"id":"sanction","name":"Penalise it","plain":"Attach a penalty to the behaviour.","family":"control","runs_through":["crowding_out","reactance"],"counters":["misaligned"],"side_effects":["fine_becomes_price","goes_underground"],"cues":[],"unless":[],"levers":["mindspace:incentives"],"counter_why":{"misaligned":"A cost can offset whatever rewards the behaviour."},"example":"A £20 charge for each late timesheet.","actions":{"start":{"label":"Add a penalty or raise it","example":"Charge £20 for each late timesheet."},"adjust":{"label":"Change how the penalty works","example":"Charge the £20 to the team budget, not to the person."},"stop":{"label":"Lower the penalty or drop it","example":"Drop the £20 charge for late timesheets."}},"removes":false},{"id":"incentive","name":"Pay a bonus or reward","plain":"Reward the behaviour with money or recognition.","family":"control","runs_through":["crowding_out","metric_gaming"],"counters":["misaligned","capacity"],"side_effects":["unrewarded_work_shrinks","cheapest_margin","unmeasured_quality_slips","adjacent_voluntary_drop"],"cues":[],"unless":[],"levers":["east:attractive","mindspace:incentives"],"counter_why":{"misaligned":"It can outweigh the competing reward.","capacity":"It can pay for the extra time the behaviour needs."},"example":"A £500 bonus for each year of mentoring.","actions":{"start":{"label":"Add a reward or increase it","example":"Pay a £500 bonus for each year of mentoring."},"adjust":{"label":"Change what the reward pays for","example":"Pay the bonus on client ratings, not on sales."},"stop":{"label":"Reduce the reward or drop it","example":"End the mentoring bonus next year."}},"removes":false},{"id":"ban_restrict","name":"Ban or restrict it","plain":"Forbid it, or cap how much is allowed.","family":"control","runs_through":["reactance","social_proximity"],"counters":[],"side_effects":["goodwill_withdrawn","behaviour_moves_elsewhere","goes_underground","breaches_spread"],"cues":[],"unless":[],"levers":[],"counter_why":{},"example":"No personal phones on the trading floor.","actions":{"start":{"label":"Ban it, or tighten the limit","example":"No personal phones on the trading floor."},"adjust":{"label":"Change how the ban works","example":"Collect phones at the door instead of spot checks."},"stop":{"label":"Loosen or lift the ban","example":"Allow phones in the break room."}},"removes":false},{"id":"make_voluntary","name":"Make it voluntary, with a genuine choice","plain":"Invite people and let them choose how or when.","family":"enable","runs_through":[],"counters":["reactance"],"side_effects":["only_the_willing","task_drifts"],"cues":[],"unless":[],"levers":["east:attractive"],"counter_why":{"reactance":"It removes the expression of distrust that provokes resistance."},"example":"Offer the course and let staff pick the date.","actions":{"start":{"label":"Make it voluntary, or widen the choice","example":"Offer the course and let staff pick the date."},"adjust":{"label":"Change how people opt in","example":"Invite the teams with the most complaints first."},"stop":{"label":"Make it required again","example":"Make the course required again for all staff."}},"removes":true},{"id":"explain_involve","name":"Explain the reason and involve people","plain":"Give the reason and consult those affected.","family":"enable","runs_through":[],"counters":["reactance","information","crowding_out","social_proximity"],"side_effects":["expectations_raised","disclosure_biases_advice"],"cues":[],"unless":["explain~~director","explain~~boss","explain~~supervisor","explain~~head of","explain~~chief","explain~~committee","explain~~=board","explain~~senior","explain~~line manager","explain~~their manager","explain~~your manager","explain~~his manager","explain~~her manager","justify~~director","justify~~boss","justify~~supervisor","justify~~head of","justify~~chief","justify~~committee","justify~~=board","justify~~senior","justify~~line manager","justify~~their manager","justify~~your manager","justify~~his manager","justify~~her manager","report~~director","report~~boss","report~~supervisor","report~~head of","report~~chief","report~~committee","report~~=board","report~~senior","report~~line m he deadline."},"adjust":{"label":"Change the timing or wording","example":"Send it at 9am on the day, not a week before."},"stop":{"label":"Send fewer reminders, or none","example":"Drop the weekly email and keep the one the day before."}},"removes":false},{"id":"simplify","name":"Remove steps","plain":"Reduce the number of forms, clicks or sign-offs.","family":"enable","runs_through":[],"counters":["hassle"],"side_effects":["monitoring_was_deterring","step_was_doing_a_job","removing_screen_lets_through"],"cues":[],"unless":[],"levers":["east:easy"],"counter_why":{"hassle":"It removes the friction that stops people who intend to act."},"example":"Cut the expense form from four screens to one.","actions":{"start":{"label":"Remove one or more steps","example":"Drop the second sign-off on claims under £500."},"adjust":{"label":"Swap one step for another","example":"Replace the cost-code screen with a photo of the receipt."},"stop":{"label":"Put steps back","example":"Bring back the manager’s check on claims over £200."}},"removes":true},{"id":"commitment","name":"Ask for a dated commitment","plain":"Ask people to commit to a specific step and date.","family":"enable","runs_through":[],"counters":["present_bias"],"side_effects":["self_set_deadlines_weaker","commitment_to_end_the_conversation","commitment_product_losses"],"cues":[],"unless":[],"levers":["mindspace:commitments"],"counter_why":{"present_bias":"A specific, dated commitment makes delay more costly."},"example":"Ask each manager to name a date for the review.","actions":{"start":{"label":"Ask for commitments, or more of them","example":"Ask each manager to name a date for the review."},"adjust":{"label":"Change how dates are set or checked","example":"Ask for the date in writing and check it a week later."},"stop":{"label":"Ask for fewer commitments, or none","example":"Drop the dated pledge from the annual review."}},"removes":false},{"id":"feedback","name":"Give timely feedback","plain":"Show people how they compare, soon after acting.","family":"enable","runs_through":[],"counters":["information","attention"],"side_effects":["above_average_do_less","feedback_lowers_performance","rank_feedback_backfires"],"cues":[],"unless":[],"levers":["mindspace:salience"],"counter_why":{"information":"People learn what good looks like.","attention":"It keeps the behaviour visible."},"example":"Show each surgeon their start times next to the theatre median.","actions":{"start":{"label":"Give feedback, or give it more often","example":"Show each surgeon their start times next to the theatre median."},"adjust":{"label":"Change what the feedback shows","example":"Add a word of praise for surgeons who beat the median."},"stop":{"label":"Give feedback less often, or stop","example":"Send the start-time report monthly, not weekly."}},"removes":false},{"id":"positive_norm","name":"Say what most colleagues do","plain":"Tell people that most colleagues already comply.","family":"enable","runs_through":["descriptive_norm"],"counters":["descriptive_norm"],"side_effects":["above_average_do_less","peer_comparison_uneven","low_rate_message_lowers_rate"],"cues":[],"unless":[],"levers":["east:social","mindspace:norms"],"counter_why":{"descriptive_norm":"People then hear that the good behaviour is the common one."},"example":"Tell staff that 8 in 10 colleagues file on time.","actions":{"start":{"label":"Send it more widely","example":"Tell staff that 8 in 10 colleagues file on time."},"adjust":{"label":"Change the figure or wording","example":"Say 8 in 10 in your team, not in the firm."},"stop":{"label":"Send it less often, or stop","example":"Drop the line from the monthly email."}},"removes":false},{"id":"single_owner","name":"Name one owner","plain":"Name one person accountable for the decision.","family":"enable","runs_through":[],"counters":["diffusion"],"side_effects":["scapegoat","blame_shifted_to_owner"],"cues":[],"unless":[],"levers":[],"counter_why":{"diffusion":"Responsibility can no longer be diffused across several people."},"example":"Name one person who owns the theatre start time.","actions":{"start":{"label":"Name an owner, or widen their remit","example":"Name one person who owns the theatre start time."},"adjust":{"label":"Change who owns it","example":"Hand the start time from the clinical lead to the theatre manager."},"stop":{"label":"Share it again, or narrow the role","example":"Return the start time to the whole theatre team."}},"removes":false},{"id":"human_check","name":"Retain human review","plain":"Keep a person involved in each decision.","family":"enable","runs_through":[],"counters":["automation_bias"],"side_effects":["reasons_become_boilerplate","reviewers_over_rely","explanations_may_not_stop_over_reliance"],"cues":[],"unless":["explain~~director","explain~~boss","explain~~supervisor","explain~~head of","explain~~chief","explain~~committee","explain~~=board","explain~~senior","explain~~line manager","explain~~their manager","explain~~your manager","explain~~his manager","explain~~her manager","justify~~director","justify~~boss","justify~~supervisor","justify~~head of","justify~~chief","justify~~committee","justify~~=board","justify~~senior","justify~~line manager","justify~~their manager","justify~~your manager","justify~~his manager","justify~~her manager","report~~director","report~~boss","report~~supervisor","report~~head of","report~~chief","report~~committee","report~~=board","report~~senior","report~~line manager","report~~their manager","report~~your manager","report~~his manager","report~~her manager","account for~~director","account for~~boss","account for~~supervisor","account for~~head of","account for~~chief","account for~~committee","account for~~=board","account for~~senior","account for~~line manager","account for~~their manager","account for~~your manager","account for~~his manager","account for~~her manager","answer to~~director","answer to~~boss","answer to~~supervisor","answer to~~head of","answer to~~chief","answer to~~committee","answer to~~=board","answer to~~senior","answer to~~line manager","answer to~~their manager","answer to~~your manager","answer to~~his manager","answer to~~her manager"],"levers":[],"counter_why":{"automation_bias":"It forces an independent judgement before the model's answer is seen."},"example":"A reviewer checks a blind sample of the model's decisions.","actions":{"start":{"label":"Review more of the model’s decisions","example":"A reviewer checks a blind sample of the model’s decisions."},"adjust":{"label":"Change how the review works","example":"Ask for a reason on a random sample, not on every case."},"stop":{"label":"Review less, or stop","example":"Check 1 in 100 decisions instead of 1 in 10."}},"removes":false},{"id":"basket_of_measures","name":"Use a small set of measures","plain":"Judge the work on several measures.","family":"enable","runs_through":[],"counters":["metric_gaming"],"side_effects":["attention_spread_thin","measures_become_the_goal"],"cues":[],"unless":[],"levers":[],"counter_why":{"metric_gaming":"Several measures are harder to game than one."},"example":"Track complaints next to the sales target.","actions":{"start":{"label":"Add measures next to the current one","example":"Track complaints next to the sales target."},"adjust":{"label":"Replace a measure with another","example":"Track repeat visits instead of complaints."},"stop":{"label":"Drop measures","example":"Go back to the sales target alone."}},"removes":false},{"id":"add_capacity","name":"Add time or resources","plain":"Give people the time, cover or budget needed.","family":"enable","runs_through":[],"counters":["capacity"],"side_effects":["time_absorbed","households_offset_resources","staff_ease_off_when_help_arrives"],"cues":[],"unless":[],"levers":[],"counter_why":{"capacity":"It removes the constraint instead of working around it."},"example":"Free two hours a week for the review.","actions":{"start":{"label":"Add time or resources","example":"Free two hours a week for the review."},"adjust":{"label":"Change how the time is used","example":"Book the two hours as a fixed Tuesday slot."},"stop":{"label":"Cut the time or resources","example":"Cut the review time from two hours to one."}},"removes":false},{"id":"train_clarify","name":"Train or clarify","plain":"Teach people what to do and how.","family":"enable","runs_through":[],"counters":["information"],"side_effects":["training_becomes_box_ticking","training_effects_fade"],"cues":[],"unless":[],"levers":[],"counter_why":{"information":"People then know how to do what is asked."},"example":"A short session on what the control step protects.","actions":{"start":{"label":"Train more, or more people","example":"A short session on what the control step protects."},"adjust":{"label":"Change the format or content","example":"Swap the hour-long course for a ten-minute guide at the desk."},"stop":{"label":"Train less, or stop","example":"Drop the refresher for staff with five years’ service."}},"removes":false},{"id":"realign_incentive","name":"Remove the conflicting reward","plain":"Change the reward for the unwanted behaviour.","family":"enable","runs_through":[],"counters":["misaligned"],"side_effects":["effect_outlasts_removal","useful_effect_lost","short_term_incentive_weakens_motive"],"cues":[],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."},"example":"Stop paying the bonus on sales volume alone.","actions":{"start":{"label":"Remove the reward","example":"Stop paying the bonus on sales volume alone."},"adjust":{"label":"Move the reward to another target","example":"Pay the bonus on renewals instead of new sales."},"stop":{"label":"Bring the reward back","example":"Restore the bonus on sales volume."}},"removes":true}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours resistance. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is resistance. If effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap. If minimum effort persists, it is resistance."},{"a":"reactance","b":"hassle","observation":"You can remove one step for a random sample. If more of them complete it, or complete it properly, it was friction. If they still do the minimum, it is resistance."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity. If the easy parts still carry the number, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"You can look at the pattern inside the period. Gaming concentrates on the cheapest component. Procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target. If it is where another reward conflicts, it is a conflicting incentive."},{"a":"diffusion","b":"hassle","observation":"You can remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion. If only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. If checks remain shallow despite the extra time, this points to diffusion of responsibility. Deeper checks point to time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. If overrides remain rare despite the extra time, this points to deference to the model. More overrides would point to time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones track the model, including where it was wrong, they were deferring. If blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams that see breaches in units they feel no closeness to with teams that see only their own record. If compliance slides only where distant breaches are visible, weak ties are the problem. If both slide to the same minimum, it is resistance to the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance. If everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction. If compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds no message, the message with the statistic, or the same message without it. If the version without the statistic wins, the statistic was the problem. If both beat no message equally, attention did the work and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"You can check whose performance fell. If it is the people who used to do it without being paid or charged, payment is displacing existing motives. If it is where a competing reward is strongest, it is a conflicting incentive."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction. If starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity. If instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"You can observe three people attempting the task. If they know what to do but give up on the process, it is friction. If they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention. If most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default. If only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the intended time.","preset":{"change_iv":"mandate","change_mode":"adjust","change":"Keep the training required, and let managers choose its format and timing.","justify":"Choosing the format and timing gives managers back some control, which can ease their resistance to being told what to do","reason1":"Managers are too busy in the window to give the training proper time.","reason2":"Managers resent being required to take it and do the minimum.","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or resistance to the requirement? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","dobbin2020"]},{"id":"c1","kind":"preset","title":"The annual conduct module","short":"Conduct module","teaser":"After a regulatory finding, a 5,000‑person firm made its annual conduct module mandatory. Completion is now 100 per cent. The median time is 9 minutes.","theme":"Annual training in a regulated firm","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The client-review target","short":"Client-review target","teaser":"Each regional team’s bonus depends on 40 client reviews a quarter. For six quarters, every region has reported between 40 and 42.","theme":"A team target linked to the bonus","situation":"A services business set each regional team a target of 40 client reviews a quarter, tied to the team bonus.","behaviour":"Mean review length fell from 52 minutes to 31. Reviews booked in the last two weeks of the quarter rose from 18 to 47 per cent. Client satisfaction is unchanged. For six quarters, every region has reported between 40 and 42.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"numeric_target","likely":["metric_gaming","capacity","present_bias"],"bridge":"Why has no region reported more than 42 reviews in a quarter?"},{"id":"c3","kind":"preset","title":"The two-step sign-in campaign","short":"Sign-in campaign","teaser":"Weekly emails told 4,000 staff that only 38 per cent had switched on two-step sign-in. Sign-ups then stalled at 51 per cent.","theme":"A weekly email from IT security","situation":"An IT security team emailed all 4,000 staff every Monday for six weeks: 'Only 38 per cent of you have switched on two-step sign-in. Do not be one of the 62 per cent.'","behaviour":"Sign-ups rose in week one, then stalled at 51 per cent. In the three departments that were above 60 per cent before the emails, new sign-ups fell to almost none.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"publish_rate","likely":["descriptive_norm","hassle","information"],"bridge":"Why might sign-ups stop in the departments that were already ahead?"},{"id":"c4","kind":"preset","title":"The client-gift logging rule","short":"Gift-logging rule","teaser":"Group compliance emailed 30 country offices a rule to log client gifts above £50. Within six months, logging fell from 90 to 61 per cent.","theme":"A rule sent to 30 country offices","situation":"Group headquarters told all 30 country offices to log every client gift above £50 within a week. The rule arrived by email from the group compliance team, whom most offices have never met.","behaviour":"Logging ran at 90 per cent in month one and 61 per cent by month six. The fall was steepest in offices where staff could see that colleagues had stopped logging.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["social_proximity","descriptive_norm","hassle"],"bridge":"What would tell apart the offices that kept logging from those that stopped?"}],"checklist":["What exactly are people doing now, and how often?","What are two different reasons they might be doing it?","Is this a control intervention? If so, which voluntary effort might be lost?","Which unmeasured behaviour might the intervention affect, and whose?","Which indicator would show it, and who will review it?","What is the review trigger, and when is the review date?"],"glossary":[{"term":"RADAR","def":"Recognise the behaviour, Analyse the causes, Design the intervention, Act, Routinise. A five-step check used within a design scheme."},{"term":"Side effect","def":"An effect of the intervention on behaviour it was not intended to change, and which is not being measured. Also called an unintended consequence."},{"term":"Indicator","def":"An obtainable figure that would show whether a side effect, or the intended effect, is occurring."},{"term":"Distinguishing observation","def":"An observation that would come out differently depending on which of the two explanations is correct."},{"term":"Working hypothesis","def":"The explanation currently considered more likely. The intervention is designed around it, and the pilot tests it."},{"term":"Control and enabling designs","def":"A control design requires, monitors or prices a behaviour. An enabling design var BASIS4 = {
 "stuck_on_default": "A meta-analysis of 58 default studies with 73,675 participants found that defaults shift choices considerably on average, with wide variation (Jachimowicz and colleagues 2019). After automatic enrolment at one large US firm, a substantial fraction of new participants kept both the default contribution rate and the default fund (Madrian and Shea 2001).",
 "drift_to_stated_rate": "In a field experiment with 290 households, those below the neighbourhood average raised daily electricity use from 10.15 to 11.13 kWh once told the average. Similar households who also received an approving smiley stayed at baseline (Schultz and colleagues 2007). A larger programme of about 600,000 households did not show the drift, and its lowest-use tenth still cut use slightly (Allcott 2011). That a stated low rate slows action in organisations is a prediction.",
 "above_average_do_less": "In a field experiment with 290 households, those below the neighbourhood average raised daily electricity use from 10.15 to 11.13 kWh once told the average. Similar households who also received an approving smiley stayed at baseline (Schultz and colleagues 2007). Across about 600,000 households, use fell by 2.0 per cent on average, and the lowest-use tenth still cut their use slightly (Allcott 2011). Norm messages can backfire unless designed carefully (Bicchieri and Dimant 2022).",
 "minimum_compliance": "In a laboratory game, participants who played the employee chose lower effort on average when the participant who played the employer set a minimum, and more than half then chose exactly the minimum (Falk and Kosfeld 2006). Four repetitions found the same hidden cost, smaller than in the original (Ziegelmeyer, Schmelz and Ploner 2012). That it holds in firms is a prediction.",
 "goodwill_withdrawn": "In a field experiment with students, monitoring improved work quality only when incentives were harsh, and reduced punctuality whatever the incentives (Belot and Schröder 2016). In a laboratory game, participants who reacted negatively to control said they read it as a signal of distrust (Falk and Kosfeld 2006). Four repetitions found that cost of control again, smaller than in the original (Ziegelmeyer, Schmelz and Ploner 2012). That firms see less helping is a prediction.",
 "fine_becomes_price": "In a field experiment, ten day-care centres were observed for 20 weeks. Six introduced a fine of NIS 10 for delays of ten minutes or more. Late collection rose in those six and stayed high once the fine was removed, and the four control centres showed no noticeable change (Gneezy and Rustichini 2000). The authors read it as the fine changing how parents saw the arrangement. A review names four routes by which an incentive can displace existing motives (Bowles and Polanía-Reyes 2012).",
 "effect_outlasts_removal": "In a field experiment in ten day-care centres, late collection rose in the six that introduced a fine and stayed high once the fine was removed (Gneezy and Rustichini 2000). Two reviews find that incentives displace existing motives in some settings and not in others (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012).",
 "goes_underground": "Participant observation in a mobile-phone factory found that workers who were being watched hid their methods from supervisors (Bernstein 2012). That a fine or a ban has the same effect is a prediction.",
 "saving_licenses_use_elsewhere": "In 154 apartments, residents given weekly water-use feedback cut water use by 6.0 per cent but raised electricity use by 5.6 per cent relative to controls (Tiefenbeck and colleagues 2013). The authors read this as moral licensing, in which one good act is used to justify a less good one. That it happens in organisations is a prediction.",
 "report_cards_select_cases": "Cardiac surgery report cards in New York and Pennsylvania led providers to select patients and better matched patients to hospitals. On net they raised resource use and worsened health outcomes, particularly for sicker patients (Dranove and colleagues 2003). That it holds outside health care is a prediction.",
 "rank_feedback_backfires": "In a crowd-sourcing field experiment with no pay consequence, workers given rank feedback were less likely to return to work and less productive on the job than a control group (Barankay 2011, working paper). That it holds in organisations is a prediction.",
 "removing_screen_lets_through": "Across nearly 11.5 million government loans under the Paycheck Protection Program, screening reduced loan irregularities and cut fraud losses by at least 744 million dollars (Aman-Rana, Gingerich and Sukhtankar 2023, working paper). That it holds in other organisations is a prediction."
