body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* A keyboard user must see the skip target while it has focus. */
a.skip-link:focus,a.skip-link:focus-visible{position:fixed;top:8px;left:8px;z-index:1000;width:auto;height:auto;padding:12px 18px;clip:auto;overflow:visible;white-space:normal;background:var(--ink);color:var(--panel);border:3px solid var(--gold);border-radius:4px;text-decoration:underline;font:700 17px/1.3 system-ui,sans-serif}

a{color:var(--amber)}
/* ---------------- header ---------------- */
header.hd{position:sticky;top:0;z-index:40;background:var(--black);border-bottom:1px solid var(--line)}
@media (max-height:560px){header.hd{position:static}}   /* at 200 per cent zoom the header never takes half the screen */
.credit{max-width:1240px;margin:0 auto;padding:7px 20px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;font-size:13px;line-height:1.4;color:var(--muted)}
.credit a{color:inherit;font-weight:600;display:inline-block;padding:14px 0;margin:-14px 0;text-decoration:underline;text-underline-offset:2px}
.credit a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hrow{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px}
.mark{display:flex;gap:4px}.mark i{display:block;width:6px;height:24px;background:var(--amber)}
.brand b{display:block;font-size:21px;letter-spacing:.06em;color:var(--white)}
.brand span{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sp{flex:1}
.clock{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px}
.clock output{font-weight:700;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.clock.warn output{color:var(--red)}.clock.done output{color:var(--red)}
.clock small{font-size:13px;color:var(--muted);max-width:110px;line-height:1.2}
.ib{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:15px;background:var(--panel2)}
.ib:hover{border-color:var(--amber)}
.ib.pri{background:var(--amber);color:var(--black);border-color:var(--amber);font-weight:700}
.ib.pri:hover{background:var(--amber2)}
.ib[disabled]{cursor:not-allowed;color:var(--muted);background:var(--raise);border-color:var(--line2)}
nav.tabs{max-width:1240px;margin:10px auto 0;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:132px;text-align:left;padding:8px 12px 9px;border-radius:9px 9px 0 0;background:var(--panel);border-bottom:3px solid transparent;color:var(--muted)}
.tab .l{font-size:17px;font-weight:700;color:var(--muted);margin-right:7px}
.tab .n{font-size:13px;color:var(--ink)}
.tab .m{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.tab .live{color:var(--amber);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab[aria-current="step"]{background:var(--amberT);border-bottom-color:var(--amber)}
.tab[aria-current="step"] .l{color:var(--amber)}
.tab.done .l{color:var(--amber2)}
.tab.brief{min-width:96px}
/* ---------------- layout ---------------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 90px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:30px}
.wrap.full{grid-template-columns:minmax(0,1fr)}
main{min-width:0}
aside.rail{position:sticky;top:calc(var(--hdr,140px) + 14px);align-self:start;max-height:calc(100vh - var(--hdr,140px) - 30px);overflow:auto}
@media(max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}aside.rail{display:none}}
/* ---------------- step head ---------------- */
.sh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.badge{flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--amber);color:var(--black);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sh h2{font-size:28px;line-height:1.15;color:var(--white)}

.sh .plain{font-size:15px;color:var(--amber);margin-top:3px}
.sh .q{font-size:21px;color:var(--ink);margin-top:5px}
.sh .h{font-size:15px;color:var(--muted);margin-top:4px}
.livebar{display:flex;align-items:center;gap:10px;background:var(--amberT);border:1px solid rgba(var(--gold-rgb),.35);border-radius:var(--r);padding:9px 14px;margin:0 0 16px;font-size:15px}
.livebar b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
/* ---------------- cards and fields ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card.quiet{background:var(--panel2)}
.card h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:3px}
.card .hint{font-size:15px;color:var(--muted);margin-bottom:10px}
.card h4{font-size:17px;color:var(--white);margin-bottom:4px}
textarea,input[type=text],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;font-size:17px;line-height:1.45;resize:vertical}
textarea{min-height:76px;overflow:hidden}
textarea:focus,input:focus{outline:none;border-color:var(--amber);box-shadow:var(--focus)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
.lab{display:block;font-size:15px;font-weight:700;color:var(--white);margin:0 0 6px}
.sub{font-weight:400;color:var(--muted);font-size:13px}
@media(max-width:720px){label.lab>.sub:not(.inl){display:block;margin-top:2px}}   /* 2.0.0.14: on a phone the hint sits on its own line, never wrapped beside the label */
.given{font-size:15px;line-height:1.55;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:11px 13px}
/* ---------------- coach ---------------- */
.coach{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cq{display:flex;gap:10px;align-items:flex-start;background:rgba(var(--gold-rgb),.07);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 10px;font-size:15px}
.cq .qi{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cq .mw{display:inline-block;background:var(--raise);border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin:0 3px 0 0;font-size:13px;color:var(--muted)}
.cq .x{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:underline;white-space:nowrap}
.cq.warn{border-left-color:var(--red);background:var(--redT)}
.cq.warn .qi{background:var(--red)}
/* ---------------- chips and choice cards ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:15px}
.chip:hover{border-color:var(--amber2);background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--amberT);border-color:var(--amber);color:var(--white);font-weight:700}
.kinds{margin-top:8px}
@media(min-width:700px){.scant td:nth-child(2){min-width:10.5em}}.allk{margin-top:12px}.allk summary{cursor:pointer;color:var(--amber);font-size:15px}.kfam{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.chip small{color:var(--muted);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.choice{text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.choice:hover{border-color:var(--amber2);background:var(--raise)}
.choice[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 1px var(--amber)}
.choice b{font-size:17px;color:var(--white)}
.choice span{font-size:15px;color:var(--muted)}
.choice em{font-style:normal;font-size:13px;color:var(--ink)}
.fam{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;width:max-content}
.fam.control{background:var(--redT);color:var(--red)}.fam.enable{background:var(--greenT);color:var(--green)}
/* ---------------- think / reveal ---------------- */
.gatebtn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.gatebtn .why{font-size:13px;color:var(--muted)}
.reveal{border:1px solid rgba(var(--gold-rgb),.4);background:linear-gradient(180deg,rgba(var(--gold-rgb),.07),rgba(var(--gold-rgb),0) 60%);border-radius:var(--r);padding:16px 18px;margin:12px 0 14px}
.reveal.fresh{animation:rin .35s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.reveal>h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:8px}
.mech{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel2);margin-bottom:8px}
.mech .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mech .nm{font-weight:700;color:var(--white)}
.mech .tn{font-size:13px;color:var(--muted)}
.bars{display:inline-flex;gap:3px;margin-left:auto}.bars i{display:block;width:9px;height:14px;border-radius:2px;background:var(--line2)}.bars i.on{background:var(--amber)}
.whys{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.whys span{font-size:13px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.mech details{margin-top:6px}.mech summary{font-size:13px;color:var(--amber);cursor:pointer}
.mech .more{font-size:15px;color:var(--ink);margin-top:6px;display:flex;flex-direction:column;gap:6px}
.mech .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin-top:8px}
.tag b{color:var(--white)}
/* evidence badges */
.ev{font:inherit;background:none;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:5px;white-space:nowrap}
.ev.strong{border:1px solid var(--ink);color:var(--ink)}
.ev.mixed{border:1px solid var(--amber);color:var(--amber)}
.ev.extrapolation{border:1px dashed var(--muted);color:var(--muted)}
.ev.structural{border:1px solid var(--blue);color:var(--blue)}
.cite{font-size:13px;color:var(--muted)}
/* side-effect cards */
.se{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--panel2);margin-bottom:10px}
.se.close{border-color:var(--amber)}
.se .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.se .nm{font-weight:700;font-size:17px;color:var(--white)}
.se .who{font-size:13px;color:var(--muted)}
.se p{font-size:15px;margin-top:5px}
.se dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13px;margin-top:8px}
.se dt{color:var(--muted)}
.se .marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mk{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2)}
.mk[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);color:var(--white);font-weight:700}
.closest{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--black);background:var(--amber);border-radius:4px;padding:2px 7px;font-weight:700}
.trail{border-left:3px solid var(--amber);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:15px;margin:10px 0}
.prov{font-size:13px;margin-top:6px}.prov.tool{color:var(--red)}.prov.adapted{color:var(--amber)}.prov.own{color:var(--green)}
/* ---------------- dots ---------------- */
.dotrow{display:flex;align-items:center;gap:12px;margin:6px 0}
.dotrow .dl{width:170px;font-size:15px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;font-size:13px;color:var(--muted)}
.dot.on{background:var(--muted);border-color:var(--muted);color:var(--black)}
.dots.after .dot.on{background:var(--amber);border-color:var(--amber)}
.delta{font-size:15px;color:var(--ink);margin-top:6px}
@media(max-width:560px){.dotrow{flex-direction:column;align-items:flex-start}}
/* ---------------- nav foot ---------------- */
.foot{display:flex;align-items:center;gap:12px;margin-top:22px;margin-bottom:14px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .open{font-size:13px;color:var(--muted)}
.foot .open[data-live]{flex:1 1 100%;order:-1}.foot .open[data-live]:empty{display:none}
.foot .sp{flex:1}
/* ---------------- rail: the chain ---------------- */
.chain{display:flex;flex-direction:column;gap:0}
.chain h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.cn{display:block;width:100%;text-align:left;position:relative;padding:9px 12px 11px 30px;border-radius:9px}
.cn:hover{background:var(--panel)}
.cn::before{content:"";position:absolute;left:11px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--line2)}
.cn.ok::before{background:var(--amber)}
.cn::after{content:"";position:absolute;left:15px;top:25px;bottom:-12px;width:1px;background:var(--line2)}
.cn:last-child::after{display:none}
.cn b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cn span{display:block;font-size:15px;color:var(--ink);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cn span.o{color:var(--muted);font-style:italic}
.cn.hot b{color:var(--amber)}
.railnote{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.45}
/* ---------------- start ---------------- */
.hero h1{font-size:44px;letter-spacing:.04em;color:var(--white);line-height:1}
.hero .tl{font-size:28px;line-height:1.2;color:var(--white);margin-top:4px;max-width:820px;font-family:var(--serif)}
.hero .out{font-size:17px;color:var(--muted);margin-top:10px;max-width:820px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 26px}
@media(max-width:900px){.steps5{grid-template-columns:1fr 1fr}}
.s5{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.s5 .l{font-size:28px;font-weight:700;color:var(--amber)}
.s5 b{display:block;font-size:15px;color:var(--white);margin-top:2px}
.s5 span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.s5 span.pl{color:var(--amber);font-size:13px;margin-top:3px}
.s5 .m{font-size:13px;color:var(--muted);margin-top:6px}
.s5 .m span{display:inline;margin:0}
.s5 .live{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.cases{display:flex;flex-wrap:wrap;gap:12px}   /* a short last row stretches to the full width: no empty slot, an even gap */
.cs{flex:1 1 270px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:15px 16px}
.cs:hover{border-color:var(--amber)}
.cs{position:relative}
.cs[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 2px var(--amber)}
.cs[aria-pressed="true"]::after{content:"\2713  Chosen";position:absolute;top:10px;right:12px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--black);background:var(--amber);border-radius:999px;padding:2px 10px}
.cs[aria-pressed="true"] .k{padding-right:84px}
.cs b{display:block;font-size:17px;color:var(--white)}
.cs span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.cs .k{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.cs.own{border-style:solid;border-color:rgba(var(--gold-rgb),.5)}
.honest{font-size:13px;color:var(--muted);margin-top:18px;max-width:820px;line-height:1.5}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amberT);border:1px solid rgba(var(--gold-rgb),.4);border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
/* ---------------- brief ---------------- */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px}
@media(max-width:1100px){.bgrid{grid-template-columns:1fr}}
.paper{background:var(--panel);color:var(--teal2);border-radius:6px;padding:34px 38px;box-shadow:0 10px 40px rgba(var(--black-rgb),.5)}
.paper .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.paper h2{font-size:21px;color:var(--teal2);margin-top:3px}
.paper .meta{font-size:13px;color:var(--grey);margin-top:3px}
.paper hr{border:0;border-top:2px solid var(--gold);margin:12px 0 14px}
.paper .rb{background:var(--bg);border-left:3px solid var(--gold);padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:12px}
.paper .rb.no{font-weight:400;color:var(--grey)}
.paper .sec{border-top:1px solid var(--gold);padding:8px 0 6px}
.paper .sec h4{font-size:15px;color:var(--teal2);margin-bottom:4px}
.paper .sec h4 i{font-style:normal;color:var(--gold);margin-right:8px}
.paper dl{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:13px}
.paper dt{color:var(--grey);font-weight:700;font-size:13px;padding-top:1px}
.paper dd.o{color:var(--sage);font-style:italic}
.paper .map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:13px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.paper .map b{display:block;color:var(--grey);font-size:13px}
.paper .tr{font-size:13px;color:var(--grey);border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.paper .pft{font-size:13px;color:var(--grey);margin-top:6px}
@media(max-width:600px){.paper{padding:20px}.paper h2{font-size:21px}.paper dl{grid-template-columns:1fr}.paper .map{grid-template-columns:1fr 1fr}}
.checks{list-style:none;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.checks li i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;border:1.5px solid var(--line2)}
.checks li.ok i{background:var(--green);border-color:var(--green);position:relative}
.checks li.ok i::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--black)}
.checks li button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2)}
.checks li.ok button{color:var(--muted);text-decoration:none}

.exports .why{font-size:13px;color:var(--muted)}
.gatebtn .why,.exports .why{overflow-wrap:anywhere}
.rbbig{font-size:21px;line-height:1.4;color:var(--white);font-weight:700}
.rbbig.no{color:var(--muted);font-weight:400;font-size:15px}
/* ---------------- presenter (waterline) ---------------- */
.pres{position:fixed;inset:0;z-index:90;background:var(--black);display:flex;flex-direction:column;justify-content:safe center;padding:6vh 8vw;overflow-y:auto}
.pres .k{font-size:clamp(16px,1.4vw,24px);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.pres .above,.pres .se,.pres .sg,.pres .tgt{text-wrap:balance}
.pres .k2{margin-top:2.2vh;color:var(--muted);font-size:13px}
.pres .above{font-size:3.2vw;line-height:1.25;color:var(--white);max-width:78vw;margin-top:1.5vh}
.pres .tgt{font-size:1.6vw;color:var(--muted);margin-top:1.4vh}
.pres .water{height:3px;background:var(--amber);margin:4vh 0;transform-origin:left;animation:wl .8s ease-out both}
@keyframes wl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pres .below{opacity:0;animation:up .35s ease-out .25s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pres .water,.pres .below{animation:none;opacity:1}}
.pres .se{font-size:3vw;line-height:1.25;color:var(--amber);background:none;border:0;padding:0;font-weight:700}
.pres .sg{font-size:2vw;color:var(--white);margin-top:2vh}

and immoral outcomes. Review of Economic Studies, 87(5), 2205-2229.","doi":"10.1093/restud/rdz064","lab":true},{"id":"bisin_hyndman2020","short":"Bisin and Hyndman (2020)","text":"Bisin, A. and Hyndman, K. (2020). Present-bias, procrastination and deadlines in a field experiment. Games and Economic Behavior, 119, 339-357.","doi":"10.1016/j.geb.2019.11.010"},{"id":"belot_schroder2016","short":"Belot and Schröder (2016)","text":"Belot, M. and Schröder, M. (2016). The spillover effects of monitoring: a field experiment. Management Science, 62(1), 37-45.","doi":"10.1287/mnsc.2014.2089"},{"id":"neal_schanzenbach2010","short":"Neal and Schanzenbach (2010)","text":"Neal, D. and Schanzenbach, D. W. (2010). Left behind by design: proficiency counts and test-based accountability. Review of Economics and Statistics, 92(2), 263-283.","doi":"10.1162/rest.2010.12318"},{"id":"courty_marschke2004","short":"Courty and Marschke (2004)","text":"Courty, P. and Marschke, G. (2004). An empirical investigation of gaming responses to explicit performance incentives. Journal of Labor Economics, 22(1), 23-56.","doi":"10.1086/380402"},{"id":"jacob2005","short":"Jacob (2005)","text":"Jacob, B. A. (2005). Accountability, incentives and behavior: the impact of high-stakes testing in the Chicago Public Schools. Journal of Public Economics, 89(5-6), 761-796.","doi":"10.1016/j.jpubeco.2004.08.004"},{"id":"propper2010","short":"Propper et al. (2010)","text":"Propper, C., Sutton, M., Whitnall, C. and Windmeijer, F. (2010). Incentives and targets in hospital care: evidence from a natural experiment. Journal of Public Economics, 94(3-4), 318-335.","doi":"10.1016/j.jpubeco.2010.01.002"},{"id":"jones_molitor_reif2019","short":"Jones, Molitor and Reif (2019)","text":"Jones, D., Molitor, D. and Reif, J. (2019). What do workplace wellness programs do? Evidence from the Illinois Workplace Wellness Study. Quarterly Journal of Economics, 134(4), 1747-1791.","doi":"10.1093/qje/qjz023"},{"id":"kawaguchi2021","short":"Kawaguchi (2021)","text":"Kawaguchi, K. (2021). When will workers follow an algorithm? A field experiment with a retail business. Management Science, 67(3), 1670-1695.","doi":"10.1287/mnsc.2020.3599"},{"id":"jachimowicz2019","short":"Jachimowicz et al. (2019)","text":"Jachimowicz, J. M., Duncan, S., Weber, E. U. and Johnson, E. J. (2019). When and why defaults influence decisions: a meta-analysis of default effects. Behavioural Public Policy, 3(2), 159-186.","doi":"10.1017/bpp.2018.43"},{"id":"finkelstein2009","short":"Finkelstein (2009)","text":"Finkelstein, A. (2009). E-ZTax: tax salience and tax rates. Quarterly Journal of Economics, 124(3), 969-1010.","doi":"10.1162/qjec.2009.124.3.969"},{"id":"bhargava_manoli2015","short":"Bhargava and Manoli (2015)","text":"Bhargava, S. and Manoli, D. (2015). Psychological frictions and the incomplete take-up of social benefits: evidence from an IRS field experiment. American Economic Review, 105(11), 3489-3529.","doi":"10.1257/aer.20121493"},{"id":"carroll2009","short":"Carroll et al. (2009)","text":"Carroll, G. D., Choi, J. J., Laibson, D., Madrian, B. C. and Metrick, A. (2009). Optimal defaults and active decisions. Quarterly Journal of Economics, 124(4), 1639-1674.","doi":"10.1162/qjec.2009.124.4.1639"},{"id":"dolan2010","short":"Dolan et al. (2010)","text":"Dolan, P., Hallsworth, M., Halpern, D., King, D. and Vlaev, I. (2010). MINDSPACE: Influencing behaviour through public policy. Institute for Government and Cabinet Office."},{"id":"gollwitzer1999","short":"Gollwitzer (1999)","text":"Gollwitzer, P. M. (1999). Implementation intentions: strong effects of simple plans. American Psychologist, 54(7), 493-503.","doi":"10.1037/0003-066X.54.7.493"},{"id":"mitchell1989","short":"Mitchell, Russo and Pennington (1989)","text":"Mitchell, D. J., Russo, J. E. and Pennington, N. (1989). Back to the future: temporal perspective in the explanation of events. Journal of Behavioral Decision Making, 2(1), 25-38.","doi":"10.1002/bdm.3960020103"},{"id":"klein2007","short":"Klein (2007)","text":"Klein, G. (2007). Performing a project premortem. Harvard Business Review, 85(9), 18-19."},{"id":"allcott_rogers2014","short":"Allcott and Rogers (2014)","text":"Allcott, H. and Rogers, T. (2014). The short-run and long-run effects of behavioral interventions: experimental evidence from energy conservation. American Economic Review, 104(10), 3003-3037.","doi":"10.1257/aer.104.10.3003"},{"id":"nagin2002","short":"Nagin, Rebitzer, Sanders and Taylor (2002)","text":"Nagin, D. S., Rebitzer, J. B., Sanders, S. and Taylor, L. J. (2002). Monitoring, motivation, and management: the determinants of opportunistic behavior in a field experiment. American Economic Review, 92(4), 850-873.","doi":"10.1257/00028280260344498"},{"id":"obermeyer2019","short":"Obermeyer et al. (2019)","text":"Obermeyer, Z., Powers, B., Vogeli, C. and Mullainathan, S. (2019). Dissecting racial bias in an algorithm used to manage the health of populations. Science, 366(6464), 447-453.","doi":"10.1126/science.aax2342"}],"steps":[{"id":"recognise","outline":"Assessment Phase 1: define the target behaviour","outline_full":"Assessment Phase 1: Define the target behaviour","plain":"What people do now, in numbers","letter":"R","name":"Recognise","question":"What do people currently do?","why":"You can only judge an intervention against something you can count.","done":"You have the behaviour and the current intervention.","help":"Say it in figures someone could count.","minutes":5,"live":false,"sceptic":"Could you measure this next week?","research":{"headline":"A proxy can hide the behaviour that matters","finding":"A widely used US health algorithm took health costs as a proxy for need, and remedying the resulting disparity would raise the share of Black patients receiving extra help from 17.7 to 46.5 per cent.","manager":"count the behaviour itself, not an easier proxy.","plate":{"title":"Share of Black patients receiving extra help","unit":"%","highlight":1,"source":"obermeyer2019","bars":[["Current algorithm",17.7],["Spending gap removed (simulated)",46.5]]},"scope":"The study examined one widely used commercial algorithm in US health care. The size of the bias depends on the spending gap in each health system."},"citations":["obermeyer2019"]},{"id":"analyse","outline":"Assessment Phase 2: diagnose barriers and enablers","outline_full":"Assessment Phase 2: Diagnose barriers and enablers to the target behaviours","plain":"Two explanations, and the likelier one","letter":"A","name":"Analyse","question":"Why might people behave this way?","why":"Different causes need different interventions.","done":"You have two explanations, a cause for each and the likelier one.","help":"Two explanations. Click a cause for each, then the likelier one.","minutes":5,"live":true,"sceptic":"What would you see if the first cause were wrong?","research":{"after_pm":true,"headline":"One message moved light users the wrong way","finding":"Households already below the neighbourhood average raised their daily use from 10.15 to 11.13 kWh once told the average. Similar households who also received an approving smiley stayed at baseline.","manager":"check which cause fits which people before you choose. One message can help one group and harm another.","plate":{"title":"Daily electricity use of below-average homes, kWh","unit":"","highlight":1,"source":"schultz2007","bars":[["Average only, before",10.15],["Average only, weeks later",11.13],["Average and smiley, before",10.04],["Average and smiley, weeks later",10.14]]},"scope":"Doorhanger messages to 290 households in San Marcos, California. The last meter reading came about four weeks after the first message. The figures are for the below-average homes (68 and 70 households)."},"citations":["schultz2007"]},{"id":"design","outline":"Assessment Phase 3: design the strategy and pretest","outline_full":"Assessment Phase 3: Design the strategy to influence behaviour and pretest interventions","plain":"One intervention for the likelier cause","letter":"D","name":"Design","question":"Which intervention addresses the more likely cause?","why":"An intervention works only if it tackles the real cause.","done":"You have one intervention for the likelier cause.","help":"Pick one intervention for the likelier cause.","minutes":6,"live":false,"sceptic":"Which cause does this leave untouched?","research":{"after_pm":true,"headline":"A fine for lateness made lateness more common","finding":"At one of six day-care centres that fined late pick-ups, late-coming parents rose from 7.25 to 12.5 a week, and to 15.25 after the fine was withdrawn.","manager":"ask whether a control turns a duty into a price or signals distrust. Try an enabling option first.","plate":{"title":"Late-coming parents per week at one fined centre","unit":"","highlight":2,"source":"gneezy_rustichini2000","bars":[["Before the fine, weeks 1 to 4",7.25],["With the fine, weeks 5 to 16",12.5],["After it ended, weeks 17 to 20",15.25]]},"scope":"Ten day-care centres were observed for 20 weeks. Six introduced a fine of NIS 10 for delays of ten minutes or more, and the four control centres showed no noticeable change. Falk and Kosfeld report the distrust reading of control from a laboratory game."},"citations":["gneezy_rustichini2000","falk_kosfeld2006"]},{"id":"act","outline":"Assessment Phase 4: implement the intervention","outline_full":"Assessment Phase 4: Implement the intervention (hypothetical)","plain":"Who starts, and by when","letter":"A","name":"Act","question":"Who takes the first step, and by when?","why":"Nothing happens until someone owns the first step.","done":"You have a first step, an owner and a deadline.","help":"Name the first step, who takes it and by when.","minutes":2,"live":false,"sceptic":"Would the owner agree to this next week?","research":{"headline":"Plans that fix when and where are carried out more often","finding":"Gollwitzer reviews experiments in which if-then plans, stating when, where and how a person will act, helped people act on intentions they already held.","manager":"leave with one name, one first step and one date.","plate":null,"scope":"Experiments on individuals pursuing their own goals, reviewed by the psychologist who proposed the concept."},"citations":["gollwitzer1999"]},{"id":"routinise","outline":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","outline_full":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","plain":"How it could backfire, and what to watch","letter":"R","name":"Routinise","question":"Why did the intervention backfire?","why":"Side effects are cheapest to fix before launch.","done":"You have the side effect to watch, how you would check it and your decision on the design.","help":"Say how it failed, then what to watch.","minutes":12,"live":true,"sceptic":"Who would rather this side effect never showed up in a report?","research":{"headline":"Treating a failure as certain brings fuller explanations","finding":"People who treated an outcome as certain, as if it had already happened, wrote longer explanations with more concrete reasons. Mitchell, Russo and Pennington called this prospective hindsight, and Klein built it into the pre-mortem.","manager":"give each likely side effect an indicator you can count.","plate":null,"scope":"Laboratory studies of how people explain events. Klein describes the pre-mortem as a working method for project teams."},"citations":["mitchell1989","klein2007"]}],"frameworks":[{"id":"basic","name":"BASIC","kind":"scheme","owner":"OECD","expansion":"Behaviour, Analysis, Strategies, Intervention, Change","stages":["Behaviour","Analysis","Strategies","Intervention","Change"],"plain":"A five-stage process from defining a target behaviour to scaling an intervention.","side_effects":"It names ‘potential side effects’ as one of the nine parts of every behavioural insight, asks at the Behaviour stage about ‘any potential risks or unintended consequences’, and says to monitor potential side effects ‘throughout all relevant stages’.","gap":"BASIC asks you to consider side effects and plan measures to monitor them. RADAR adds a list linking each type of intervention to its known side effects and an indicator for each.","radar_map":{"recognise":"Behaviour","analyse":"Analysis","design":"Strategies","act":"Intervention","routinise":"Change"},"assessment":"Named in the course outline as an example design scheme.","citation":"oecd_basic2019"},{"id":"tests","name":"TESTS","kind":"scheme","owner":"Behavioural Insights Team","expansion":"Target, Explore, Solution, Trial, Scale","stages":["Target","Explore","Solution","Trial","Scale"],"plain":"BIT's five-phase method for running a behavioural project, moving back and forth between phases as you learn.","side_effects":"Asks at the Solution phase, when you prioritise interventions: 'Are there any potential safety considerations, possible negative side-effects or any other ethical concerns?', and whether the initiative could harm equity. Its worked example gives one specific side effect.","gap":"It offers a question and a worked example. RADAR adds a route from each type of intervention to its likely side effects and an indicator for each.","radar_map":{"recognise":"Target","analyse":"Explore","design":"Solution","act":"Trial","routinise":"Scale"},"assessment":"Named in the course outline as an example design scheme.","citation":"bit_tests"},{"id":"rare","name":"RARE","kind":"scheme","owner":"Rare (rare.org)","expansion":"Rare's Behavior-Centered Design: Frame, Empathize, Map, Ideate, Prototype, Test, Launch, Assess","stages":["Frame","Empathize","Map","Ideate","Prototype","Test","Launch","Assess"],"plain":"Rare's own eight-step method, Behavior-Centered Design, described in the toolkit Rare wrote with the Behavioural Insights Team (2019).","side_effects":"The toolkit's chapters on strategies warn that payments can crowd out the motives people already had, that a fine can be read as a price, and that guilt and fear appeals can backfire, with remedies for each.","gap":"It gives specific warnings for incentives, fines and emotional appeals. RADAR extends this to other types of intervention, with an indicator for each side effect.","radar_map":{"recognise":"Frame and Empathize","analyse":"Map","design":"Ideate and Prototype","act":"Test and Launch","routinise":"Assess"},"assessment":"Named in the course outline as an example design scheme, and among the Phase 3 methods.","citation":"rare_bit2019"},{"id":"east","name":"EAST","kind":"inventory","owner":"Behavioural Insights Team","expansion":"Easy, Attractive, Social, Timely","stages":["Easy","Attractive","Social","Timely"],"plain":"Four levers for making a behaviour more likely.","side_effects":"The revised edition (2024) adds ‘behavioural pitfall’ boxes, for example on financial incentives that backfire by undermining the reasons people already had.","gap":"It is a list of levers, some with warnings, used within the Design step. RADAR adds a step for anticipating side effects.","radar_map":{"design":"Choosing the lever"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"bit_east2024"},{"id":"mindspace","name":"MINDSPACE","kind":"inventory","owner":"Institute for Government and Cabinet Office","expansion":"Messenger, Incentives, Norms, Defaults, Salience, Priming, Affect, Commitments, Ego","stages":["Messenger","Incentives","Norms","Defaults","Salience","Priming","Affect","Commitments","Ego"],"plain":"A checklist of nine influences on behaviour, set inside the report's 6 Es framework for applying them to policy.","side_effects":"Says it ‘can also show how policymaking can have unintended and perverse effects on behaviour’, with examples such as the energy-use boomerang, where households below the average used more once told the average.","gap":"It gives examples. RADAR adds a route from a planned intervention to its likely side effects and their indicators.","radar_map":{"design":"Choosing the influence"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"dolan2010"}],"mechanisms":[{"id":"reactance","family":"behavioural","name":"Resistance to control","technical":"Reactance and the hidden costs of control","gloss":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom. A related finding, the hidden costs of control, is that some people then do the minimum the rule requires and withdraw the effort nobody specified.","example":"Managers complete mandatory training at the minimum time the system allows, and stop volunteering for related work.","see":["Behaviour clusters at the minimum the rule will accept","A voluntary version of the same activity gets more real engagement","Related effort that was never required falls after the rule starts"],"cues":["mandatory","compulsory","required","requirement","forced","enforce","enforced","imposed","policed","monitored","surveillance","tick box","box ticking","bare minimum","do the minimum","minimum effort","minimum required","just the minimum","resent","resentment","pushback from","pushback against","pushback problem","pushback issue","push back against","get pushback","getting pushback","face pushback","facing pushback","lots of pushback","strong pushback","told to","micromanaged","micromanage","micromanagement","feel controlled","feel distrusted","treated like children","waste of time","telling off","told off","humiliating","humiliated","public shaming","take their jobs","take their job","take our jobs","lose their jobs","lose their job","lose our jobs","job losses","job security","made redundant"],"strength":"mixed","basis":"Two related findings support this. Reactance theory: people push back to restore a freedom that is threatened (Brehm). The hidden costs of control: in a laboratory principal-agent game, being controlled lowered the effort of most agents, and agents who reacted negatively said they read the control as a signal of distrust (Falk and Kosfeld). Four repetitions found these hidden costs, smaller than in the original, and control often still paid for the principal (Ziegelmeyer and colleagues). Observational data from more than 800 US firms link mandatory diversity training to lower diversity five years on, which the authors attribute to resistance (Dobbin and Kalev).","citations":["brehm1966","falk_kosfeld2006","ziegelmeyer2012","dobbin_kalev2016"],"line":"People push back when a rule removes choice or signals distrust.","short":"Resistance to control"},{"id":"crowding_out","family":"behavioural","name":"Payment displaces existing motives","technical":"Motivation crowding out","gloss":"A fine, fee or bonus can turn a social or professional duty into a purchase, and some people then buy their way out.","example":"After a late fee was introduced at day-care centres, more parents collected their children late.","see":["The behaviour gets worse among people who used to do it without being paid or charged","People talk about the fee or the bonus, not the reason for the rule","Removing the fee or bonus does not bring the old behaviour back"],"cues":["penalty","penalties","penalised","late fee","late fees","charge~~=fee","charge~~=fees","pay~~=fee","pay~~=fees","new fee","new fees","introduce~~=fee","introduce~~=fees","=charged","charge for","charge them","bonus","bonuses","incentive","incentives","=reward","=rewards","reward them","reward people","reward staff","rewarded for doing","=commission","=commissions","paid for","small fee","cheap wage","out of pride","good heart","when no money","paid a small"],"strength":"mixed","basis":"Real but context-dependent: a field experiment in day-care centres and two broad reviews find incentives can crowd out the motives people already e","appoint a","appoint an","nominate a","responsible for each","individual responsible","single official responsible","one person responsible","appoint one responsible","assign one person","case manager responsible","named case manager","take responsibility for each","one responsible person"],"unless":[],"levers":[],"counter_why":{"diffusion":"Responsibility can no longer be diffused across several people."},"example":"Name one person who owns the theatre start time.","actions":{"start":{"label":"Name an owner, or widen their remit","example":"Name one person who owns the theatre start time."},"adjust":{"label":"Change who owns it","example":"Hand the start time from the clinical lead to the theatre manager."},"stop":{"label":"Share it again, or narrow the role","example":"Return the start time to the whole theatre team."}},"removes":false},{"id":"human_check","name":"Retain human review","plain":"Blind-review a sample, or require a reason for agreeing with the model.","family":"enable","runs_through":[],"counters":["automation_bias"],"side_effects":["reasons_become_boilerplate"],"cues":["blind review","human review","second look","justify"],"unless":["explain~~director","explain~~boss","explain~~supervisor","explain~~head of","explain~~chief","explain~~committee","explain~~=board","explain~~senior","explain~~line manager","explain~~their manager","explain~~your manager","explain~~his manager","explain~~her manager","justify~~director","justify~~boss","justify~~supervisor","justify~~head of","justify~~chief","justify~~committee","justify~~=board","justify~~senior","justify~~line manager","justify~~their manager","justify~~your manager","justify~~his manager","justify~~her manager","report~~director","report~~boss","report~~supervisor","report~~head of","report~~chief","report~~committee","report~~=board","report~~senior","report~~line manager","report~~their manager","report~~your manager","report~~his manager","report~~her manager","account for~~director","account for~~boss","account for~~supervisor","account for~~head of","account for~~chief","account for~~committee","account for~~=board","account for~~senior","account for~~line manager","account for~~their manager","account for~~your manager","account for~~his manager","account for~~her manager","answer to~~director","answer to~~boss","answer to~~supervisor","answer to~~head of","answer to~~chief","answer to~~committee","answer to~~=board","answer to~~senior","answer to~~line manager","answer to~~their manager","answer to~~your manager","answer to~~his manager","answer to~~her manager"],"levers":[],"counter_why":{"automation_bias":"It forces an independent judgement before the model's answer is seen."},"example":"A reviewer checks a blind sample of the model's decisions.","actions":{"start":{"label":"Review more of the model’s decisions","example":"A reviewer checks a blind sample of the model’s decisions."},"adjust":{"label":"Change how the review works","example":"Ask for a reason on a random sample, not on every case."},"stop":{"label":"Review less, or stop","example":"Check 1 in 100 decisions instead of 1 in 10."}},"removes":false},{"id":"basket_of_measures","name":"Use a small set of measures","plain":"Pair the target with a counterweight that is hard to game.","family":"enable","runs_through":[],"counters":["metric_gaming"],"side_effects":["attention_spread_thin"],"cues":["basket","balanced scorecard","counterweight","quality measure","combine~~quality","score both","several indicators","combine two measures","balanced index","combine~~metrics","combine~~measures","two performance metrics","several performance measures","index of quality"],"unless":[],"levers":[],"counter_why":{"metric_gaming":"Several measures are harder to game than one."},"example":"Track complaints next to the sales target.","actions":{"start":{"label":"Add measures to the set","example":"Track complaints next to the sales target."},"adjust":{"label":"Swap one measure for another","example":"Track repeat visits instead of complaints."},"stop":{"label":"Drop measures from the set","example":"Go back to the sales target alone."}},"removes":false},{"id":"add_capacity","name":"Add time or resources","plain":"Give people the time, cover or budget the behaviour needs.","family":"enable","runs_through":[],"counters":["capacity"],"side_effects":["time_absorbed"],"cues":["more time","extra day","extra days","extra afternoon","extra hour","another afternoon","additional colleague","extra colleague","headcount","cover for","extra cover","resource","resources","protected time","hire a","hire an","hire~more","hire~extra","hire~additional","recruit a","recruit~more","recruit~extra","backfill","locum","temporary staff","agency staff","extra~staff","more~staff","additional~staff","more people","extra people","more capacity","extra capacity","more hands","add another nurse","add another worker","add another person","add~~nurse","add~~doctor","add~~staff","increase staffing","staff the peak","more shift cover","additional pharmacist","additional caseworker","extra caseworker","extra paid time","another shift worker","another cashier","additional cashier","another clinician","extra clerk","another engineer","additional nurse","another pharmacist","more paid time","additional operator","extra operator"],"unless":[],"levers":[],"counter_why":{"capacity":"It removes the constraint instead of working around it."},"example":"Free two hours a week for the review.","actions":{"start":{"label":"Add time or resources","example":"Free two hours a week for the review."},"adjust":{"label":"Change how the time is used","example":"Book the two hours as a fixed Tuesday slot."},"stop":{"label":"Cut the time or resources","example":"Cut the review time from two hours to one."}},"removes":false},{"id":"train_clarify","name":"Train or clarify","plain":"Close the knowledge or skill gap.","family":"enable","runs_through":[],"counters":["information"],"side_effects":["training_becomes_box_ticking"],"cues":["training","train","guidance","clarify","coaching","coach staff","coach employees","instructions","written instructions","clearer written instructions","one to one coaching"],"unless":[],"levers":[],"counter_why":{"information":"People then know how to do what is asked."},"example":"A short session on what the control step protects.","actions":{"start":{"label":"Train more, or more people","example":"A short session on what the control step protects."},"adjust":{"label":"Change the format or content","example":"Swap the hour-long course for a ten-minute guide at the desk."},"stop":{"label":"Train less, or stop","example":"Drop the refresher for staff with five years’ service."}},"removes":false},{"id":"realign_incentive","name":"Remove the conflicting reward","plain":"Change the rule or reward that pays for the behaviour you want to stop.","family":"enable","runs_through":[],"counters":["misaligned"],"side_effects":["effect_outlasts_removal","useful_effect_lost"],"cues":["realign","remove the incentive","remove~~bonus","change the bonus","conflicting target"],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."},"example":"Stop paying the bonus on sales volume alone.","actions":{"start":{"label":"Remove all or part of the reward","example":"Stop paying the bonus on sales volume alone."},"adjust":{"label":"Change which part goes","example":"Cut the renewals bonus instead of the new-sales bonus."},"stop":{"label":"Bring the reward back","example":"Restore the bonus on sales volume."}},"removes":true}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours resistance. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is resistance. If effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap. If minimum effort persists, it is resistance."},{"a":"reactance","b":"hassle","observation":"You can remove one step for a random sample. If more of them complete it, or complete it properly, it was friction. If they still do the minimum, it is resistance."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity. If the easy parts still carry the number, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"You can look at the pattern inside the period. Gaming concentrates on the cheapest component. Procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target. If it is where another reward conflicts, it is a conflicting incentive."},{"a":"diffusion","b":"hassle","observation":"You can remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion. If only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. If checks remain shallow despite the extra time, this points to diffusion of responsibility. Deeper checks point to time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. If overrides remain rare despite the extra time, this points to deference to the model. More overrides would point to time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones track the model, including where it was wrong, they were deferring. If blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams that see breaches in units they feel no closeness to with teams that see only their own record. If compliance slides only where distant breaches are visible, weak ties are the problem. If both slide to the same minimum, it is resistance to the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance. If everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction. If compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds no message, the message with the statistic, or the same message without it. If the version without the statistic wins, the statistic was the problem. If both beat no message equally, attention did the work and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"You can check whose performance fell. If it is the people who used to do it without being paid or charged, payment is displacing existing motives. If it is where a competing reward is strongest, it is a conflicting incentive."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction. If starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity. If instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"You can observe three people attempting the task. If they know what to do but give up on the process, it is friction. If they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention. If most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default. If only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the designed time.","preset":{"change_iv":"mandate","change_mode":"adjust","change":"Keep the training required, and let managers choose its format and timing","justify":"Choosing the format and timing gives managers back some control, which can ease their resistance to being told what to do","reason1":"Managers are too busy in the window to give the training proper time.","reason2":"Managers resent being required to take it and do the minimum.","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or resistance to the requirement? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","kalev_dobbin2020"]},{"id":"c1","kind":"preset","title":"The annual conduct module","short":"Conduct module","teaser":"After a regulatory finding, a 5,000-person firm made its annual conduct module mandatory. Completion is now 100 per cent. The median time is 9 minutes.","theme":"Annual training in a regulated firm","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The client-review target","short":"Client-review target","teaser":"Each regional team’s bonus depends on 40 client reviews a quarter. For six quarters, every region has reported between 40 and 42.","theme":"A team target linked to the bonus","situation":"A services business set each regional team a target of 40 client reviews a quarter, tied to the team bonus.","behaviour":"Mean review length fell from 52 minutes to 31. Reviews booked in the last two weeks of the quarter rose from 18 to 47 per cent. Client satisfaction is unchanged. For six quarters, every region has reported between 40 and 42.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"numeric_target","likely":["metric_gaming","capacity","present_bias"],"bridge":"Why has no region reported more than 42 reviews in a quarter?"},{"id":"c3","kind":"preset","title":"The two-step sign-in campaign","short":"Sign-in campaign","teaser":"Weekly emails told 4,000 staff that only 38 per cent had switched on two-step sign-in. Sign-ups then stalled at 51 per cent.","theme":"A weekly email from IT security","situation":"An IT security team emailed all 4,000 staff every Monday for six weeks: 'Only 38 per cent of you have switched on two-step sign-in. Do not be one of the 62 per cent.'","behaviour":"Sign-ups rose in week one, then stalled at 51 per cent. In the three departments that were above 60 per cent before the emails, new sign-ups fell to almost none.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"publish_rate","likely":["descriptive_norm","hassle","information"],"bridge":"Why might sign-ups stop in the departments that were already ahead?"},{"id":"c4","kind":"preset","title":"The client-gift logging rule","short":"Gift-logging rule","teaser":"Group compliance emailed 30 country offices a rule to log client gifts above £50. Within six months, logging fell from 90 to 61 per cent.","theme":"A rule sent to 30 country offices","situation":"Group headquarters told all 30 country offices to log every client gift above £50 within a week. The rule arrived by email from the group compliance team, whom most offices have never met.","behaviour":"Logging ran function phaseTag(label) { var f = PHASE_OF[label]; return f ? '<div class="phtag" title="' + f + '">' + f.split(":")[0] + '</div>' : "";   /* a block of its own under the label */ }
function pitchRows() { var p = E.briefModel(S, S.scheme).pitch; return classRoute() ? p.filter(function (r) { return r[0] !== "Next time we will"; }) : p; }
/* a number never parts from its unit at a line end: "30 per cent", "20 %" (applied to escaped text) */
function tieUnits(x) { return String(x).replace(/(\d)\s+(%|per cent|percent)/g, "$1\u00a0$2").replace(/per cent/g, "per\u00a0cent"); }
function presenterHTML() {
  /* your insights: four items in large type, the group's speaking notes on its own laptop. Nothing is projected */

    (S.group || E.CASE[S.case] ? '<div class="k">' + esc(S.group || E.CASE[S.case].short) + '</div>' : "") + '<dl class="p5">' +   /* 2.0.0.14 (T2): no empty heading */

      (r[0] === "Our intervention" ? '<dd class="lever">Name its EAST or MINDSPACE lever.</dd>' : ""); }).join("") + '</dl></div></div>';   /* 2.0.0.18 (S7): a fixed cue, never a guess */
}
/* long answers shrink the type until the four items fit the screen, never below a readable size */
function fitPresenter() {
  var pres = $(".pres.pitch"); if (!pres) return;
  var dds = $$(".pres.pitch .p5 dd:not(.lever)"); if (!dds.length) return;
  /* 2.0.0.18 (S7): the lever cue stays a step smaller than the answers as they shrink */
  var lev = $$(".pres.pitch .p5 dd.lever");
  dds.concat(lev).forEach(function (d) { d.style.fontSize = ""; });
  var size = parseFloat(getComputedStyle(dds[0]).fontSize) || 30, guard = 0;
  var lev0 = lev.length ? parseFloat(getComputedStyle(lev[0]).fontSize) || 17 : 17;
  function setLev() { var s = Math.min(lev0, Math.max(15, size * 0.8)); lev.forEach(function (d) { d.style.fontSize = s + "px"; }); }
  setLev();
  while (pres.scrollHeight > pres.clientHeight + 1 && size > 22 && guard++ < 40) { size -= 2; dds.forEach(function (d) { d.style.fontSize = size + "px"; }); setLev(); }
}
