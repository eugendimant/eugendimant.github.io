:root{
  --ink:#0e1013;--ink2:#14171b;--ink3:#1b1f25;--line:#272b32;--line2:#3b414b;--line3:#6d727b;
  --tx:#ece7dc;--tx2:#bdb8ac;--mut:#96928a;--amb:#e9b23c;--amb2:#f4cf7a;--ambd:#5c4514;--onamb:#17130a;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --t1:0.8125rem;--ts:0.8125rem;--t2:0.875rem;--t3:1rem;--t4:1.25rem;--t5:1.75rem;--t6:2.75rem;--t7:4.5rem;
  --pad:1.75rem;--ps:1;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--tx);font:400 var(--t3)/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
body{text-wrap:balance}textarea{text-wrap:wrap}textarea::placeholder{color:var(--mut);opacity:1}
button{cursor:pointer}
p,h1,h2,h3{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.skip-link:focus{position:fixed;top:0.5rem;left:0.5rem;z-index:1000;width:auto;height:auto;padding:0.75rem 1.125rem;clip:auto;overflow:visible;background:var(--amb);color:var(--onamb)}
:focus-visible{outline:2px solid var(--amb2);outline-offset:2px}
h1:focus,h2:focus,main:focus{outline:0}
.tw{white-space:nowrap}
.lab{font:700 var(--t1)/1.25 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sub{font-size:var(--t2);color:var(--tx2)}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;height:100dvh}

/* header: wordmark and the five steps on one line */
.top{display:flex;align-items:center;gap:2.5rem;padding:0 var(--pad);height:3.75rem;border-bottom:1px solid var(--line)}
.wm{font:600 var(--t4)/1 var(--serif);letter-spacing:.34em}
.rail{display:flex;align-items:center;flex:1;max-width:47.5rem;min-width:0}
.st{display:flex;align-items:baseline;gap:0.5rem;background:none;border:0;padding:0.5rem 0;color:var(--mut);white-space:nowrap}
.st b{font:600 var(--t4)/1 var(--serif)}
.st span{font:400 var(--t2)/1 var(--sans)}
.st.done{color:var(--tx2)}.st.on{color:var(--amb)}.st:hover{color:var(--tx)}
.seg{flex:1;height:1px;background:var(--line2);margin:0 0.875rem;position:relative;min-width:0.875rem}
.seg i{position:absolute;inset:0;background:var(--amb);transform-origin:left;transform:scaleX(0);transition:transform .7s var(--ease)}
.seg.done i{transform:scaleX(1)}
.who{margin-left:auto;display:flex;align-items:center;gap:1rem;font-size:var(--t2);color:var(--tx2);white-space:nowrap}
.rst{display:flex;align-items:center;gap:0.625rem}
.savewarn{color:var(--amb)}

/* the plan in one line, once its lane has closed */
.strip{display:flex;gap:0.875rem;align-items:baseline;padding:0 var(--pad);max-height:0;overflow:hidden;opacity:0;transition:max-height .6s var(--ease),opacity .4s,padding .6s var(--ease);border-bottom:1px solid transparent}
[data-step=disclose] .strip,[data-step=adjust] .strip,[data-step=record] .strip{max-height:7.5rem;opacity:1;padding:0.6875rem var(--pad);border-color:var(--line)}
.strip .lab{flex:none}
.strip p{font:400 var(--t4)/1.3 var(--serif);min-width:0}
.strip .k{margin-left:auto;white-space:nowrap;font-size:var(--t2);color:var(--mut)}
/* the decision, shown on Record */
.band{padding:0 var(--pad);max-height:0;overflow:hidden;opacity:0;transition:max-height .7s var(--ease),opacity .5s .15s,padding .7s var(--ease);border-bottom:1px solid transparent}
[data-step=record] .band{max-height:22.5rem;opacity:1;padding:1rem var(--pad) 0.875rem;border-color:var(--line)}
.bh{font:400 var(--t6)/1.08 var(--serif);letter-spacing:-.01em}
.bt{font-size:var(--t4);line-height:1.4;margin-top:0.5rem;color:var(--tx2);max-width:70ch}

/* the board: four lanes. The lane of the step opens, its context stays beside it */
.board{position:relative;display:grid;min-height:0;grid-template-columns:var(--c1) var(--c2) var(--c3) var(--c4);transition:grid-template-columns .6s var(--ease)}
[data-step=rule]{--c1:1fr;--c2:0fr;--c3:0fr;--c4:0fr}
[data-step=anticipate]{--c1:3fr;--c2:7fr;--c3:0fr;--c4:0fr}
[data-step=disclose]{--c1:0fr;--c2:4fr;--c3:6fr;--c4:0fr}
[data-step=adjust]{--c1:0fr;--c2:3fr;--c3:3.2fr;--c4:4.8fr}
[data-step=record]{--c1:0fr;--c2:1fr;--c3:1fr;--c4:1fr}
.lane{position:relative;min-width:0;min-height:0;padding:1.375rem var(--pad) 1.25rem;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:padding .75s var(--ease),opacity .45s}
#L4{border-right:0}
.lane.off{padding-left:0;padding-right:0;border-right-color:transparent;opacity:0;pointer-events:none}
.lane>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:0.375rem 0.75rem;margin-bottom:1.125rem;white-space:nowrap}
.lane>header b{font:600 var(--t5)/1 var(--serif);color:#646b77;transition:color .5s}
.lane>header h2{font:400 var(--t5)/1 var(--serif);color:var(--mut);transition:color .5s}
.lane.on>header b{color:var(--amb)}.lane.on>header h2,.lane.has>header h2{color:var(--tx)}
.lane>header .stamp{margin-left:auto;opacity:0;letter-spacing:.5em;transition:opacity .5s .3s,letter-spacing .6s .3s var(--ease)}
.lane.sealed>header .stamp,.lane.counted>header .stamp{opacity:1;letter-spacing:.12em;color:var(--amb)}
.lane::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--amb);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.lane.on::before{transform:scaleX(1)}
.body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#L2 .body,#L3 .body{display:flex;flex-direction:column}
.edit{display:none}.lane.on .edit{display:block;animation:rise .45s .4s var(--ease) both}
.lane.on .read{display:none}
.read{animation:rise .45s .4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(0.625rem)}to{opacity:1;transform:none}}
.idle{color:var(--mut);font-size:var(--t2);max-width:26ch}

/* fields */
.f{margin:0 0 1rem;position:relative}
.f>.lab{display:block;margin-bottom:0.4375rem}
textarea{display:block;width:100%;background:var(--ink2);border:0;border-bottom:1px solid var(--line3);padding:0.625rem 0.75rem;resize:none;outline:0;overflow:hidden;border-radius:0;line-height:1.45;transition:border-color .2s,background .2s}
textarea:hover{background:var(--ink3)}
textarea:focus{border-bottom-color:var(--amb);background:var(--ink3);box-shadow:0 1px 0 var(--amb)}
.bigf textarea{font:400 var(--t5)/1.25 var(--serif);padding:0.75rem 0.875rem}
.cnt{display:block;text-align:right;font-size:var(--t1);color:var(--amb);line-height:1.3}
.cnt:empty{display:none}
.read .plan{font:400 var(--t4)/1.3 var(--serif);margin-bottom:0.875rem}
.read .lab{margin:0.75rem 0 0.1875rem}
.read .kv{font-size:var(--t2);color:var(--tx2)}

/* lane 1: the plan and its kind. A ruled table, not tiles */
.cols2{display:grid;grid-template-columns:minmax(18.75rem,1fr) minmax(0,2.9fr);gap:3rem}
#actq{margin:1.375rem 0 0.5rem}
#kindq+.sub{margin:0.375rem 0 0.25rem}
.kinds{display:grid;grid-auto-flow:column;grid-template-rows:auto repeat(6,1fr);grid-template-columns:repeat(4,minmax(0,1fr));margin-top:0.75rem}
.famh{padding:0 0.75rem 0.4375rem;border-bottom:1px solid var(--line2);color:var(--tx2)}
.kind{display:flex;flex-direction:column;justify-content:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0.625rem 0.75rem 0.6875rem;position:relative;transition:background .2s}
.kind.last{border-right-color:transparent}
.kind b{display:block;font:700 var(--t2)/1.25 var(--sans)}
.kind>span{display:block;font:400 var(--ts)/1.3 var(--sans);color:var(--mut);margin-top:2px}
.kind:hover{background:var(--ink2)}
.kind.on{background:var(--ink3)}.kind.on b{color:var(--amb)}
.kind::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amb);transform:scaleY(0);transition:transform .35s var(--ease)}
.kind.on::before{transform:scaleY(1)}
.segc{display:inline-flex;border:1px solid var(--line3)}
.segc button{background:none;border:0;border-right:1px solid var(--line3);padding:0.625rem 0.75rem;font-weight:700;font-size:var(--t2);transition:background .25s,color .25s}
.segc button:last-child{border-right:0}
.segc button:hover{background:var(--ink3)}
.segc button.on{background:var(--amb);color:var(--onamb)}

/* lane 2: the ways */
.lane.on#L2 .body{display:grid;grid-template-columns:minmax(0,1fr) 13.75rem;gap:0 2rem;align-items:start}
.ex{margin:2px 0 0.375rem}
#e2>.lab{margin-bottom:0.625rem}
.wayf{display:grid;grid-template-columns:2.125rem minmax(0,1.3fr) minmax(0,1fr);gap:0.75rem;align-items:start;padding:0.625rem 0 0;border-top:1px solid var(--line)}
.wayf .f{margin-bottom:0.625rem}
.wayf .n,.way .n{font:600 var(--t5)/1.1 var(--serif);color:var(--mut)}
.way{position:relative;display:grid;grid-template-columns:1.625rem minmax(0,1fr);gap:0.5rem;padding:0.6875rem 1.625rem 0.6875rem 0;border-top:1px solid var(--line);transition:background .25s,box-shadow .25s}
.way .wt{line-height:1.4}
.way .wn{color:var(--mut);font-size:var(--t2);margin-top:0.1875rem}
.way .tag,.fx .tag{display:block;margin-top:0.375rem;color:var(--amb)}
.way .port,.fx .port{position:absolute;top:1.1875rem;width:0.5625rem;height:0.5625rem;border-radius:50%;border:1.5px solid var(--line2);background:var(--ink);transition:background .3s,border-color .3s,transform .3s}
.way .port{right:0}.fx .port{left:0}
.way.linked .port,.fx.named .port{background:var(--amb);border-color:var(--amb)}
.fx.missed .port{border-color:var(--tx)}
.linking .way{cursor:pointer}.linking .way:hover{background:var(--ink3)}.linking .way:hover .port{border-color:var(--amb);transform:scale(1.5)}
.way.track::before,.fx.track::before{content:"";position:absolute;left:-0.75rem;top:0;bottom:0;width:2px;background:var(--amb)}
.rowb{display:block;width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;line-height:inherit}
.rowb:hover{color:var(--tx);text-decoration:underline;text-underline-offset:0.1875rem}
.confl{font-size:var(--t2);color:var(--tx2)}

/* the gauge */
.gauge{margin-top:auto;padding-top:1rem;border-top:1px solid var(--line)}
.lane.on#L2 .gauge{margin-top:0;padding-top:0;border-top:0}
.gauge>.lab{margin-bottom:0.375rem}
.gauge svg{display:block;width:100%;max-width:18.75rem;touch-action:none}
.gauge svg.live{cursor:grab}
.gt{stroke:var(--line2)}.gt.maj{stroke:var(--mut)}
.gtrack{fill:none;stroke:var(--line);stroke-width:10}

ngs of the ACM on Human-Computer Interaction, 5(CSCW1), Article 188."},{"id":"gneezy2011","short":"Gneezy, Meier and Rey-Biel (2011)","text":"Gneezy, U., Meier, S. and Rey-Biel, P. (2011) ‘When and why incentives (don’t) work to modify behavior’, Journal of Economic Perspectives, 25(4), 191-210.","doi":"10.1257/jep.25.4.191"},{"id":"amanrana2023","short":"Aman-Rana, Gingerich and Sukhtankar (2023)","text":"Aman-Rana, S., Gingerich, D.W. and Sukhtankar, S. (2023) ‘Screen now, save later? The trade-off between administrative ordeals and fraud’, NBER Working Paper 31364."},{"id":"coffman2011","short":"Coffman (2011)","text":"Coffman, L.C. (2011) ‘Intermediation reduces punishment (and reward)’, American Economic Journal: Microeconomics, 3(4), 77-106.","doi":"10.1257/mic.3.4.77"},{"id":"choi2013","short":"Choi, Hecht and Tayler (2013)","text":"Choi, J., Hecht, G.W. and Tayler, W.B. (2013) ‘Strategy selection, surrogation, and strategic performance measurement systems’, Journal of Accounting Research, 51(1), 105-133.","doi":"10.1111/j.1475-679X.2012.00465.x"}],"steps":[{"id":"recognise","outline":"Assessment Phase 1: define the target behaviour","outline_full":"Assessment Phase 1: Define the target behaviour","plain":"What people do now, in numbers","letter":"R","name":"Recognise","question":"What do people currently do?","why":"You can only judge an intervention against something you can count.","done":"You have the behaviour and the current intervention.","help":"Say it in figures someone could count.","minutes":5,"live":false,"sceptic":"Could you measure this next week?","research":{"headline":"An easier measure hid who needed help","finding":"A widely used US health algorithm took health costs as a proxy for need, and remedying the resulting disparity would raise the share of Black patients receiving extra help from 17.7 to 46.5 per cent.","manager":"count the behaviour itself, not an easier stand-in.","plate":{"title":"Share of Black patients receiving extra help","unit":"%","highlight":1,"source":"obermeyer2019","bars":[["Current algorithm",17.7],["Spending gap removed (simulated)",46.5]]},"scope":"The study examined one widely used commercial algorithm in US health care. The size of the bias depends on the spending gap in each health system."},"citations":["obermeyer2019"]},{"id":"analyse","outline":"Assessment Phase 2: diagnose barriers and enablers","outline_full":"Assessment Phase 2: Diagnose barriers and enablers to the target behaviours","plain":"Two explanations, and the likelier one","letter":"A","name":"Analyse","question":"Why might people behave this way?","why":"Different causes need different interventions.","done":"You have two explanations, a cause for each and the likelier one.","help":"Two explanations. Click a cause for each, then the likelier one.","minutes":5,"live":true,"sceptic":"What would you see if the first cause were wrong?","research":{"after_pm":true,"headline":"One message moved light users the wrong way","finding":"Households already below the neighbourhood average raised their daily use from 10.15 to 11.13 kWh once told the average. Similar households who also received an approving smiley stayed at baseline.","manager":"check which cause fits which people before you choose. One message can help one group and harm another.","plate":{"title":"Daily electricity use of below-average homes, kWh","unit":"","highlight":1,"source":"schultz2007","bars":[["Average only, before",10.15],["Average only, weeks later",11.13],["Average and smiley, before",10.04],["Average and smiley, weeks later",10.14]]},"scope":"Doorhanger messages to 290 households in San Marcos, California. The last meter reading came about four weeks after the first message. The figures are for the below-average homes (68 and 70 households)."},"citations":["schultz2007"]},{"id":"design","outline":"Assessment Phase 3: design the strategy and pretest","outline_full":"Assessment Phase 3: Design the strategy to influence behaviour and pretest interventions","plain":"One intervention for the likelier cause","letter":"D","name":"Design","question":"Which intervention addresses the more likely cause?","why":"An intervention works only if it tackles the real cause.","done":"You have one intervention for the likelier cause.","help":"Pick one intervention for the likelier cause.","minutes":6,"live":false,"sceptic":"Which cause does this leave untouched?","research":{"after_pm":true,"headline":"In one day-care study, a fine for lateness was followed by more late pick-ups","finding":"In a field experiment in day-care centres, late collection rose after a fine was introduced and stayed high once the fine was withdrawn.","manager":"ask whether a control turns a duty into a price or signals distrust, and test an enabling option first.","scope":"Ten day-care centres were observed for 20 weeks. Six introduced a fine of NIS 10 for delays of ten minutes or more, and the four control centres showed no noticeable change. Falk and Kosfeld report the distrust reading of control from a laboratory game."},"citations":["gneezy_rustichini2000","falk_kosfeld2006"]},{"id":"act","outline":"Assessment Phase 4: implement the intervention","outline_full":"Assessment Phase 4: Implement the intervention (hypothetical)","plain":"Who starts, and by when","letter":"A","name":"Act","question":"Who takes the first step, and by when?","why":"Nothing happens until someone owns the first step.","done":"You have a first step, an owner and a deadline.","help":"Name the first step, who takes it and by when.","minutes":2,"live":false,"sceptic":"Would the owner agree to this next week?","research":{"headline":"Plans that fix when and where are carried out more often","finding":"Gollwitzer reviews experiments in which if-then plans, stating when, where and how a person will act, helped people act on intentions they already held.","manager":"leave with one name, one first step and one date.","plate":null,"scope":"Experiments on individuals pursuing their own goals, reviewed by the psychologist who proposed the concept."},"citations":["gollwitzer1999"]},{"id":"routinise","outline":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","outline_full":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","plain":"How it could backfire, and what to watch","letter":"R","name":"Routinise","question":"Why did the intervention backfire?","why":"Side effects are cheapest to fix before launch.","done":"You have the side effect to watch, how you would check it and your decision on the design.","help":"Say how it failed, then what to watch.","minutes":12,"live":true,"sceptic":"Who would rather this side effect never showed up in a report?","research":{"headline":"Treating a failure as certain brings fuller explanations","finding":"People who treated an outcome as certain, as if it had already happened, generated more reasons and a larger share of concrete, episodic reasons than people told the outcome was uncertain. Mitchell, Russo and Pennington called this prospective hindsight, and Klein built it into the pre-mortem.","manager":"give each likely side effect an indicator you can count.","plate":null,"scope":"Laboratory studies of how people explain events. Klein describes the pre-mortem as a working method for project teams."},"citations":["mitchell1989","klein2007"]}],"frameworks":[{"id":"basic","name":"BASIC","kind":"scheme","owner":"OECD","expansion":"Behaviour, Analysis, Strategies, Intervention, Change","stages":["Behaviour","Analysis","Strategies","Intervention","Change"],"plain":"A five-stage process from defining a target behaviour to scaling an intervention.","side_effects":"It names ‘potential side effects’ as one of the nine parts of every behavioural insight, asks at the Behaviour stage about ‘any potential risks or unintended consequences’, and says to monitor potential side effects ‘throughout all relevant stages’.","gap":"BASIC asks you to consider side effects and plan measures to monitor them. RADAR adds a list linking each type of intervention to its known side effects and an indicator for each.","radar_map":{"recognise":"Behaviour","analyse":"Analysis","design":"Strategies","act":"Intervention","routinise":"Change"},"assessment":"Named in the course outline as an example design scheme.","citation":"oecd_basic2019"},{"id":"tests","name":"TESTS","kind":"scheme","owner":"Behavioural Insights Team","expansion":"Target, Explore, Solution, Trial, Scale","stages":["Target","Explore","Solution","Trial","Scale"],"plain":"BIT's five-phase method for running a behavioural project, moving back and forth between phases as you learn.","side_effects":"Asks at the Solution phase, when you prioritise interventions: 'Are there any potential safety considerations, possible negative side-effects or any other ethical concerns?', and whether the initiative could harm equity. Its worked example gives one specific side effect.","gap":"It offers a question and a worked example. RADAR adds a route from each type of intervention to its likely side effects and an indicator for each.","radar_map":{"recognise":"Target","analyse":"Explore","design":"Solution","act":"Trial","routinise":"Scale"},"assessment":"Named in the course outline as an example design scheme.","citation":"bit_tests"},{"id":"rare","name":"RARE","kind":"scheme","owner":"Rare (rare.org)","expansion":"Rare's Behavior-Centered Design: Frame, Empathize, Map, Ideate, Prototype, Test, Launch, Assess","stages":["Frame","Empathize","Map","Ideate","Prototype","Test","Launch","Assess"],"plain":"Rare's own eight-step method, Behavior-Centered Design, described in the toolkit Rare wrote with the Behavioural Insights Team (2019).","side_effects":"The toolkit's chapters on strategies warn that payments can crowd out the motives people already had, that a fine can be read as a price, and that guilt and fear appeals can backfire, with remedies for each.","gap":"It gives specific warnings for incentives, fines and emotional appeals. RADAR extends this to other types of intervention, with an indicator for each side effect.","radar_map":{"recognise":"Frame and Empathize","analyse":"Map","design":"Ideate and Prototype","act":"Test and Launch","routinise":"Assess"},"assessment":"Named in the course outline as an example design scheme, and among the Phase 3 methods.","citation":"rare_bit2019"},{"id":"east","name":"EAST","kind":"inventory","owner":"Behavioural Insights Team","expansion":"Easy, Attractive, Social, Timely","stages":["Easy","Attractive","Social","Timely"],"plain":"Four levers for making a behaviour more likely.","side_effects":"The revised edition (2024) adds ‘behavioural pitfall’ boxes, for example on financial incentives that backfire by undermining the reasons people already had.","gap":"It is a list of levers, some with warnings, used within the Design step. RADAR adds a step for anticipating side effects.","radar_map":{"design":"Choosing the lever"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"bit_east2024"},{"id":"mindspace","name":"MINDSPACE","kind":"inventory","owner":"Institute for Government and Cabinet Office","expansion":"Messenger, Incentives, Norms, Defaults, Salience, Priming, Affect, Commitments, Ego","stages":["Messenger","Incentives","Norms","Defaults","Salience","Priming","Affect","Commitments","Ego"],"plain":"A checklist of nine influences on behaviour, set inside the report's 6 Es framework for applying them to policy.","side_effects":"Says it ‘can also show how policymaking can have unintended and perverse effects on behaviour’, with examples such as the energy-use boomerang, where households below the average used more once told the average.","gap":"It gives examples. RADAR adds a route from a planned intervention to its likely side effects and their indicators.","radar_map":{"design":"Choosing the influence"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"dolan2010"}],"mechanisms":[{"id":"reactance","family":"behavioural","name":"Resistance to control","technical":"Reactance and the hidden costs of control","gloss":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom. A related finding, the hidden costs of control, is that some people then do the minimum the rule requires and withdraw the effort nobody specified.","example":"Managers complete mandatory training at the minimum time the system allows, and stop volunteering for related work.","see":["Behaviour clusters at the minimum the rule will accept","A voluntary version of the same activity gets more real engagement","Related effort that was never required falls after the rule starts"],"cues":[],"strength":"mixed","basis":"Two related findings support this. Reactance theory: people push back to restore a freedom that is threatened (Brehm). The hidden costs of control: in a laboratory principal-agent game, being controlled lowered agents' effort on average, and agents who reacted negatively said they read the control as a signal of distrust (Falk and Kosfeld). Four repetitions found these hidden costs, smaller than in the original, and control often still paid for the principal (Ziegelmeyer, Schmelz and Ploner). Observational data from more than 800 US firms found no gain for some groups, and falls for others, in management five years after mandatory diversity training, which the authors attribute to resistance (Dobbin and Kalev).","citations":["brehm1966","falk_kosfeld2006","ziegelmeyer2012","dobbin_kalev2016"],"line":"People push back when a rule removes choice or signals distrust.","gloss_class":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom.","short":"Resistance to control"},{"id":"crowding_out","family":"behavioural","name":"Payment displaces existing motives","technical":"Motivation crowding out","gloss":"A fine, fee or bonus can weaken the social or professional reasons people already had to act.","example":"After a late fee was introduced at day-care centres, more parents collected their children late.","see":["The behaviour gets worse among people who used to do it without being paid or charged","People talk about the fee or the bonus, not the reason for the rule","Removing the fee or bonus does not bring the old behaviour back"],"cues":[],"strength":"mixed","basis":"Real but context-dependent: a field experiment in day-care centres and two broad reviews find incentives can crowd out the motives people already had. In other settings incentives and those motives add up. Bowles and Polanía-Reyes name four routes: the incentive carries information about the principal, frames the situation, compromises autonomy, or changes how preferences are learned.","citations":["gneezy_rustichini2000","frey_jegen2001","bowles_polania2012"],"line":"A fee or a bonus turns a duty into a purchase.","short":"Payment displaces existing motives"},{"id":"descriptive_norm","family":"behavioural","name":"Compliance messages can normalise non-compliance","technical":"Descriptive norms","gloss":"A message saying how many people break a rule tells everyone else that breaking it is normal.","example":"'Only 40 per cent have completed the module' tells the 60 per cent who have not that they are the majority, and takes the pressure off.","see":["The people still to act slow down after the statistic is published","In a repeated behaviour, people who were doing better than the stated rate drift towards it","Staff quote the statistic back as a justification"],"cues":[],"strength":"mixed","basis":"Clear in a few field studies, smaller and less consistent at scale. A sign saying many visitors took petrified wood was followed by more theft in a US national park than a sign asking visitors not to take it (Cialdini and colleagues). Households using less energy than average used more once told the average, unless the message added approval (Schultz and colleagues). Across about 600,000 households, use fell by 2.0 per cent on average, and the lowest-use tenth still cut their use slightly (Allcott 2011). That tenth cut use slightly with or without approval labels. Bicchieri and Dimant review when social information helps behaviour and when it backfires.","citations":["cialdini2006","schultz2007","allcott2011","bicchieri_dimant2022"],"line":"Saying how many break a rule makes breaking it look normal.","short":"Compliance messages can normalise non-compliance"},{"id":"social_proximity","family":"behavioural","name":"Breaches can spread where ties are weak","technical":"Social proximity and norm compliance","gloss":"People copy what they see others do. When they feel no closeness to the people whose behaviour they see, they copy the breaches and ignore the compliance, so a rule can erode after launch. In our experiment, people who shared a trait with the group they observed responded to both, and compliance held.","example":"Staff see that people in other units have stopped logging. They feel no closeness to those units, copy the breaches, and logging lapses office by office.","see":["Compliance starts high and falls month by month after launch","The fall is steepest where people can see others breaking the rule","Compliance holds better where people see their own team’s record"],"cues":[],"strength":"extrapolation","basis":"In a laboratory experiment, people repeatedly chose whether to follow a norm after seeing what others had done. With no shared trait with the people they observed, compliance eroded quickly: people followed the breaches they observed and ignored the compliance they observed. When they shared a trait with those people, they followed both, and donations stayed close to their starting level (Bicchieri, Dimant, Gächter and Nosenzo). The firm-level prediction, that staff copy breaches they see among colleagues they feel no closeness to, is what your indicator would test.","citations":["bicchieri_etal2022"],"line":"People copy the breaches of colleagues they feel no closeness to.","ev_note":"Shown in a laboratory experiment.","short":"Breaches can spread where ties are weak"},{"id":"diffusion","family":"behavioural","name":"Shared sign-off can dilute responsibility","technical":"Diffusion of responsibility","gloss":"When a decision passes through many hands, each person can feel less responsible for the outcome.","example":"Four approvers each assume one of the others checked the detail.","see":["Each approver spends less time per decision as the chain grows","After a failure, each person names someone else","Decisions stall while everyone waits for someone else to act"],"cues":[],"strength":"extrapolation","basis":"Laboratory evidence that people act less when responsibility is shared is long-standing. For approval chains in firms it is a prediction.","citations":["darley_latane1968","falk_neuber_szech2020"],"line":"When many people share a decision, each feels less responsible.","short":"Shared sign-off can dilute responsibility"},{"id":"metric_gaming","family":"behavioural","name":"People game the metric","technical":"Metric gaming (Goodhart's and Campbell's law)","gloss":"Once a number is rewarded, people work on the number rather than the behaviour it was meant to track.","example":"English hospitals met waiting-time targets partly by adjusting waiting lists.","see":["Results cluster just at or above the target","The easy-to-move part of the metric improves while the rest does not","Activity bunches at the end of the reporting period"],"cues":[],"strength":"strong","basis":"Documented across public services and firms: English health-care targets brought dramatic improvements in reported performance together with documented gaming (Bevan and Hood). In a large government organisation, gaming of reported results harmed its true goal (Courty and Marschke). Software salespeople agreed to lower prices to close deals in the quarters when it paid them (Larkin). Manufacturing sales are higher at the end of the fiscal year and lower at its start (Oyer). Holmström and Milgrom developed the formal multi-task theory.","citations":["bevan_hood2006","courty_marschke2004","larkin2014","oyer1998","holmstrom_milgrom1991"],"line":"People work on the number, not the behaviour it tracks.","short":"People game the metric"},{"id":"automation_bias","family":"behavioural","name":"Over-reliance on an automated score","technical":"Automation bias and complacency","gloss":"When a system recommends, people tend to accept its advice, even when the system is wrong.","example":"Compliance analysts stop overriding an automated risk score and spend seconds on each alert.","see":["Override rates fall over time without accuracy rising","Time spent per decision drops sharply","Reviewers struggle to state why they agreed with the model"],"cues":[],"unless":["take their jobs","take their job","take our jobs","take my job","lose their jobs","lose their job","lose our jobs","job security","job losses","made redundant","replace them","replace us","replaced by"],"strength":"mixed","basis":"Automation bias is well documented in aviation and medicine, including among experts. The opposite error is documented too: in laboratory studies people distrust an algorithm after seeing it err, and in a vending-machine firm workers were reluctant to follow algorithmic advice (Kawaguchi). In a hiring study across 15 firms (Hoffman, Kahn and Li), managers who appeared to hire against a job test's recommendations ended up with hires who stayed for less time. Your own data show which error dominates here.","citations":["parasuraman_manzey2010","dietvorst2015","hoffman2018","kawaguchi2021"],"line":"People accept a system's advice too readily.","short":"Over-reliance on an automated score"},{"id":"present_bias","family":"behavioural","name":"Procrastination","technical":"Present bias and procrastination","gloss":"People delay anything with a cost now and a benefit later, even when they fully intend to do it.","example":"Everyone agrees to complete the review, and does it the day before the deadline.","see":["Activity bunches just before deadlines, whatever the deadline is","People say they intend to act and then do not","A fixed slot or reminder changes timing more than any argument does"],"cues":[],"strength":"mixed","basis":"Well established in theory, with real but varied experimental support. Standard models explain why tasks bunch at deadlines, and a longitudinal experiment found present bias in effort, much weaker in money, and demand for commitment devices (Augenblick and colleagues). In a field experiment with students, many chose their own deadlines and present bias was widespread, but completion was similar with and without self-chosen deadlines, and present-biased students who put off single tasks managed repeated ones (Bisin and Hyndman). For workplace deadlines it is a prediction.","citations":["odonoghue_rabin1999","augenblick2015","bisin_hyndman2020"],"line":"People delay tasks that cost now and pay off later.","short":"Procrastination"},{"id":"hassle","family":"behavioural","name":"Administrative friction","technical":"Hassle factors and friction costs","gloss":"A few extra steps, forms or logins can stop people who fully intend to act.","example":"Expense claims pile up when the system needs four screens and a receipt scan.","see":["Many start and do not finish","Completion rises sharply when a single step is removed","People who get help with the process complete it"],"cues":[],"strength":"mixed","basis":"A field experiment that helped families complete a financial-aid form raised form completion and college attendance, while information about aid alone left submissions unchanged (Bettinger and colleagues). The help combined personal assistance, a streamlined process and aid estimates. In an IRS field experiment, a second, simpler mailing that displayed the benefit raised take-up of a tax credit, while messages about stigma or the cost of applying left take-up unchanged (Bhargava and Manoli).","citations":["bettinger2012","bhargava_manoli2015"],"line":"A few extra steps stop people who mean to act.","short":"Administrative friction"},{"id":"defaults","family":"behavioural","name":"People stay with the default","technical":"Defaults and status quo bias","gloss":"The outcome that applies when no one makes a choice is the outcome most people end up with.","example":"Pension enrolment jumped when joining became the default instead of an opt-in.","see":["Most people end up on the pre-set option","Changing the default moves the outcome far more than information does"],"cues":[],"strength":"strong","basis":"A meta-analysis of 58 default studies (pooled n = 73,675) found a considerable average effect with wide variation, including a few null or negative results (Jachimowicz and colleagues). In a large firm, automatic enrolment raised pension participation, and a substantial fraction of new participants stayed at the default contribution rate and fund (Madrian and Shea).","citations":["madrian_shea2001","jachimowicz2019"],"line":"Most people end up with whatever happens if they do nothing.","short":"People stay with the default"},{"id":"attention","family":"behavioural","name":"Limited attention","technical":"Limited attention and salience","gloss":"People respond to what is visible at the moment of decision and ignore what is not.","example":"Shoppers reacted to a tax once it was shown on the price tag, though it had always applied.","see":["Behaviour changes when information is moved, not when it is added","People say they did not know about something that was technically published"],"cues":[],"strength":"strong","basis":"A grocery-store field experiment found posting tax-inclusive prices reduced demand by 8 per cent, and taxes included in posted prices cut alcohol consumption more than taxes added at the register (Chetty and colleagues). Tolls were 20 to 40 per cent higher than they would have been without electronic collection, which the author reads as the toll becoming less visible (Finkelstein).","citations":["chetty2009","finkelstein2009"],"line":"People act on what is visible at the moment they decide.","short":"Limited attention"},{"id":"capacity","family":"structural","name":"Insufficient time or resources","technical":"A capacity constraint","gloss":"People would do it if they had the time, staff or budget.","example":"Reviews are rushed in the quarter-end crunch because the same people run the close.","see":["The behaviour tracks workload and busy periods","Adding time or cover resolves it without any message or rule"],"cues":[],"strength":"structural","basis":"This is a practical constraint. Rule it out first: if a shortage of time or staff explains the pattern, add capacity before changing behaviour.","citations":[],"line":"People lack the time, staff or budget to do it.","short":"Insufficient time or resources"},{"id":"information","family":"structural","name":"Gap in knowledge or skill","technical":"An information or skill gap","gloss":"People lack the knowledge, skill or clear instruction to do what is asked.","example":"Staff skip a control step because no one ever explained what it protects against.","see":["Errors are spread evenly, not clustered at convenient points","People ask how, not whether","A clear instruction resolves it"],"cues":[],"strength":"structural","basis":"This is a practical constraint. Rule it out first: when people lack the knowledge or skill for the task, close the gap with training or clearer instructions.","citations":[],"line":"People lack the knowledge, skill or a clear instruction.","short":"Gap in knowledge or skill"},{"id":"misaligned","family":"structural","name":"A conflicting incentive","technical":"A misaligned incentive","gloss":"Another rule, reward or manager encourages the behaviour you are trying to stop.","example":"Advisers skip the suitability check because their bonus counts sales, not quality.","see":["People who behave well are penalised somewhere else","The behaviour is concentrated where the competing reward is strongest"],"cues":[],"strength":"structural","basis":"This is a structural incentive problem. If an existing reward pays for the unwanted behaviour, change that reward first.","citations":[],"line":"Another rule or reward pays for the unwanted behaviour.","short":"A conflicting incentive"}],"actors":[{"id":"targeted","name":"The people the intervention targets"},{"id":"enforcers","name":"The people who enforce, approve or measure it"},{"id":"nearby","name":"Others affected who were not targeted"}],"side_effects":[{"id":"minimum_compliance","name":"Compliance can settle at the minimum","behaviour":"People can do exactly what the rule requires and stop there.","actor":"targeted","signal":"Share completed in the last day before the deadline, and median time spent.","source":"System logs","unmeasured":"Completion is what gets reported, and it looks perfect.","mitigations":["Measure time or quality alongside completion","Pilot the requirement on one team and compare"],"strength":"extrapolation","basis":"In a laboratory game, on average people in the employee role cut their effort when the employer set a minimum (Falk and Kosfeld 2006). Repetitions find the effect real but smaller (Ziegelmeyer, Schmelz and Ploner 2012). That it holds in firms is a prediction.","citations":["falk_kosfeld2006","ziegelmeyer2012"],"cues":[]},{"id":"adjacent_voluntary_drop","name":"Related voluntary effort can fall","behaviour":"Effort on related tasks that were never required can decline.","actor":"targeted","signal":"Sign-ups each month to one related voluntary activity, such as mentoring.","source":"HR or programme records","unmeasured":"No one has linked it to the rule, so no one monitors it.","mitigations":["Track one adjacent voluntary behaviour from day one","Explain the purpose and let people choose how or when"],"strength":"extrapolation","basis":"In a laboratory game, control lowered employee-role players' effort on average, less strongly in replications (Falk and Kosfeld 2006, Ziegelmeyer, Schmelz and Ploner 2012). That it shows up as less voluntary effort in firms is our extrapolation. Payment can also crowd out existing motives (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012).","citations":["falk_kosfeld2006","ziegelmeyer2012","frey_jegen2001","bowles_polania2012"],"cues":[]},{"id":"goodwill_withdrawn","name":"Goodwill can be withdrawn","behaviour":"Voluntary effort, such as helping colleagues or raising problems early, can fall among people who feel distrusted.","actor":"targeted","signal":"Issues raised early and offers of help, counted each month.","source":"Engagement survey items, ticket data","unmeasured":"Voluntary extra effort is, by definition, absent from everyone's targets.","mitigations":["Say why the control exists and what it is not for","Remove the control for a trusted sample and compare"],"strength":"extrapolation","basis":"In a laboratory game, control lowered employee-role players' effort on average, less in replications (Falk and Kosfeld 2006, Ziegelmeyer, Schmelz and Ploner 2012). In a student work experiment, monitoring improved work quality only when incentives were harsh, and reduced punctuality whatever the incentives (Belot and Schröder 2016). That firms see less helping is a prediction.","citations":["falk_kosfeld2006","ziegelmeyer2012","belot_schroder2016"],"cues":[]},{"id":"performing_for_tracker","name":"Activity can be staged for the monitoring system","behaviour":"People can hide or stage what the tracker sees.","actor":"targeted","signal":"Output per tracked hour, each month.","source":"Activity logs against outcome data","unmeasured":"Only the tracked activity appears on the dashboard.","mitigations":["Track outcomes, not activity","Change or rotate what is tracked"],"strength":"extrapolation","basis":"Participant observation in a mobile-phone factory found that observed workers hid what they were doing (qualitative evidence), and a field experiment there found that modest shielding of teams from outside observers raised line performance (Bernstein 2012). For office monitoring it is a prediction.","citations":["bernstein2012"],"cues":[]},{"id":"ownership_drops","name":"Responsibility for the decision can be diluted","behaviour":"Each approver can check less, assuming another will.","actor":"enforcers","signal":"Minutes each approver spends per decision, and the share of errors with a named owner.","source":"Workflow logs, post-incident reviews","unmeasured":"Approval rates look healthy, so no one examines how approvals are made.","mitigations":["Name one accountable approver","Make each approver sign for one specific check"],"strength":"extrapolation","basis":"Extrapolated from laboratory experiments in which people helped less often when other bystanders were present (Darley and Latané 1968) and chose self-interested outcomes more often when responsibility was shared (Falk, Neuber and Szech 2020). A meta-analysis of over 7,700 participants found bystanders reduce helping, less so when the situation seemed dangerous (Fischer and colleagues 2011).","citations":["darley_latane1968","falk_neuber_szech2020","fischer2011"],"cues":[]},{"id":"threshold_bunching","name":"Amounts bunch just below the cut-off","behaviour":"Amounts are sized to fall just below a cut-off, as in tax and public procurement. An approval limit sets the same kind of cut-off.","actor":"targeted","signal":"Share of requests just below the approval threshold.","source":"Transaction records","unmeasured":"Every request is legitimate on its own.","mitigations":["Monitor the distribution around the threshold","Randomly audit a sample just below it"],"strength":"strong","basis":"Bunching just below a cut-off is repeated evidence in tax (Kleven and Waseem 2013) and in public procurement, where contracts were sized to avoid a full tender (Palguta and Pertold 2017). For internal approval limits it is a prediction.","citations":["palguta_pertold2017","kleven_waseem2013"],"cues":[]},{"id":"decisions_slow","name":"Decisions can slow, and urgent work can bypass the process","behaviour":"Time to decision can grow, and people can route urgent work outside the process.","actor":"nearby","signal":"Days from request to decision, and the share of work done outside the process.","source":"Workflow logs, spend outside the system","unmeasured":"The process looks controlled. The work that avoids it is invisible.","mitigations":["Set a service level for the approval","Withdraw the extra step after a set period unless it has caught problems"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"override_collapse","name":"Override rates drift","behaviour":"People can defer to the system when it is wrong, or ignore it when it is right.","actor":"enforcers","signal":"Share of cases where staff override the score, each month.","source":"System override logs","unmeasured":"Accuracy is judged on the cases the model decided, which is circular.","mitigations":["Require a reason for agreeing, on a random sample","Blind-review a sample without the model's score"],"strength":"mixed","basis":"Automation bias is well documented. In a hiring study across 15 firms (Hoffman, Kahn and Li 2018), managers who hired against a job test's recommendation ended up with hires who stayed for less time. Workers in a vending-machine firm were reluctant to follow algorithmic advice (Kawaguchi 2021). Monitor the override rate in either direction.","citations":["hoffman2018","kawaguchi2021"],"cues":[]},{"id":"judgement_fades","name":"Independent judgement can weaken","behaviour":"The skill the system replaced can weaken, so fewer people can catch its errors later.","actor":"enforcers","signal":"Error rate on cases reviewed without the system.","source":"Periodic blind reviews","unmeasured":"The skill is no longer practised, so it is no longer tested.","mitigations":["Keep a share of cases fully manual","Rotate people through blind reviews"],"strength":"extrapolation","basis":"A classic argument in the study of automation: the operator's skill decays as the system takes over. For most firms it is a prediction.","citations":["bainbridge1983"],"cues":[]},{"id":"cheapest_margin","name":"The metric improves through its easiest component","behaviour":"People improve only the part of the metric that is easiest to move.","actor":"targeted","signal":"Share of the metric's gain that comes from its easiest part.","source":"Components of the metric","unmeasured":"The reported figure improves.","mitigations":["Track the component that is hardest to game","Check a sample of how the figure is produced"],"strength":"mixed","basis":"English health-care targets brought large reported gains with documented gaming (Bevan and Hood 2006). Chicago schools raised scores for middle-achieving pupils but not for the lowest-achieving pupils (Neal and Schanzenbach 2010), while English waiting-time targets cut waits without diverting care (Propper and colleagues 2010).","citations":["bevan_hood2006","neal_schanzenbach2010","propper2010"],"cues":[]},{"id":"period_end_bunching","name":"Sales and results can bunch at the end of the period","behaviour":"Work is pulled into the last weeks to hit the number, at the cost of the next period.","actor":"targeted","signal":"Share of activity in the last two weeks of each period.","source":"Timestamped activity data","unmeasured":"Period totals look fine.","mitigations":["Measure the pattern within the period","Smooth the incentive across periods"],"strength":"strong","basis":"Manufacturing sales are higher at the end of the fiscal year and lower at its start (Oyer 1998), and in one software firm salespeople agreed to lower prices to close deals in the quarters when it paid them (Larkin 2014).","citations":["oyer1998","larkin2014"],"cues":[]},{"id":"unmeasured_quality_slips","name":"Unmeasured quality slips","behaviour":"Things not in the target get worse to make room for things that are.","actor":"targeted","signal":"Complaints, rework or errors per month, outside the target.","source":"Quality and complaints data","unmeasured":"It is not in the target, so it is not on the report.","mitigations":["Add one quality counterweight to the target","Review a random sample for quality"],"strength":"mixed","basis":"Predicted by theory (Holmström and Milgrom 1991), and field studies disagree. Gains in low-stakes science and social studies lagged for low-achieving pupils in Chicago (Jacob 2005). Kenyan teachers paid on test scores raised only rewarded exams (Glewwe, Ilias and Kremer 2010). Indian incentive schools did better on unrewarded subjects (Muralidharan and Sundararaman 2011).","citations":["holmstrom_milgrom1991","jacob2005","glewwe2010","muralidharan2011"],"cues":[]},{"id":"drift_to_stated_rate","name":"Good performers drift down to the stated rate","behaviour":"A stated low rate can make the low behaviour seem normal. Those who were doing better can drift towards it.","actor":"targeted","signal":"Share of earlier top performers now at or below the stated rate.","source":"Counts from before and after, by subgroup","unmeasured":"The overall average may still look better.","mitigations":["Publish what most people do right, not what they do wrong","Add approval for those already doing well"],"strength":"mixed","basis":"In one small field experiment, households below the average used more once told it, and adding approval removed the effect (Schultz and colleagues 2007). Across about 600,000 households, the lowest-use tenth still cut use slightly (Allcott 2011). That a stated low rate slows action in organisations is a prediction.","citations":["schultz2007","allcott2011"],"cues":[]},{"id":"fine_becomes_price","name":"The fine becomes a price","behaviour":"People keep doing it, now treating the fine as the price.","actor":"targeted","signal":"Share of fines paid by repeat payers.","source":"Fine or fee records","unmeasured":"Revenue from the fine can look like success.","mitigations":["Explain the reason for the sanction as well as its cost","Pair the sanction with a non-monetary consequence"],"strength":"mixed","basis":"In one field experiment in day-care centres, late collection rose after a fine and stayed high once it was removed (Gneezy and Rustichini 2000). The authors read it as the fine changing how parents saw the arrangement. How far it generalises depends on the setting (Bowles and Polanía-Reyes 2012).","citations":["gneezy_rustichini2000","bowles_polania2012"],"cues":[],"ev_note":"This rests on one field study, and reviews disagree on how far it generalises."},{"id":"goes_underground","name":"The behaviour can be hidden rather than stopped","behaviour":"People can hide the behaviour instead of stopping it, so reported numbers fall while the actual rate may not.","actor":"targeted","signal":"Breaches found by independent checks, against those self-reported.","source":"Audit findings","unmeasured":"Reported incidents fall, which looks like success.","mitigations":["Measure independently of self-report","Make it safe to report problems"],"strength":"extrapolation","basis":"Participant observation in a factory found that observed workers hid their methods from supervisors (Bernstein 2012). For sanctions and audits in your setting it is a prediction. Your indicator tests it.","citations":["bernstein2012"],"cues":[]},{"id":"unrewarded_work_shrinks","name":"Unrewarded work shrinks","behaviour":"Valuable work that is not rewarded gets less effort.","actor":"targeted","signal":"Hours each month on one unrewarded contribution, such as mentoring.","source":"HR or team records","unmeasured":"It was never rewarded, so it appears in no report.","mitigations":["Add a small reward for the contribution that gets neglected","Name the unrewarded contribution and track it"],"strength":"mixed","basis":"Multi-task theory (Holmström and Milgrom 1991) and one school study: gains in low-stakes science and social studies lagged for struggling pupils when Chicago schools were held to reading and maths scores (Jacob 2005). Indian incentive schools did better on unrewarded subjects (Muralidharan and Sundararaman 2011). Effects vary across settings.","citations":["holmstrom_milgrom1991","jacob2005","muralidharan2011"],"cues":[]},{"id":"only_the_willing","name":"Only the willing may take part","behaviour":"A voluntary option can attract the people who needed it least.","actor":"targeted","signal":"Take-up rate in the group you most needed to reach, against the rest.","source":"Participation records by group","unmeasured":"Participation numbers can look healthy.","mitigations":["Target invitations at the group you most need","Make the voluntary option the easy default"],"strength":"extrapolation","basis":"In a randomised wellness programme at a large employer, employees who signed up already had lower medical spending and healthier habits than those who did not (Jones, Molitor and Reif 2019). For other voluntary options it is a prediction.","citations":["jones_molitor_reif2019"],"cues":[]},{"id":"expectations_raised","name":"Expectations can rise","behaviour":"Once consulted, people can expect their input to change the outcome. If it does not, trust can fall further than before.","actor":"targeted","signal":"Share of suggestions acted on, and the share who trust the follow-up in a survey.","source":"Consultation records","unmeasured":"Consultation is counted as done once it has happened.","mitigations":["Say in advance what is and is not open to change","Report back what changed and why"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"stuck_on_default","name":"A default tends to stick, including one that suits few people","behaviour":"People retain the preselected option without assessing whether it suits their needs.","actor":"targeted","signal":"Share on the default by subgroup, and the rate of later reversals.","source":"Enrolment records","unmeasured":"High take-up looks like success.","mitigations":["Prompt an active choice at a natural moment","Set the default to the best option for most, and review it"],"strength":"strong","basis":"Defaults shift choices across 58 studies, with wide variation (Jachimowicz and colleagues 2019). After automatic enrolment at one large US firm, a substantial fraction of new participants kept both the default rate and the default fund (Madrian and Shea 2001). How well the default fitted each person is for your own data to show.","citations":["madrian_shea2001","jachimowicz2019"],"cues":[]},{"id":"reminder_fatigue","name":"Reminders can stop working","behaviour":"People can learn to ignore reminders, including the important ones.","actor":"targeted","signal":"Response rate to each reminder, in the order reminders are sent.","source":"Email or system analytics","unmeasured":"Each reminder is sent, so the job looks done.","mitigations":["Send fewer, better-timed reminders","Withdraw reminders that no one acts on"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"step_was_doing_a_job","name":"The removed step may have been protective","behaviour":"The step you removed may have been preventing something, which can now happen more.","actor":"nearby","signal":"Errors, incidents or rework per month after the removal, against the months before.","source":"Quality and rework data","unmeasured":"The faster process is what gets reported.","mitigations":["Pilot the removal on a sample first","Keep a light random check"],"strength":"extrapolation","basis":"A prediction from removing a check. Your indicator tests it.","citations":[],"cues":[]},{"id":"ban_was_holding","name":"The ban or limit may have been holding something back","behaviour":"The limit you loosened may have been holding something back, which can now rise.","actor":"targeted","signal":"Count of the behaviour the limit covered, per month, against the months before.","source":"Spot checks and adjacent records","unmeasured":"Loosening is reported as the end of the problem, so a rise is not linked to it.","mitigations":["Loosen the limit for one group first","Keep a light check on what the limit covered"],"strength":"extrapolation","basis":"A prediction from loosening a rule. Your indicator tests it.","citations":[],"cues":[]},{"id":"training_was_holding_up","name":"What the training taught may slip once it stops","behaviour":"What the training taught can slip once it stops, and the mistakes it prevented can return.","actor":"targeted","signal":"Share of staff who make the mistake the training covered, per month, against the months before.","source":"A short practical check and error records","unmeasured":"Training is counted as done, so what happens after it stops is not tracked.","mitigations":["Check a sample of work for the skill the training taught","Offer a short refresher before dropping it"],"strength":"extrapolation","basis":"A prediction from withdrawing training. Your indicator tests it.","citations":[],"cues":[]},{"id":"capacity_was_covering","name":"The extra time or resource may have been covering something","behaviour":"The extra time or resource you cut may have been covering work that can now slip.","actor":"targeted","signal":"Count of tasks late or dropped, per month, against the months before the cut.","source":"Workload and task records","unmeasured":"The saving is reported, and the work that slips is not linked to it.","mitigations":["Cut it for one team first and compare output","Track the behaviour the time or budget was covering for three months"],"strength":"extrapolation","basis":"A prediction from cutting capacity. Your indicator tests it.","citations":[],"cues":[]},{"id":"sanction_was_deterring","name":"The sanction may have been holding something back","behaviour":"With the sanction gone, people may do more of what it held back.","actor":"targeted","signal":"Count of the sanctioned behaviour per month, against the months before.","source":"Incident and breach records","unmeasured":"Fewer sanctions issued can look like fewer problems.","mitigations":["Stop it for one group first and compare","Keep a light check on the behaviour it covered"],"strength":"extrapolation","basis":"A prediction from removing a sanction. Your indicator tests it.","citations":[],"cues":[]},{"id":"monitoring_was_deterring","name":"The check may have been deterring the behaviour","behaviour":"With fewer checks, people may do more of what the check used to catch.","actor":"targeted","signal":"Breaches or errors per random sample, against the months before.","source":"Random sample audits","unmeasured":"Fewer checks find fewer problems, which can look like improvement.","mitigations":["Reduce the checks for a sample first","Keep a light random check"],"strength":"extrapolation","basis":"In a call-centre field experiment, many employees took more advantage when they believed monitoring had fallen. Others kept their effort as before (Nagin and colleagues 2002). For your check it is a prediction. Your indicator tests it.","citations":["nagin2002"],"cues":[]},{"id":"commitment_to_end_the_conversation","name":"Commitments can be given just to close the discussion","behaviour":"People can agree to a date to close the discussion, not because they intend to act.","actor":"targeted","signal":"Share of commitments met on the date.","source":"Follow-up records","unmeasured":"Commitments are counted when made, not when kept.","mitigations":["Track commitments kept, not made","Make the first step small enough to do immediately"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"above_average_do_less","name":"Those doing better than average ease off","behaviour":"Telling people the average pulls those who were doing better towards it.","actor":"targeted","signal":"Share of earlier above-average people who fall below average after the message.","source":"Counts from before and after, by subgroup","unmeasured":"The overall average improves, which hides the drop at the top.","mitigations":["Add approval for those already doing well","Show the best-practice level, not the average"],"strength":"mixed","basis":"One small field experiment found it, and adding approval removed it (Schultz and colleagues 2007). Across about 600,000 households, use fell by 2.0 per cent on average, and the lowest-use tenth still cut their use slightly (Allcott 2011). That tenth cut use slightly with or without approval labels. Norm messages can backfire unless designed carefully (Bicchieri and Dimant 2022).","citations":["schultz2007","allcott2011","bicchieri_dimant2022"],"cues":[]},{"id":"scapegoat","name":"Others can disengage once one person owns it","behaviour":"Once one person owns it, others can disengage and wait for them to fail.","actor":"nearby","signal":"Share of contributions from people other than the owner.","source":"Meeting and project records","unmeasured":"Ownership is recorded, so accountability looks settled.","mitigations":["Name the owner and the two people who must support them","Review the obstacles the owner faces as well as the results"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"reasons_become_boilerplate","name":"Reasons can become boilerplate","behaviour":"Required justifications can turn into copy-and-paste text.","actor":"enforcers","signal":"Share of justifications that are near-duplicates.","source":"The justification text itself","unmeasured":"Every decision has a reason attached.","mitigations":["Ask for a reason only on a random sample","Read and respond to a sample of reasons"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"attention_spread_thin","name":"Attention can spread across too many measures","behaviour":"With many measures, people can lose track of which one matters, and effort can drift to the easiest.","actor":"targeted","signal":"Share of staff who can name the measures from memory.","source":"A two-question pulse survey","unmeasured":"The dashboard is complete.","mitigations":["Keep one principal measure and a small set of counterweights"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"time_absorbed","name":"The extra time can be absorbed","behaviour":"Other work can take up the extra time or resource, and the original behaviour can stay the same.","actor":"targeted","signal":"Hours per week spent on the intended activity.","source":"Time or activity data","unmeasured":"The resource was added, so the problem looks solved.","mitigations":["Ring-fence the time","Track the behaviour the time is meant for"],"strength":"extrapolation","basis":"A prediction from present bias: people put off tasks whose cost comes now and whose benefit comes later (O'Donoghue and Rabin 1999). Extra time that is not ring-fenced leaves room for that delay. Your indicator tests it.","citations":["odonoghue_rabin1999"],"cues":[]},{"id":"training_becomes_box_ticking","name":"Training can become box-ticking","behaviour":"The training can become a completion metric in its own right, with the same minimum-effort pattern.","actor":"targeted","signal":"Share of staff who can apply it one month later, measured by a brief practical test.","source":"A short applied check","unmeasured":"Completion is reported. Application is not.","mitigations":["Test application, not attendance","Keep it short and at the moment of need"],"strength":"extrapolation","basis":"Extends the minimum-compliance pattern from laboratory hidden-costs-of-control tasks (Falk and Kosfeld 2006) to workplace training, where it is a prediction.","citations":["falk_kosfeld2006"],"cues":[]},{"id":"behaviour_moves_elsewhere","name":"The behaviour can move elsewhere","behaviour":"People can keep doing what was banned or capped, out of sight or by another route: unrecorded overtime, phones in the corridor, spend split across budgets.","actor":"targeted","signal":"Count of the same behaviour where the rule does not reach, before and after the change.","source":"Spot checks, adjacent records, short pulse surveys","unmeasured":"The banned behaviour disappears from the place being monitored.","mitigations":["Ask what people will do instead before you ban it","Measure the nearest substitute as well as the banned behaviour"],"strength":"extrapolation","basis":"Plastic carryout bag regulations eliminated 40 million pounds of plastic bags, but this was offset by a 12 million pound increase in trash bag purchases, with sales of small, medium and tall trash bags up by 120, 64 and 6 per cent (Taylor 2019). That it happens with workplace bans is a prediction.","citations":["taylor2019"],"cues":[]},{"id":"loosened_limit_raises_use","name":"Loosening a limit can raise use and harm","behaviour":"When a limit on access is relaxed, use of the restricted item and related harm can rise.","actor":"targeted","signal":"Use of what the limit covered, and related incidents, per month against the months before.","source":"Spot checks and incident records","unmeasured":"Loosening is reported as the end of the problem, so a rise is not linked to it.","mitigations":["Loosen the limit for one group first","Keep a light check on what the limit covered"],"strength":"extrapolation","basis":"In a Swedish trial, Saturday opening of alcohol stores raised alcohol use and crime (Grönqvist and Niknami 2014). Partly repealing Michigan's helmet law cut helmet use in crashes from 93.2 to 70.8 per cent (Carter and colleagues 2017). That it holds at work is a prediction.","citations":["gronqvist_niknami2014","carter2017"],"cues":[]},{"id":"active_choice_completes_less","name":"Asking people to choose can complete less than doing it for them","behaviour":"When people must make an explicit choice, fewer may complete the action than when it is done for them with an easy opt-out.","actor":"targeted","signal":"Share who completed the action by the deadline, against a group for whom it was done by default.","source":"Completion records","unmeasured":"Everyone who chose is counted. The people who never got round to it are not.","mitigations":["Test the choice against a default on one group first","Send the default version to anyone who has not chosen by the deadline"],"strength":"extrapolation","basis":"In a randomised trial of 20,509 patients, three active-choice messages produced 14.5 to 17.4 per cent screening completion. A mailed kit, the default, produced 26.2 per cent (Galoosian and colleagues 2025). That it holds in organisations is a prediction.","citations":["galoosian2025"],"cues":[]},{"id":"choice_becomes_hurdle","name":"Some people may delay when a choice is required","behaviour":"Some people who would have been fine on the default can put the decision off or pick at random.","actor":"targeted","signal":"Share who have not chosen by the deadline, and share who later reverse their choice.","source":"Enrolment records","unmeasured":"Everyone who chose is counted. The people who stalled are not.","mitigations":["Offer a recommended option alongside the choice","Set a clear deadline and a fallback"],"strength":"extrapolation","basis":"In data on nearly 800,000 employees, 401(k) participation was higher in plans offering a handful of funds than in plans offering ten or more (Sethi-Iyengar, Huberman and Jiang 2004). That is about menu size, and delay among people who would have been fine on a default is a proposal your figure can test.","citations":["iyengar2004"],"cues":[]},{"id":"breaches_spread","name":"Breaches can spread where ties are weak","behaviour":"Where staff feel no closeness to the colleagues whose breaches they see, they can copy the breaches and ignore the compliance, so compliance can slide after launch.","actor":"targeted","signal":"Breaches per team each month, and whether they cluster in teams that see each other.","source":"Compliance logs by team","unmeasured":"The launch month is what gets reported, and it looks fine.","mitigations":["Show each team its own compliance","Show staff the compliance of colleagues they feel close to"],"strength":"extrapolation","basis":"In a laboratory experiment, people with no shared trait with the group they observed copied its breaches, taking on average an additional 21.9 ECUs from the charity, against an additional 7.5 with a shared trait (Bicchieri, Dimant, Gächter and Nosenzo 2022). Breaches among distant colleagues are the firm-level prediction.","citations":["bicchieri_etal2022"],"cues":[],"card":"Laboratory: without a tie, people took an additional 21.9 ECUs from a charity. With a shared trait they took an additional 7.5 (Bicchieri, Dimant, Gächter and Nosenzo 2022).","ev_note":"Shown in a laboratory experiment."},{"id":"useful_effect_lost","name":"Something useful can go with the old target or incentive","behaviour":"The removed target or incentive may also have encouraged a desirable behaviour.","actor":"targeted","signal":"Monthly count of the good outcome the old incentive also paid for.","source":"Performance data","unmeasured":"What the old incentive achieved was never recorded.","mitigations":["List what the old target or incentive rewarded before removing it","Phase the change in and monitor the useful outcome"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"gains_fade_after_stop","name":"Gains can fade slowly once the plan stops","behaviour":"The behaviour it improved can drift back, slowly, once the prompt, message or programme ends, though much of the effect can persist.","actor":"targeted","signal":"The target behaviour's monthly rate after the stop, against the months before.","source":"Monthly behaviour records","unmeasured":"Once it stops, no one tracks what it was improving.","mitigations":["Stop it for one team first and compare","Keep tracking the behaviour after it ends"],"strength":"extrapolation","basis":"In a home-energy programme, savings from comparison reports lasted after the reports stopped but decayed by about 10 to 20 per cent a year (Allcott and Rogers 2014). In 38 energy-nudge field experiments, reductions persisted in many after treatment ended (Brandon and colleagues 2017). That it holds for workplace prompts is a prediction.","citations":["allcott_rogers2014","brandon2017"],"cues":[]},{"id":"effect_outlasts_removal","name":"The former motive may not return","behaviour":"Once a fine or reward is withdrawn, the behaviour may not return to where it was before.","actor":"targeted","signal":"The behaviour's monthly rate after withdrawal, against its level before the fine or reward.","source":"Fine, fee or performance records","unmeasured":"Withdrawal is counted as the end of the problem.","mitigations":["Say why it is ending and watch the behaviour in the weeks after","Compare with the level before it began, not with the level under it"],"strength":"mixed","basis":"In a day-care field experiment, late collection rose after a fine and stayed high once it was removed (Gneezy and Rustichini 2000). Reviews find crowding out in some settings and not others (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012).","citations":["gneezy_rustichini2000","frey_jegen2001","bowles_polania2012"],"cues":[]},{"id":"skill_gap_on_return","name":"People may have lost the skill the system replaced","behaviour":"When the system is withdrawn, people can decide without the practice they lost.","actor":"targeted","signal":"Error rate on manual decisions in the first months after the switch.","source":"Decision and error records","unmeasured":"The switch is reported as done once people take over.","mitigations":["Run practice cases by hand before the switch","Check a sample of manual decisions closely at first"],"strength":"extrapolation","basis":"Bainbridge (1983) argued that skills an operator no longer uses can decline, so a person taking over from automation may be less able than before. For your decisions it is a prediction. Your indicator tests it.","citations":["bainbridge1983"],"cues":[]},{"id":"ratchet_holdback","name":"People can hold back to keep the next target low","behaviour":"If the next target is set from this period's result, people can avoid going far above it.","actor":"targeted","signal":"Share of units finishing just above the target, period after period.","source":"Performance records by unit","unmeasured":"Results just above target look like success.","mitigations":["Do not set the next target from this result alone","Say in advance how the next target will be set"],"strength":"extrapolation","basis":"Bevan and Hood list the ratchet effect, next year's target set from this year's result, among the gaming problems of the Soviet target regime. For your targets it is a prediction. Your indicator tests it.","citations":["bevan_hood2006"],"cues":[]},{"id":"reports_shift_when_pressure_ends","name":"Reported figures can shift once the pressure goes","behaviour":"Once the penalty, target or check goes, hidden cases can surface, or gamed figures can fall. The change in the numbers may not be real.","actor":"targeted","signal":"Gap between reported figures and independent checks, before and after the change.","source":"Audit findings","unmeasured":"The reported figures are read as the real trend.","mitigations":["Measure independently of self-report","Agree in advance how a rise or fall in reports will be read"],"strength":"extrapolation","basis":"Observed workers hid their methods from supervisors (Bernstein 2012). Reported results under targets were gamed in health care and in job training (Bevan and Hood 2006, Courty and Marschke 2004). What the figures do once the pressure goes is a prediction. Your indicator tests it.","citations":["bernstein2012","bevan_hood2006","courty_marschke2004"],"cues":[]},{"id":"inaction_outcome_returns","name":"Without the default, many people may do nothing","behaviour":"When a default is removed, many people who make no choice go without what it gave them.","actor":"targeted","signal":"Take-up rate among new joiners after the change.","source":"Enrolment records","unmeasured":"Those who chose are counted. Those who did nothing are not.","mitigations":["Keep a recommended option and prompt a choice","Track take-up among new joiners each month"],"strength":"strong","basis":"At one large US firm, participation was far higher under automatic enrolment than under the earlier opt-in (Madrian and Shea 2001). Defaults shift choices across 58 studies, with wide variation (Jachimowicz and colleagues 2019).","citations":["madrian_shea2001","jachimowicz2019"],"cues":[]},{"id":"task_drifts","name":"Without the deadline or prompt, the task can drift","behaviour":"People who intend to act can put it off once nothing fixes the moment.","actor":"targeted","signal":"Days from the task falling due to its completion.","source":"Task or system logs","unmeasured":"Late completion is still counted as completion.","mitigations":["Keep one fixed date or prompt for the first step","Track time to completion after the change"],"strength":"extrapolation","basis":"Models of present bias explain why costly tasks are put off (O'Donoghue and Rabin 1999). Present bias in effort predicts demand for binding commitment (Augenblick and colleagues 2015). In one field experiment, completion was similar with and without self-chosen deadlines (Bisin and Hyndman 2020). For your task it is a prediction.","citations":["odonoghue_rabin1999","augenblick2015","bisin_hyndman2020"],"cues":[]},{"id":"reminder_hidden_costs","name":"Reminders can prompt action and opt-outs","behaviour":"A reminder can prompt the action and also push some people to opt out of the channel.","actor":"targeted","signal":"Share who unsubscribe or mute after each reminder, next to the share who act.","source":"Email or system analytics","unmeasured":"The extra action is counted. The people who switched the reminders off are not.","mitigations":["Send fewer, better-timed reminders","Track opt-outs next to the action the reminder asks for"],"strength":"extrapolation","basis":"In a field experiment with a charity, reminders increased donations and also increased unsubscriptions from the mailing list. The authors estimate that ignoring these hidden costs overstates the welfare effects for donors by a factor of ten (Damgaard and Gravert 2018). That it happens with workplace reminders is a prediction.","citations":["damgaard_gravert2018"],"cues":[]},{"id":"feedback_lowers_performance","name":"Feedback can lower performance as well as raise it","behaviour":"Some people do worse after feedback because it shifts their attention from the task to themselves.","actor":"targeted","signal":"Median change in performance for each person after feedback, and the share whose performance fell.","source":"Performance records before and after the change","unmeasured":"The average improves, so the people who got worse are not seen.","mitigations":["Make the feedback about the task, not the person","Look at who got worse as well as the average"],"strength":"mixed","basis":"A meta-analysis of 607 effect sizes (23,663 observations) found that feedback improved performance on average, but over a third of the effects were negative (Kluger and DeNisi 1996). Feedback was less effective as attention moved towards
