var TEXT43 = {"minimum_compliance": {"t": "Compliance can settle at the minimum","b": "People can do exactly what the rule requires and stop there.","f": "In a laboratory game, participants in the employee role chose lower effort on average when the participant in the employer role set a minimum, and more than half then chose exactly the minimum (Falk and Kosfeld 2006). Four repetitions found the same result, smaller than in the original (Ziegelmeyer, Schmelz and Ploner 2012). Predicted for firms: staff do what the rule requires and no more.","s": "Share completed on the last day before the deadline, and median time spent, before and after the rule","nb": 1},"goodwill_withdrawn": {"t": "Goodwill can be withdrawn","b": "People who feel distrusted can give less voluntary effort, such as helping a colleague or raising a problem early.","f": "In a field experiment with students, monitoring reduced punctuality whatever the incentives (Belot and Schröder 2016). In a laboratory game, participants who reacted against control said they read it as a signal of distrust (Falk and Kosfeld 2006). Predicted for firms: staff help less and raise fewer problems early.","s": "Problems raised early and offers of help, counted each month before and after the change","x": ["ziegelmeyer2012"]},"breaches_spread": {"t": "Non-compliance can spread between teams","b": "People who see colleagues break a rule can copy them, most readily where they feel no tie to those colleagues.","f": "In a laboratory experiment, people copied the breaches of a group they observed. With no shared trait with that group they took on average an additional 21.9 units of experimental money from a charity, against an additional 7.5 with a shared trait (Bicchieri, Dimant, Gächter and Nosenzo 2022). Predicted for firms: breaches in one team are copied by distant colleagues who see them.","s": "Breaches per team each month, before and after the rule"},"only_the_willing": {"t": "Those who need it least may take part most","b": "A voluntary option can attract the people who needed it least.","f": "In a randomised wellness programme at a large employer, the employees who signed up already had lower medical spending and healthier habits than those who stayed out (Jones, Molitor and Reif 2019). Predicted for other firms: take-up of a voluntary option is highest among staff who were already doing well.","s": "Take-up rate among the people the plan most needs to reach, each month","v": {"explain_involve.start": {"b": "The people who come forward when invited to take part can be those who needed persuading least.","f": "In a randomised wellness programme at a large employer, the employees who signed up already had lower medical spending and healthier habits than those who stayed out (Jones, Molitor and Reif 2019). Predicted for other firms: those who accept an invitation to be involved are mostly staff who already agreed.","s": "Number taking part from the groups the plan most needs to reach, at each session"},"explain_involve.adjust": {"b": "The people who come forward when invited to take part can be those who needed persuading least.","f": "In a randomised wellness programme at a large employer, the employees who signed up already had lower medical spending and healthier habits than those who stayed out (Jones, Molitor and Reif 2019). Predicted for other firms: those who accept an invitation to be involved are mostly staff who already agreed.","s": "Number taking part from the groups the plan most needs to reach, at each session"}},"nb": 1},"task_drifts": {"t": "Without a prompt, the task can be put off","b": "People who mean to act can put it off when no date or prompt remains.","f": "An economic model shows why people put off tasks whose cost comes now and whose benefit comes later (O'Donoghue and Rabin 1999). In a study of effort on real tasks, people put work off, and those who did so more were more likely to choose to commit themselves in advance (Augenblick and colleagues 2015). Predicted for firms: tasks with no date or prompt are completed later.","s": "Days from the task falling due to its completion, before and after the change","x": ["bisin_hyndman2020"],"nb": 1},"performing_for_tracker": {"t": "Activity can be staged for the monitoring system","b": "People can hide or stage what the tracker sees.","f": "A researcher observing from inside a mobile-phone factory found that watched workers hid what they were doing. In a field experiment there, modestly shielding teams from outside observers raised the performance of the line (Bernstein 2012). Predicted for other firms: staff arrange their work so that the tracker records what managers wish to see.","s": "Output per tracked hour, each month before and after the change","nb": 1},"monitoring_crowds_out_effort": {"t": "More monitoring can reduce the effort people give unprompted","b": "Beyond a certain level, monitoring can reduce the effort people give of their own accord.","f": "In a laboratory experiment with an employer role and an employee role, most participants in the employee role worked harder when monitored. Once monitoring passed a threshold, there was evidence that their own motivation to work fell (Dickinson and Villeval 2008). Predicted for firms: beyond a certain level of checking, some staff do only what is checked.","s": "Output per person each month, before and after the level of checking changes","nb": 1},"monitoring_was_deterring": {"t": "The check may have been deterring the behaviour","b": "With fewer checks, people may do more of what the check used to catch.","f": "In a field experiment in call centres, many employees took more advantage when they believed that monitoring had fallen (Nagin and colleagues 2002). Predicted for other firms: once a check is relaxed, the breaches it used to catch become more frequent.","s": "Breaches or errors per random sample, each month before and after the change"},"reports_shift_when_pressure_ends": {"t": "Reported figures can shift once the pressure goes","b": "Once the penalty, target or check goes, hidden cases can surface or gamed figures can fall. The change in the numbers may not be a change in behaviour.","f": "A researcher observing inside a factory found that watched workers hid their methods from supervisors (Bernstein 2012). Studies of targets in English health care and in job training found that reported results were gamed (Bevan and Hood 2006, Courty and Marschke 2004). Predicted for other firms: when the pressure ends, reported figures move although the behaviour is unchanged.","s": "Gap between reported figures and independent checks, before and after the change","v": {"publish_rate.stop": {"b": "Once the pressure goes, hidden cases can surface or gamed figures can fall. The change in the numbers may not be a change in behaviour."}}},"threshold_bunching": {"t": "Amounts may bunch just below the cut-off","b": "Amounts can be sized to fall just below a cut-off.","f": "A study of income tax found reported incomes grouped just below a cut-off (Kleven and Waseem 2013). In public procurement, contracts were sized to avoid a full tender (Palguta and Pertold 2017). Predicted for firms: requests are sized to fall just under the approval limit.","s": "Share of requests just below the approval threshold, before and after the change","nb": 1},"ownership_drops": {"t": "Responsibility for the decision can be diluted","b": "Each person can check less, assuming another will.","f": "In laboratory experiments, people helped less often when other bystanders were present (Darley and Latané 1968) and chose self-interested outcomes more often when responsibility was shared (Falk, Neuber and Szech 2020). An analysis pooling over 7,700 participants found that bystanders reduce helping (Fischer and colleagues 2011). Predicted for firms: each person checks less closely when others share the decision.","s": "Share of errors with a named owner, and time each approver spends per decision, before and after the change","v": {"single_owner.start": {"b": "Once one person is named, others can check less, assuming the owner will.","f": "In laboratory experiments, people helped less often when other bystanders were present (Darley and Latané 1968) and chose self-interested outcomes more often when responsibility was shared (Falk, Neuber and Szech 2020). An analysis pooling over 7,700 participants found that bystanders reduce helping (Fischer and colleagues 2011). Predicted for firms: colleagues check less once they assume the named owner will.","s": "Problems first raised by someone other than the owner, each month before and after the change","t": "Others may check less once an owner is named"},"single_owner.adjust": {"b": "Once one person is named, others can check less, assuming the owner will.","f": "In laboratory experiments, people helped less often when other bystanders were present (Darley and Latané 1968) and chose self-interested outcomes more often when responsibility was shared (Falk, Neuber and Szech 2020). An analysis pooling over 7,700 participants found that bystanders reduce helping (Fischer and colleagues 2011). Predicted for firms: colleagues check less once they assume the named owner will.","s": "Problems first raised by someone other than the owner, each month before and after the change","t": "Others may check less once an owner is named"}}},"removing_screen_lets_through": {"t": "Removing a check can let more irregular cases through","b": "A step that seems only to slow work can keep errors and fraud out.","f": "A study of nearly 11.5 million loans in a government programme found that screening reduced irregular loans and cut fraud losses by at least 744 million dollars (Aman-Rana, Gingerich and Sukhtankar 2023). Predicted for firms: after a screening step is removed, more irregular cases pass.","s": "Irregular cases per thousand, before and after the step is removed"},"override_collapse": {"t": "Staff can overrule the system when it is right","b": "People can overrule a recommendation that was correct.","f": "In a study of hiring across 15 firms, managers who hired against the recommendation of a job test ended up with hires who stayed for less time (Hoffman, Kahn and Li 2018). In a field experiment in a vending-machine firm, workers were reluctant to follow advice from an algorithm (Kawaguchi 2021). Predicted for other firms: staff overrule recommendations that later prove correct.","s": "Share of overruled cases that later proved the system right, each quarter","nb": 1},"judgement_fades": {"t": "Independent judgement can weaken","b": "The skill the system replaced can weaken, so fewer people can catch its errors later.","f": "A paper on automation argued that the skill of an operator declines as the system takes over (Bainbridge 1983). Predicted for firms: staff catch fewer of the errors the system makes as time passes.","s": "Error rate on cases reviewed without the system, each quarter","nb": 1},"reviewers_over_rely": {"t": "Reviewers can follow advice selectively","b": "Reviewers can accept a recommendation more readily when it matches what they already expect.","f": "In one of three experiments in the Netherlands, participants followed advice more readily when it matched group stereotypes, whether it came from an algorithm or from a human expert. The experiments found no general over-reliance on the algorithm (Alon-Barkat and Busuioc 2023). Predicted for firms: reviewers accept the recommendations that fit their expectations and question the others.","s": "Share of recommendations accepted unchanged, split by whether they matched the reviewer's first view"},"explanations_may_not_stop_over_reliance": {"t": "People can accept advice unchecked despite an explanation","b": "Reviewers shown the reasons behind a recommendation can still accept it without checking it.","f": "In an experiment with 199 participants, people continued to rely too heavily on the decisions of the system when explanations were added. Designs that forced people to think significantly reduced that reliance, but those designs received the least favourable ratings (Buçinca, Malaya and Gajos 2021). Predicted for firms: reviewers shown the reasons accept the advice as often as before.","s": "Share of advice accepted without a check, before and after the explanation is added","nb": 1},"skill_gap_on_return": {"t": "People may have lost the skill the system replaced","b": "When the system is withdrawn, people can find themselves deciding without the practice they have lost.","f": "A paper on automation argued that skills an operator no longer uses can decline, so a person taking over from an automatic system may be less able than before (Bainbridge 1983). Predicted for firms: errors in manual decisions rise in the first months after the switch.","s": "Error rate on manual decisions in the first months after the switch, against the rate before the system","nb": 1},"period_end_bunching": {"t": "Results can bunch at the end of the period","b": "Work can be pulled into the last weeks to hit the number, at the cost of the next period.","f": "A study of manufacturing firms found sales higher at the end of the financial year and lower at its start (Oyer 1998). In one software firm, salespeople agreed to lower prices to close deals in the quarters when doing so paid them (Larkin 2014). Predicted for other firms: a growing share of each period's results arrives in its last weeks.","s": "Share of activity in the last two weeks of each period","nb": 1},"cheapest_margin": {"t": "The metric may improve through its easiest component","b": "People may improve only the part of the metric that is easiest to move.","f": "A study of Chicago schools found that scores rose for middle-achieving pupils and not for the lowest-achieving pupils (Neal and Schanzenbach 2010). A study of English health-care targets found large reported gains together with documented gaming (Bevan and Hood 2006). Predicted for firms: the figure improves where it is cheapest to move.","s": "Share of the gain in the metric that comes from its easiest part, each period","x": ["propper2010"]},"unmeasured_quality_slips": {"t": "Unmeasured quality may slip","b": "Things not in the target may get worse to make room for things that are.","f": "A study of Chicago schools held to reading and maths scores found that gains in low-stakes science and social studies lagged for low-achieving pupils (Jacob 2005). Kenyan teachers in schools paid on test scores raised scores only on the rewarded exams (Glewwe, Ilias and Kremer 2010). Predicted for firms: complaints, rework or errors rise in work outside the target.","s": "Complaints, rework or errors per month outside the target, before and after the change","x": ["muralidharan2011","holmstrom_milgrom1991"]},"ratchet_holdback": {"t": "People may hold back to keep future targets low","b": "If the next target is set from the result of this period, people can avoid going far above it.","f": "A study of targets describes how units hold back when next year's target is set from this year's result (Bevan and Hood 2006). Predicted for firms: units finish just above the target and no higher, period after period.","s": "Share of units finishing just above the target, period after period"},"drift_to_stated_rate": {"t": "Those above a published rate may drift towards it","b": "A published rate can become the level people settle at. Those above it can drift towards it.","f": "In a field experiment with 290 households, those using less than the neighbourhood average raised daily electricity use from 10.15 to 11.13 kWh once told the average. The drift appeared where households saw only the average. Similar households who also received a mark of approval stayed at their earlier level (Schultz and colleagues 2007). Predicted for firms: teams above a published rate ease towards it.","s": "Share of earlier top performers now at or below the published rate, each month","x": ["allcott2011"],"nb": 1},"low_rate_message_lowers_rate": {"t": "Stressing how few comply can lower motivation","b": "A message that stresses how many people do not act can motivate less than one that stresses how many do.","f": "In two field experiments on encouraging people to vote, messages stressing high expected turnout motivated voters more than messages stressing low turnout. The authors suggest that lamenting low participation may undermine it, mainly among infrequent or occasional voters (Gerber and Rogers 2009). Predicted for firms: a message built on how many fall short moves fewer staff to act.","s": "Rate of the desired behaviour in the weeks before and after the message","v": {"positive_norm.start": {"t": "A message that mentions those who fall short can motivate less","b": "If the message also says how many do not comply, it can motivate less than one that only says how many do.","f": "In two field experiments on encouraging people to vote, messages stressing high expected turnout motivated voters more than messages stressing low turnout. The authors suggest that lamenting low participation may undermine it, mainly among infrequent or occasional voters (Gerber and Rogers 2009). Predicted for firms: a message that also reports how many fall short moves fewer staff to act.","s": "Rate of the desired behaviour in the weeks before and after the message","nb": 1},"positive_norm.adjust": {"t": "A message that mentions those who fall short can motivate less","b": "If the message also says how many do not comply, it can motivate less than one that only says how many do.","f": "In two field experiments on encouraging people to vote, messages stressing high expected turnout motivated voters more than messages stressing low turnout. The authors suggest that lamenting low participation may undermine it, mainly among infrequent or occasional voters (Gerber and Rogers 2009). Predicted for firms: a message that also reports how many fall short moves fewer staff to act.","s": "Rate of the desired behaviour in the weeks before and after the message","nb": 1}},"nb": 1},"peer_comparison_uneven": {"t": "Peer-comparison messages may affect groups differently","b": "The same comparison message can work for one group and be rejected by another.","f": "In a field experiment with home electricity reports, the report was two to four times more effective with political liberals than with conservatives. Conservatives were also more likely to opt out of the report and to say they disliked it (Costa and Kahn 2013). Predicted for firms: the same comparison moves one group of staff and is rejected by another.","s": "Response rate and opt-out rate to the message, by group, each month","nb": 1},"gains_fade_after_stop": {"t": "Gains can fade slowly once the plan stops","b": "The behaviour can drift back slowly once the plan ends.","f": "In a home-energy programme that sent households regular reports comparing them with their neighbours, the savings decayed by about 10 to 20 per cent a year after the reports stopped (Allcott and Rogers 2014). Predicted for firms: the rate drifts back over the following months.","s": "Monthly rate of the behaviour after the stop, against the months before","x": ["brandon2017"],"v": {"reminder.start": {"b": "The behaviour a reminder improves can drift back slowly once the reminders end.","f": "In a home-energy programme that sent households regular reports comparing them with their neighbours, the savings decayed by about 10 to 20 per cent a year after the reports stopped (Allcott and Rogers 2014). Predicted for firms: once the reminders end, the rate drifts back over the following months.","s": "Monthly rate of the behaviour while the reminders run and after they end"},"reminder.adjust": {"b": "The behaviour a reminder improves can drift back slowly once the reminders end.","f": "In a home-energy programme that sent households regular reports comparing them with their neighbours, the savings decayed by about 10 to 20 per cent a year after the reports stopped (Allcott and Rogers 2014). Predicted for firms: once the reminders end, the rate drifts back over the following months.","s": "Monthly rate of the behaviour while the reminders run and after they end"}},"nb": 1},"fine_becomes_price": {"t": "A fine can be treated as a price","b": "People may keep doing it and treat the fine as the price.","f": "In a field experiment, six of ten day-care centres introduced a fine for late collection. Late collection rose in those six, and the authors read this as the fine changing how parents saw the arrangement (Gneezy and Rustichini 2000). A review names four routes by which an incentive can displace existing motives (Bowles and Polanía-Reyes 2012). Predicted for firms: staff pay the fine and carry on.","s": "Share of fines paid by repeat payers, each month","nb": 1},"goes_underground": {"t": "The behaviour can be hidden rather than stopped","b": "People can hide the behaviour instead of stopping it, so reported numbers fall while the actual rate may stay where it was.","f": "A researcher observing from inside a mobile-phone factory found that workers who were being watched hid their methods from supervisors (Bernstein 2012). Predicted for other firms: under a fine or a ban, self-reported breaches fall while independent checks find as many as before.","s": "Breaches found by independent checks, against those self-reported, before and after the change"},"effect_outlasts_removal": {"t": "The former motive may not return","b": "Once a fine or reward has been used, withdrawing it may not bring the behaviour back to where it was.","f": "In a field experiment in ten day-care centres, late collection rose in the six that introduced a fine and stayed high once the fine was removed (Gneezy and Rustichini 2000). Two reviews report that incentives can displace the motives people already had (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012). Predicted for firms: after a fine or reward is withdrawn, the behaviour stays where the fine or reward left it.","s": "Monthly rate of the behaviour after withdrawal, against its level before the fine or reward","v": {"incentive.stop": {"b": "After a reward ends, the behaviour may not return to where it stood before the reward began.","f": "In a field experiment in ten day-care centres, late collection rose in the six that introduced a fine and stayed high once the fine was removed (Gneezy and Rustichini 2000). Two reviews report that incentives can displace the motives people already had (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012). Predicted for firms: after a reward ends, the behaviour settles away from its level before the reward began.","s": "Monthly rate of the behaviour after the reward ends, against its level before the reward began"},"realign_incentive.start": {"b": "After a reward ends, the behaviour may not return to where it stood before the reward began.","f": "In a field experiment in ten day-care centres, late collection rose in the six that introduced a fine and stayed high once the fine was removed (Gneezy and Rustichini 2000). Two reviews report that incentives can displace the motives people already had (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012). Predicted for firms: after a reward ends, the behaviour settles away from its level before the reward began.","s": "Monthly rate of the behaviour after the reward ends, against its level before the reward began"},"realign_incentive.adjust": {"b": "After a reward ends, the behaviour may not return to where it stood before the reward began.","f": "In a field experiment in ten day-care centres, late collection rose in the six that introduced a fine and stayed high once the fine was removed (Gneezy and Rustichini 2000). Two reviews report that incentives can displace the motives people already had (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012). Predicted for firms: after a reward ends, the behaviour settles away from its level before the reward began.","s": "Monthly rate of the behaviour after the reward ends, against its level before the reward began"}}},"unrewarded_work_shrinks": {"t": "Unrewarded work may shrink","b": "Valuable work that is not rewarded may get less effort.","f": "A study of Chicago schools held to reading and maths scores found that gains in low-stakes science and social studies lagged for struggling pupils (Jacob 2005). An economic theory of jobs with several tasks predicts this (Holmström and Milgrom 1991). Predicted for firms: fewer hours go to contributions that carry no reward, such as helping a colleague.","s": "Hours each month on one unrewarded contribution, such as helping a colleague, before and after the change","x": ["muralidharan2011"],"nb": 1},"short_term_incentive_weakens_motive": {"t": "An incentive can work and still weaken earlier motives","b": "A reward can work now while weakening the reason people had before.","f": "A review covering education, contributions to public goods and lifestyle change reports that monetary incentives can change how people see a task. Some incentives work in the short term and still weaken the motives people had without them (Gneezy, Meier and Rey-Biel 2011). Predicted for firms: once the reward ends, the behaviour falls below its level before the reward began.","s": "Rate of the behaviour in the weeks after the incentive ends, against before it started","v": {"incentive.stop": {"b": "A reward that has run for a while can leave the earlier reason weaker once it ends.","f": "A review covering education, contributions to public goods and lifestyle change reports that monetary incentives can change how people see a task. Some incentives work in the short term and still weaken the motives people had without them (Gneezy, Meier and Rey-Biel 2011). Predicted for firms: after the reward ends, the behaviour settles below its level before the reward began.","s": "Rate of the behaviour in the weeks after the reward ends, against before it started"},"realign_incentive.start": {"b": "A reward that has run for a while can leave the earlier reason weaker once it ends.","f": "A review covering education, contributions to public goods and lifestyle change reports that monetary incentives can change how people see a task. Some incentives work in the short term and still weaken the motives people had without them (Gneezy, Meier and Rey-Biel 2011). Predicted for firms: after the reward ends, the behaviour settles below its level before the reward began.","s": "Rate of the behaviour in the weeks after the reward ends, against before it started"},"realign_incentive.adjust": {"b": "A reward that has run for a while can leave the earlier reason weaker once it ends.","f": "A review covering education, contributions to public goods and lifestyle change reports that monetary incentives can change how people see a task. Some incentives work in the short term and still weaken the motives people had without them (Gneezy, Meier and Rey-Biel 2011). Predicted for firms: after the reward ends, the behaviour settles below its level before the reward began.","s": "Rate of the behaviour in the weeks after the reward ends, against before it started"}},"nb": 1},"payment_reduces_supply": {"t": "Payment can reduce a voluntary act among some groups","b": "Adding a payment can make some people less willing to do what they did unpaid.","f": "In a field experiment on blood donation, the offer of a payment of 50 Swedish kronor significantly reduced donation among women. Where women could direct the payment to charity, the reduction was offset (Mellström and Johannesson 2008). Predicted for firms: a payment for something staff did unpaid lowers the number who do it in some groups.","s": "Rate of giving or volunteering, by group, before and after the payment","nb": 1},"behaviour_moves_elsewhere": {"t": "The behaviour can move elsewhere","b": "People can keep doing what was banned or capped by another route, such as unrecorded overtime or spending split across budgets.","f": "A study of regulations on plastic carrier bags found that they eliminated 40 million lb of plastic bags, offset by an increase of 12 million lb in purchases of rubbish bags. Sales of small rubbish bags rose by 120 per cent (Taylor 2019). Predicted for firms: the banned behaviour reappears where the rule does not reach.","s": "Count of the same behaviour where the rule does not reach, before and after the change"},"loosened_limit_raises_use": {"t": "Loosening a limit can raise use and harm","b": "When a limit on access is relaxed, use of the restricted item and related harm can rise.","f": "In a Swedish trial, opening alcohol shops on Saturdays raised alcohol use and crime (Grönqvist and Niknami 2014). After Michigan partly repealed its motorcycle helmet law, helmet use among riders in crashes fell from 93.2 to 70.8 per cent (Carter and colleagues 2017). Predicted for firms: use of what the limit covered rises, and related incidents rise with it.","s": "Use of what the limit covered, and related incidents, per month against the months before","nb": 1},"choice_becomes_hurdle": {"t": "With many options, some people may not choose at all","b": "Faced with a required choice, some people can put the decision off or pick at random.","f": "In records for nearly 800,000 employees, participation in a retirement savings plan was higher where the plan offered a handful of funds than where it offered ten or more (Sethi-Iyengar, Huberman and Jiang 2004). Predicted for firms: the more options a required choice presents, the more staff leave it unmade at the deadline.","s": "Share who have not chosen by the deadline, at each round","v": {"make_voluntary.start": {"t": "With many options, some people may not choose at all","b": "Left to choose how or when, some people put the choice off.","f": "In records for nearly 800,000 employees, participation in a retirement savings plan was higher where the plan offered a handful of funds than where it offered ten or more (Sethi-Iyengar, Huberman and Jiang 2004). Predicted for firms: the more options a voluntary scheme offers, the more staff leave the choice unmade.","s": "Share who have not chosen by the deadline, at each round"},"make_voluntary.adjust": {"t": "With many options, some people may not choose at all","b": "Left to choose how or when, some people put the choice off.","f": "In records for nearly 800,000 employees, participation in a retirement savings plan was higher where the plan offered a handful of funds than where it offered ten or more (Sethi-Iyengar, Huberman and Jiang 2004). Predicted for firms: the more options a voluntary scheme offers, the more staff leave the choice unmade.","s": "Share who have not chosen by the deadline, at each round"}}},"disclosure_biases_advice": {"t": "Having explained, managers can feel freer to insist","b": "Once the reason has been given, those enforcing the rule can feel entitled to press it harder.","f": "In a laboratory study of advisers, disclosing a conflict of interest could increase the bias in their advice, because advisers may feel licensed by having disclosed. Those advised also discounted biased advice less than they should (Cain, Loewenstein and Moore 2005). Predicted for firms: managers who have given their reason feel licensed in the same way, press the rule harder and grant fewer exceptions.","s": "Exceptions requested and granted per month, before and after the explanation"},"stuck_on_default": {"t": "People can stay on an unsuitable default","b": "People often keep the pre-set option, whether or not it suits them.","f": "An analysis pooling 58 default studies with 73,675 participants found that defaults shift choices considerably on average (Jachimowicz and colleagues 2019). After automatic enrolment at one large US firm, a substantial fraction of new participants kept both the default contribution rate and the default fund (Madrian and Shea 2001). Predicted for other firms: a large share of staff stay on the pre-set option, including some it does not suit.","s": "Share on the default by subgroup, and the rate of later reversals, each quarter","nb": 1},"default_moves_choices_not_total": {"t": "A default can shift choices without raising the total","b": "A pre-set amount can shift what each person does, and the overall total can stay about the same.","f": "In a large field experiment in online fundraising, defaults strongly affected what individual donors did, but the total level of donations was unaffected (Altmann and colleagues 2019). Predicted for firms: a new default changes individual choices and leaves the overall total where it was.","s": "Total amount and number of people taking part, before and after the default","nb": 1},"inaction_outcome_returns": {"t": "Without the default, many people may do nothing","b": "When a default is removed, many people who make no choice go without what it gave them.","f": "At one large US firm, participation in the savings plan was far higher under automatic enrolment than under the earlier arrangement in which staff had to opt in (Madrian and Shea 2001). An analysis pooling 58 studies found that defaults shift choices (Jachimowicz and colleagues 2019). Predicted for other firms: after the default is removed, take-up among new joiners falls.","s": "Take-up rate among new joiners, before and after the change"},"active_choice_completes_less": {"t": "Asking people to choose can lower completion","b": "When people must make an explicit choice, fewer may complete the action than when it is done for them with an easy way to opt out.","f": "In a randomised trial of 20,509 patients, three messages asking patients to choose produced screening completion of 14.5 to 17.4 per cent. A kit posted to patients by default produced 26.2 per cent (Galoosian and colleagues 2025). Predicted for firms: fewer staff complete an action they must choose than one done for them by default.","s": "Share who completed the action by the deadline, before and after the change"},"reminder_hidden_costs": {"t": "Reminders can prompt action and opt-outs","b": "A reminder can prompt the action and also push some people to opt out of the channel.","f": "In a field experiment with a charity, reminders increased donations and also increased the number of people leaving the mailing list. The authors estimate that ignoring this hidden cost overstates the benefit to donors by a factor of ten (Damgaard and Gravert 2018). Predicted for firms: each reminder prompts some staff to act and others to mute the channel.","s": "Share who unsubscribe or mute after each reminder, next to the share who act","nb": 1},"self_set_deadlines_weaker": {"t": "Self-set deadlines may be too loose to work fully","b": "A deadline people set for themselves can be too loose to work fully.","f": "A study found that deadlines people set for themselves helped them control delay and improved their performance on the task, though less than deadlines imposed by someone else (Ariely and Wertenbroch 2002). Predicted for firms: staff who choose their own dates finish on time less often than staff given a date.","s": "Share of tasks finished by the date people set themselves, before and after the change","v": {"commitment.stop": {"b": "Without a date they have set themselves, people can put the task off more.","f": "A study of deadlines found that those people set for themselves helped them control delay and improved their performance on the task (Ariely and Wertenbroch 2002). Predicted for firms: once staff are no longer asked for a date, more tasks finish late.","s": "Share of tasks finished on time, before and after the commitment is dropped","t": "Without their own date, people may delay the task"}},"nb": 1},"commitment_product_losses": {"t": "A commitment can leave many people worse off","b": "If the penalty for missing a commitment is too weak, people can miss it and end up worse off.","f": "In a field experiment in the Philippines, a commitment to save in instalments raised average bank savings, but 55 per cent of clients broke the commitment and lost money (John 2020). The author attributes this to penalties too low to overcome problems of self-control. Predicted for firms: where missing a commitment costs little, many staff miss it.","s": "Share who miss the commitment and the amount lost per person, each month"},"above_average_do_less": {"t": "Those doing better than average may ease off","b": "Telling people the average may pull those who were doing better towards it.","f": "In a field experiment with 290 households, those using less than the neighbourhood average raised daily electricity use from 10.15 to 11.13 kWh once told the average. Those who also received a mark of approval held their level (Schultz and colleagues 2007). Norm messages can backfire unless designed carefully (Bicchieri and Dimant 2022). Predicted for firms: staff above the stated average ease towards it.","s": "Share of earlier above-average people who fall below average after the message","x": ["allcott2011"],"nb": 1},"feedback_lowers_performance": {"t": "Feedback can lower some people's performance","b": "Some people do worse after feedback, more so when it turns their attention to themselves and away from the task.","f": "An analysis pooling 607 measured effects from 23,663 observations found that feedback improved performance on average, but that over a third of the effects were negative (Kluger and DeNisi 1996). Feedback was less effective as attention moved towards the self and away from the task. Predicted for firms: after feedback, a minority of staff perform worse than before.","s": "Median change in performance per person after feedback, and the share whose performance fell","nb": 1},"rank_feedback_backfires": {"t": "Showing people their rank can lower their output","b": "People told how they rank against others can do less.","f": "In a field experiment with online workers paid per task, those given feedback on their rank were less likely to return to work and less productive on the job than a control group (Barankay 2011). Predicted for firms: staff shown a ranking return less readily to the ranked task and produce less.","s": "Rate of return to the task and output per person, before and after ranks are shown","nb": 1},"saving_licenses_use_elsewhere": {"t": "Saving in one area can license more use elsewhere","b": "People who cut one resource after feedback can use more of another.","f": "In a field study of 154 apartments, residents given weekly feedback on water use cut water use by 6.0 per cent but raised electricity use by 5.6 per cent relative to a comparison group (Tiefenbeck and colleagues 2013). The authors read this as one good act being used to justify a less good one. Predicted for firms: a team that saves in the measured area spends more freely in another.","s": "Use of a related resource per person, before and after the feedback","nb": 1},"blame_shifted_to_owner": {"t": "Blame can fall on the named owner","b": "Delegating a decision to one named person can move the blame onto that person and away from those behind the decision.","f": "In a laboratory experiment on delegation, responsibility for a decision could be shifted effectively, and blame moved to the person who made the choice (Bartling and Fischbacher 2012). In further laboratory experiments, punishment by onlookers fell when an intermediary was added (Coffman 2011). Predicted for firms: when something goes wrong, colleagues point to the named owner.","s": "Share of problems where others point to the named owner, and time to the first action by anyone else, each quarter"},"measures_become_the_goal": {"t": "People can treat the measures as the goal itself","b": "With a set of measures, people can chase the numbers and lose sight of the strategy they stand for.","f": "In an experiment, people who took part in choosing the strategy were less likely to treat the performance measures as the goals themselves. Deliberating about the strategy without choosing it did not have this effect (Choi, Hecht and Tayler 2013). Predicted for firms: decisions are justified by the measure, and the strategy behind it goes unmentioned.","s": "Share of decisions in reviews explained by a measure and not by the strategy, each quarter"},"time_absorbed": {"t": "The extra time can be absorbed","b": "Other work can take up the extra time or resource, and the original behaviour can stay the same.","f": "An economic model shows why people put off tasks whose cost comes now and whose benefit comes later (O'Donoghue and Rabin 1999). Predicted for firms: the added hours go to other work, and time on the intended activity stays flat.","s": "Hours per week spent on the intended activity, before and after the change"},"households_offset_resources": {"t": "People may cut back when they expect extra resources","b": "When people expect extra resources, they can cut back their own, so the net gain shrinks.","f": "A study of school grants in Zambia and India found that households cut their own spending when they expected a grant. Grants that came unexpectedly improved test scores (Das and colleagues 2013). Predicted for firms: teams told in advance of extra resources reduce what they put in themselves.","s": "Own spending or effort per person, before and after the extra resource is announced","nb": 1},"staff_ease_off_when_help_arrives": {"t": "Existing staff may ease off when extra help arrives","b": "When extra help arrives, the existing team can reduce its own effort.","f": "In an experiment in Kenyan primary schools, funding school committees to hire contract teachers cut class size from 82 to 44 pupils. Civil-service teachers reduced their effort, and test scores did not rise significantly for pupils in the existing classes (Duflo, Dupas and Kremer 2015). Predicted for firms: when extra staff arrive, the existing team does less.","s": "Hours worked and tasks completed per existing staff member, before and after the extra help","nb": 1},"training_becomes_box_ticking": {"t": "Training can become box-ticking","b": "Completing the training can become the aim, and people can do the minimum needed to be marked as complete.","f": "In a laboratory game, more than half of the participants in the employee role chose exactly the minimum once a minimum was required (Falk and Kosfeld 2006). Predicted for firms: staff complete required training with the least effort that counts as completion.","s": "Share of staff who can apply it one month later, measured by a brief practical test"},"training_effects_fade": {"t": "Training effects can be small and fade","b": "Training can leave a record of attendance while the behaviour changes little.","f": "An analysis pooling 168 papers covering 201 studies found that financial-literacy programmes account for 0.1 per cent of the differences in the behaviours studied, with negligible effects 20 months or more after even large programmes (Fernandes, Lynch and Netemeyer 2014). Predicted for firms: attendance is recorded, and the trained behaviour changes little in the following months.","s": "Share applying the skill three and twelve months after the training"}};
