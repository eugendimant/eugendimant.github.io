 opening of alcohol stores raised alcohol use and crime (Grönqvist and Niknami 2014). Partly repealing Michigan's helmet law cut helmet use in crashes from 93.2 to 70.8 per cent (Carter and colleagues 2017). That it holds at work is a prediction.","citations":["gronqvist_niknami2014","carter2017"],"cues":[]},{"id":"active_choice_completes_less","name":"Asking people to choose can complete less than doing it for them","behaviour":"When people must make an explicit choice, fewer may complete the action than when it is done for them with an easy opt-out.","actor":"targeted","signal":"Share who completed the action by the deadline, against a group for whom it was done by default.","source":"Completion records","unmeasured":"Everyone who chose is counted. The people who never got round to it are not.","mitigations":["Test the choice against a default on one group first","Send the default version to anyone who has not chosen by the deadline"],"strength":"extrapolation","basis":"In a randomised trial of 20,509 patients, three active-choice messages produced 14.5 to 17.4 per cent screening completion. A mailed kit, the default, produced 26.2 per cent (Galoosian and colleagues 2025). That it holds in organisations is a prediction.","citations":["galoosian2025"],"cues":[]},{"id":"choice_becomes_hurdle","name":"Some people may delay when a choice is required","behaviour":"Some people who would have been fine on the default can put the decision off or pick at random.","actor":"targeted","signal":"Share who have not chosen by the deadline, and share who later reverse their choice.","source":"Enrolment records","unmeasured":"Everyone who chose is counted. The people who stalled are not.","mitigations":["Offer a recommended option alongside the choice","Set a clear deadline and a fallback"],"strength":"extrapolation","basis":"In data on nearly 800,000 employees, 401(k) participation was higher in plans offering a handful of funds than in plans offering ten or more (Sethi-Iyengar, Huberman and Jiang 2004). That is about menu size, and delay among people who would have been fine on a default is a proposal your figure can test.","citations":["iyengar2004"],"cues":[]},{"id":"breaches_spread","name":"Breaches can spread where ties are weak","behaviour":"Where staff feel no closeness to the colleagues whose breaches they see, they can copy the breaches and ignore the compliance, so compliance can slide after launch.","actor":"targeted","signal":"Breaches per team each month, and whether they cluster in teams that see each other.","source":"Compliance logs by team","unmeasured":"The launch month is what gets reported, and it looks fine.","mitigations":["Show each team its own compliance","Show staff the compliance of colleagues they feel close to"],"strength":"extrapolation","basis":"In a laboratory experiment, people with no shared trait with the group they observed copied its breaches, taking on average an additional 21.9 ECUs from the charity, against an additional 7.5 with a shared trait (Bicchieri, Dimant, Gächter and Nosenzo 2022). Breaches among distant colleagues are the firm-level prediction.","citations":["bicchieri_etal2022"],"cues":[],"card":"Laboratory: without a tie, people took an additional 21.9 ECUs from a charity. With a shared trait they took an additional 7.5 (Bicchieri, Dimant, Gächter and Nosenzo 2022).","ev_note":"Shown in a laboratory experiment."},{"id":"useful_effect_lost","name":"Something useful can go with the old target or incentive","behaviour":"The removed target or incentive may also have encouraged a desirable behaviour.","actor":"targeted","signal":"Monthly count of the good outcome the old incentive also paid for.","source":"Performance data","unmeasured":"What the old incentive achieved was never recorded.","mitigations":["List what the old target or incentive rewarded before removing it","Phase the change in and monitor the useful outcome"],"strength":"extrapolation","basis":"A prediction from how this intervention works. Your indicator tests it.","citations":[],"cues":[]},{"id":"gains_fade_after_stop","name":"The improvement can fade slowly once it stops","behaviour":"The behaviour it improved can drift back, slowly, once the prompt, message or programme ends, though much of the effect can persist.","actor":"targeted","signal":"The target behaviour's monthly rate after the stop, against the months before.","source":"Monthly behaviour records","unmeasured":"Once it stops, no one tracks what it was improving.","mitigations":["Stop it for one team first and compare","Keep tracking the behaviour after it ends"],"strength":"extrapolation","basis":"In a home-energy programme, savings from comparison reports lasted after the reports stopped but decayed by about 10 to 20 per cent a year (Allcott and Rogers 2014). In 38 energy-nudge field experiments, reductions persisted in many after treatment ended (Brandon and colleagues 2017). That it holds for workplace prompts is a prediction.","citations":["allcott_rogers2014","brandon2017"],"cues":[]},{"id":"effect_outlasts_removal","name":"The old motive may not come back","behaviour":"Once a fine or reward is withdrawn, the behaviour may not return to where it was before.","actor":"targeted","signal":"The behaviour's monthly rate after withdrawal, against its level before the fine or reward.","source":"Fine, fee or performance records","unmeasured":"Withdrawal is counted as the end of the problem.","mitigations":["Say why it is ending and watch the behaviour in the weeks after","Compare with the level before it began, not with the level under it"],"strength":"mixed","basis":"In a day-care field experiment, late collection rose after a fine and stayed high once it was removed (Gneezy and Rustichini 2000). Reviews find crowding out in some settings and not others (Frey and Jegen 2001, Bowles and Polanía-Reyes 2012).","citations":["gneezy_rustichini2000","frey_jegen2001","bowles_polania2012"],"cues":[]},{"id":"skill_gap_on_return","name":"People may have lost the skill the system replaced","behaviour":"When the system is withdrawn, people can decide without the practice they lost.","actor":"targeted","signal":"Error rate on manual decisions in the first months after the switch.","source":"Decision and error records","unmeasured":"The switch is reported as done once people take over.","mitigations":["Run practice cases by hand before the switch","Check a sample of manual decisions closely at first"],"strength":"extrapolation","basis":"Bainbridge (1983) argued that skills an operator no longer uses can decline, so a person taking over from automation may be less able than before. For your decisions it is a prediction. Your indicator tests it.","citations":["bainbridge1983"],"cues":[]},{"id":"ratchet_holdback","name":"People can hold back to keep the next target low","behaviour":"If the next target is set from this period's result, people can avoid going far above it.","actor":"targeted","signal":"Share of units finishing just above the target, period after period.","source":"Performance records by unit","unmeasured":"Results just above target look like success.","mitigations":["Do not set the next target from this result alone","Say in advance how the next target will be set"],"strength":"extrapolation","basis":"Bevan and Hood list the ratchet effect, next year's target set from this year's result, among the gaming problems of the Soviet target regime. For your targets it is a prediction. Your indicator tests it.","citations":["bevan_hood2006"],"cues":[]},{"id":"reports_shift_when_pressure_ends","name":"Reported figures can shift once the pressure goes","behaviour":"Once the penalty, target or watcher goes, hidden cases can surface, or gamed figures can fall. The change in the numbers may not be real.","actor":"targeted","signal":"Gap between reported figures and independent checks, before and after.","source":"Audit findings","unmeasured":"The reported figures are read as the real trend.","mitigations":["Measure independently of self-report","Agree in advance how a rise or fall in reports will be read"],"strength":"extrapolation","basis":"Observed workers hid their methods from supervisors (Bernstein 2012). Reported results under targets were gamed in health care and in job training (Bevan and Hood 2006, Courty and Marschke 2004). What the figures do once the pressure goes is a prediction. Your indicator tests it.","citations":["bernstein2012","bevan_hood2006","courty_marschke2004"],"cues":[]},{"id":"inaction_outcome_returns","name":"Without the default, many people may do nothing","behaviour":"When a default is removed, the outcome of making no choice applies again, and many people can end up there.","actor":"targeted","signal":"Take-up rate among new joiners after the change.","source":"Enrolment records","unmeasured":"Those who chose are counted. Those who did nothing are not.","mitigations":["Keep a recommended option and prompt a choice","Track take-up among new joiners each month"],"strength":"strong","basis":"At one large US firm, participation was far higher under automatic enrolment than under the earlier opt-in (Madrian and Shea 2001). Defaults shift choices across 58 studies, with wide variation (Jachimowicz and colleagues 2019).","citations":["madrian_shea2001","jachimowicz2019"],"cues":[]},{"id":"task_drifts","name":"Without the deadline or prompt, the task can drift","behaviour":"People who intend to act can put it off once nothing fixes the moment.","actor":"targeted","signal":"Days from the task falling due to its completion.","source":"Task or system logs","unmeasured":"Late completion is still counted as completion.","mitigations":["Keep one fixed date or prompt for the first step","Track time to completion after the change"],"strength":"extrapolation","basis":"Models of present bias explain why costly tasks are put off (O'Donoghue and Rabin 1999). Present bias in effort predicts demand for binding commitment (Augenblick and colleagues 2015). In one field experiment, completion was similar with and without self-chosen deadlines (Bisin and Hyndman 2020). For your task it is a prediction.","citations":["odonoghue_rabin1999","augenblick2015","bisin_hyndman2020"],"cues":[]},{"id":"reminder_hidden_costs","name":"Reminders can raise action and also opt-outs","behaviour":"A reminder can prompt the action and also push some people to opt out of the channel.","actor":"targeted","signal":"Share who unsubscribe or mute after each reminder, next to the share who act.","source":"Email or system analytics","unmeasured":"The extra action is counted. The people who switched the reminders off are not.","mitigations":["Send fewer, better-timed reminders","Track opt-outs next to the action the reminder asks for"],"strength":"extrapolation","basis":"In a field experiment with a charity, reminders increased donations and also increased unsubscriptions from the mailing list. The authors estimate that ignoring these hidden costs overstates the welfare effects for donors by a factor of ten (Damgaard and Gravert 2018). That it happens with workplace reminders is a prediction.","citations":["damgaard_gravert2018"],"cues":[]},{"id":"feedback_lowers_performance","name":"Feedback can lower performance as well as raise it","behaviour":"Some people do worse after feedback because it shifts their attention from the task to themselves.","actor":"targeted","signal":"Median change in performance for each person after feedback, and the share whose performance fell.","source":"Performance records before and after","unmeasured":"The average improves, so the people who got worse are not seen.","mitigations":["Make the feedback about the task, not the person","Look at who got worse as well as the average"],"strength":"mixed","basis":"A meta-analysis of 607 effect sizes (23,663 observations) found that feedback improved performance on average, but over a third of the effects were negative (Kluger and DeNisi 1996). Feedback was less effective as attention moved towards the self and away from the task.","citations":["kluger_denisi1996"],"cues":[]},{"id":"default_moves_choices_not_total","name":"A default can move individual choices without raising the total","behaviour":"A preset amount can shift what each person gives or does, and the overall total can stay about the same.","actor":"targeted","signal":"Total amount and number of people taking part, before and after the default, by group.","source":"Records of choices before and after","unmeasured":"Individual choices change, so the default looks effective while the total stays flat.","mitigations":["Compare totals as well as individual choices","Test the default on a sample first"],"strength":"extrapolation","basis":"In a large online fundraising field experiment, defaults strongly affected individual behaviour, yet aggregate donation levels were unaffected by defaults. Co-donations to the platform increased with the default amount (Altmann and colleagues 2019). That it holds for workplace defaults is a prediction.","citations":["altmann2019"],"cues":[]},{"id":"households_offset_resources","name":"Households may offset extra school resources they expect","behaviour":"When people expect extra resources, they can cut back their own, so the net gain shrinks.","actor":"nearby","signal":"Own spending or effort per person before and after the extra resource is announced.","source":"Spending or effort records before and after","unmeasured":"The new resource is counted. What people stopped putting in is not.","mitigations":["Announce the extra resource late or tie it to what people put in","Track people's own input as well as the new resource"],"strength":"extrapolation","basis":"Using school grants in Zambia and India, households offset anticipated grants more than unanticipated grants. Unanticipated grants improved test scores, while anticipated grants had no measurable effect on them (Das and colleagues 2013). That it happens when an organisation adds resources is a prediction.","citations":["das2013"],"cues":[]},{"id":"staff_ease_off_when_help_arrives","name":"Extra staff can lead existing staff to ease off","behaviour":"When extra help arrives, the existing team can reduce its own effort.","actor":"nearby","signal":"Hours worked and tasks completed per existing staff member, before and after the extra help.","source":"Time and output records","unmeasured":"Total capacity rises on paper, so the drop in effort of existing staff is hidden.","mitigations":["Set what the existing team still owns","Track output per person as well as the total"],"strength":"extrapolation","basis":"Funding Kenyan school committees to hire contract teachers cut class size from 82 to 44 pupils, but test scores did not rise significantly for students in existing classes (Duflo, Dupas and Kremer 2015). Civil-service teachers reduced their effort. That it happens elsewhere is a prediction.","citations":["duflo2015"],"cues":[]},{"id":"self_set_deadlines_weaker","name":"Self-set deadlines can help, but less than outside ones","behaviour":"A deadline people set for themselves can be too loose to work fully.","actor":"targeted","signal":"Share of tasks finished on time under self-set deadlines, against outside deadlines.","source":"Task completion records","unmeasured":"Everyone has a deadline, so the plan looks complete while the deadlines are loose.","mitigations":["Add an outside check on the self-set date","Compare self-set and outside deadlines on a sample"],"strength":"mixed","basis":"Self-imposed deadlines helped people control procrastination and improved task performance, but they were less effective than externally imposed deadlines (Ariely and Wertenbroch 2002).","citations":["ariely2002"],"cues":[]},{"id":"commitment_product_losses","name":"A commitment can leave many people worse off","behaviour":"If the penalty for missing a commitment is too weak, people can default and lose money.","actor":"targeted","signal":"Share who miss the commitment and the amount lost per person.","source":"Records of commitments and outcomes","unmeasured":"The average result looks good, so the people who defaulted are not seen.","mitigations":["Make the penalty strong enough to matter","Let people start with a small commitment"],"strength":"extrapolation","basis":"In a field experiment in the Philippines, an installment-savings commitment raised average bank savings, but 55 per cent of clients defaulted and lost money (John 2020). The author attributes this to penalties too low to overcome self-control problems. That it holds for workplace commitments is a prediction.","citations":["john2018"],"cues":[]},{"id":"rank_feedback_backfires","name":"Rank feedback can reduce return and output","behaviour":"People told how they rank against others can do less, not more.","actor":"targeted","signal":"Rate of return to the task and output per person, for those who see their rank and those who do not.","source":"Task and output records","unmeasured":"The top of the ranking improves, so the people who stopped coming back are not seen.","mitigations":["Show progress against a personal goal, not rank","Compare people who see rank with people who do not"],"strength":"extrapolation","basis":"In a crowd-sourcing field experiment with no pay consequence, workers given rank feedback were less likely to return to work and less productive on the job than a control group (Barankay 2011). It is a working paper. That it holds in organisations is a prediction.","citations":["barankay2011"],"cues":[]},{"id":"saving_licenses_use_elsewhere","name":"Saving in one area can license using more in another","behaviour":"People who cut one resource after feedback can use more of another.","actor":"targeted","signal":"Change in use of a related resource per person, for those who got feedback and those who did not.","source":"Records of related use","unmeasured":"Only the target resource is tracked, so the rise elsewhere is not seen.","mitigations":["Track the nearest related behaviour as well","Give feedback on the related resource too"],"strength":"extrapolation","basis":"In 154 apartments, residents given weekly water-use feedback cut water use by 6.0 per cent but raised electricity use by 5.6 per cent relative to controls (Tiefenbeck and colleagues 2013). The authors say the findings fit moral licensing and call for more work on the mechanism. That it happens in organisations is a prediction.","citations":["tiefenbeck2013"],"cues":[]},{"id":"peer_comparison_uneven","name":"Peer-comparison messages may land unevenly across groups","behaviour":"The same comparison message can work for one group and be rejected by another.","actor":"targeted","signal":"Response rate and opt-out rate to the message, by group.","source":"Message analytics by group","unmeasured":"The average response looks fine, so the groups that rejected it are not seen.","mitigations":["Test the message with each group first","Track opt-outs by group"],"strength":"extrapolation","basis":"In a home electricity report experiment, the report was two to four times more effective with political liberals than with conservatives. Conservatives were also more likely to opt out of the report and to say they disliked it (Costa and Kahn 2013). That it holds for workplace messages is a prediction.","citations":["costa_kahn2013"],"cues":[]},{"id":"low_rate_message_lowers_rate","name":"Saying that few people do it can lower the rate","behaviour":"A message that laments how few people act can make acting seem less normal.","actor":"targeted","signal":"Rate of the desired behaviour after the message, for those told the rate is low and those told it is high.","source":"Behaviour records by message version","unmeasured":"The message is about the problem, so no one checks whether it lowers the rate.","mitigations":["Say what most people do right, not what few do","Test the wording before the launch"],"strength":"extrapolation","basis":"In two get-out-the-vote field experiments, messages stressing high expected turnout motivated voters more than messages stressing low turnout. The authors suggest that lamenting low participation may undermine turnout, mainly among infrequent or occasional voters (Gerber and Rogers 2009). That it holds in organisations is a prediction.","citations":["gerber_rogers2009"],"cues":[]},{"id":"training_effects_fade","name":"Training effects can fade and explain little behaviour","behaviour":"Training can leave a record of attendance while the behaviour changes little.","actor":"targeted","signal":"Share applying the skill three and twelve months after the training, against attendance.","source":"Follow-up checks of behaviour","unmeasured":"Attendance is recorded and looks complete, so no one checks what people do later.","mitigations":["Follow up after three months and again after a year","Add reminders or practice close to the moment of use"],"strength":"extrapolation","basis":"A meta-analysis of 168 papers (201 studies) found financial-literacy interventions explain 0.1 per cent of the variance in the behaviours studied, with negligible effects 20 months or more after even large interventions (Fernandes, Lynch and Netemeyer 2014). That it holds for workplace training is a prediction.","citations":["fernandes2014"],"cues":[]},{"id":"reviewers_over_rely","name":"Human reviewers can over-rely on, or selectively follow, advice","behaviour":"Reviewers can lean on the recommendation instead of checking it independently.","actor":"enforcers","signal":"Share of recommendations accepted unchanged, and the share of known errors caught.","source":"Review logs and error checks","unmeasured":"Reviews are completed on every case, so a rubber stamp looks like oversight.","mitigations":["Seed known errors to test the reviewers","Ask for the reviewer's own judgement before showing the advice"],"strength":"extrapolation","basis":"Three experiments in the Netherlands tested automation bias (over-reliance on algorithmic advice despite warning signals) and selective adherence (following advice when it matches stereotypes). The authors conclude that automating administrative decisions could harm vulnerable citizens (Alon-Barkat and Busuioc 2023). That it holds in other organisations is a prediction.","citations":["alonbarkat2023"],"cues":[]},{"id":"blame_shifted_to_owner","name":"Blame can land on the owner, not on the decision","behaviour":"Delegating a decision to one named person can move the blame onto that person and away from those behind the decision.","actor":"nearby","signal":"Share of problems where others point to the named owner, and time to the first action by anyone else.","source":"Incident reviews and workflow logs","unmeasured":"The owner is named, so the plan looks complete while the blame moves.","mitigations":["Name the decision-maker as well as the owner","Review what others did as well as the owner"],"strength":"extrapolation","basis":"In a laboratory experiment, responsibility attribution could be effectively shifted, and a simple responsibility measure predicted punishment better than inequity-aversion or reciprocity measures (Bartling and Fischbacher 2012). In laboratory experiments, third-party punishment fell when a passive intermediary was added (Coffman 2011). That blame lands on the named owner in organisations is a prediction.","citations":["bartling2012","coffman2011"],"cues":[]},{"id":"payment_reduces_supply","name":"Paying for a prosocial act can reduce supply among some groups","behaviour":"Adding a payment can lower the supply of a prosocial act for some people.","actor":"targeted","signal":"Rate of giving or volunteering, by group, before and after the payment.","source":"Records of giving by group","unmeasured":"Total supply looks stable, so a fall in one group is not seen.","mitigations":["Let people direct the payment to a cause they choose","Compare groups before and after the payment"],"strength":"extrapolation","basis":"In a field experiment on blood donation, women showed a significant crowding-out effect when a payment of 50 Swedish kronor was offered. Men showed no significant difference (Mellström and Johannesson 2008). Letting women direct the payment to charity offset the crowding-out. That it holds for workplace payments is a prediction.","citations":["mellstrom2008"],"cues":[]},{"id":"disclosure_biases_advice","name":"Disclosing a conflict can make advice more biased","behaviour":"Once an advisor has disclosed, they can feel licensed to push the advice further.","actor":"enforcers","signal":"Share of advisers who disclose, and how often their advice favours their own interest.","source":"Advice records and disclosure forms","unmeasured":"Disclosure is recorded, so the advice looks safe.","mitigations":["Remove the conflict instead of only disclosing it","Check advice from advisers who disclosed"],"strength":"extrapolation","basis":"A laboratory study reports that disclosure can increase bias in advice, because advisors may feel licensed by having disclosed. Advisees also discount biased advice less than they should (Cain, Loewenstein and Moore 2005). That it holds when organisations explain is a prediction.","citations":["cain2005"],"cues":[]},{"id":"report_cards_select_cases","name":"Published report cards can shift who gets treated and worsen outcomes","behaviour":"Providers can respond to a published score by choosing which cases to take on.","actor":"targeted","signal":"Share of difficult cases taken on by each provider, before and after publication.","source":"Case records by provider","unmeasured":"The published scores improve, so the cases that were turned away are not seen.","mitigations":["Adjust the published score for case difficulty","Track the cases that were referred elsewhere"],"strength":"extrapolation","basis":"Cardiac surgery report cards in New York and Pennsylvania led providers to select patients and better matched patients to hospitals. On net they raised resource use and worsened health outcomes, particularly for sicker patients (Dranove and colleagues 2003). It is one health-care setting. That it holds elsewhere is a prediction.","citations":["dranove2003"],"cues":[]},{"id":"monitoring_crowds_out_effort","name":"More monitoring can crowd out some workers' own effort","behaviour":"Beyond a point, monitoring can reduce the effort people give on their own.","actor":"targeted","signal":"Output per person at different levels of checking, and the share who do the minimum when unobserved.","source":"Output records by level of checking","unmeasured":"Checked output looks fine, so the effort given freely is not seen.","mitigations":["Keep checking at a level people see as fair","Compare output with and without extra checks"],"strength":"extrapolation","basis":"In a laboratory principal-agent experiment, most people in the employee role responded to monitoring's disciplining effect, but there was some evidence that intrinsic motivation was crowded out once monitoring exceeded a threshold (Dickinson and Villeval 2008). That it holds at work is a prediction.","citations":["dickinson2008"],"cues":[]},{"id":"explanations_may_not_stop_over_reliance","name":"Adding explanations may not stop people over-relying on advice","behaviour":"Reviewers shown the system's reasons can still accept its advice without checking it.","actor":"enforcers","signal":"Share of advice accepted without a check, with and without the explanation.","source":"Review logs","unmeasured":"Explanations are shown, so the process looks safer than it is.","mitigations":["Make reviewers decide before they see the advice","Slow the review down for high-stakes cases"],"strength":"extrapolation","basis":"In an experiment with 199 participants, adding explanations to the AI decisions was not found to reduce overreliance, while cognitive forcing designs significantly did (Buçinca, Malaya and Gajos 2021). The most effective designs received the least favourable ratings. That it holds in other organisations is a prediction.","citations":["bucinca2021"],"cues":[]},{"id":"short_term_incentive_weakens_motive","name":"A short-term incentive can still weaken the underlying motive","behaviour":"A reward can work now while weakening the reason people had before.","actor":"targeted","signal":"Rate of the behaviour in the weeks after the incentive ends, against before it started.","source":"Behaviour records over time","unmeasured":"The incentive period looks successful, so the later fall is not linked to it.","mitigations":["Follow the behaviour after the incentive ends","Explain the purpose alongside the reward"],"strength":"extrapolation","basis":"A review reports that monetary incentives can change how people perceive a task, with negative effects, and that some incentives work in the short term but still weaken intrinsic motivations. It covers education, public goods contributions and lifestyle change (Gneezy, Meier and Rey-Biel 2011). That it holds at work is a prediction.","citations":["gneezy2011"],"cues":[]},{"id":"removing_screen_lets_through","name":"Removing a screening step can let more irregular claims through","behaviour":"A step that looks like pure friction can be what keeps errors and fraud out.","actor":"nearby","signal":"Rate of irregular claims per thousand before and after the step is removed.","source":"Claims and audit records","unmeasured":"Processing gets faster and cheaper, so the rise in errors comes later and is not linked.","mitigations":["Keep the check for a sample of cases","Track irregular claims for a year after the change"],"strength":"extrapolation","basis":"Across nearly 11.5 million Paycheck Protection Program loans, screening reduced loan irregularities and cut fraud losses by at least 744 million dollars (Aman-Rana, Gingerich and Sukhtankar 2023). These were government loans in a working paper, not an internal process. That it holds in other organisations is a prediction.","citations":["amanrana2023"],"cues":[]},{"id":"measures_become_the_goal","name":"Managers can treat the measures as the goal itself","behaviour":"With a set of measures, people can chase the numbers rather than the strategy they stand for.","actor":"targeted","signal":"Share of decisions explained by a measure rather than by the strategy, in reviews.","source":"Review notes and decision records","unmeasured":"The measures are met, so the loss of the goal behind them is not seen.","mitigations":["Involve managers in choosing the measures","Ask in each review what the measure stands for"],"strength":"extrapolation","basis":"In an experiment, involvement in strategy selection reduced surrogation, in which managers treat performance measures as if they were the strategic goals. Strategy deliberation alone did not reduce it (Choi, Hecht and Tayler 2013). That it holds for a basket of measures at work is a prediction.","citations":["choi2013"],"cues":[]}],"interventions":[{"id":"mandate","name":"Make it mandatory","plain":"Require everyone to do it, by a deadline.","family":"control","runs_through":["reactance","social_proximity"],"counters":["present_bias","attention"],"side_effects":["minimum_compliance","goodwill_withdrawn","adjacent_voluntary_drop","breaches_spread"],"cues":[],"unless":[],"levers":[],"counter_why":{"present_bias":"A deadline that everyone must meet prevents the task from drifting indefinitely.","attention":"A requirement puts the task on everyone's list."},"example":"Every manager must finish the module by 31 March.","actions":{"start":{"label":"Make it required or stricter","example":"Require the module for every manager by 31 March."},"adjust":{"label":"Change the requirement","example":"Keep it required, and let managers pick the format."},"stop":{"label":"Loosen or drop the requirement","example":"Make the module optional for those who passed last year."}},"removes":false},{"id":"monitor","name":"Monitor the behaviour","plain":"Supervisors observe, log or audit the behaviour.","family":"control","runs_through":["reactance"],"counters":[],"side_effects":["goodwill_withdrawn","performing_for_tracker","monitoring_crowds_out_effort"],"cues":[],"unless":[],"levers":[],"counter_why":{},"example":"Supervisors spot-check ten expense claims a week.","actions":{"start":{"label":"Monitor more, or more closely","example":"Start spot-checking ten calls a week."},"adjust":{"label":"Change what or how you monitor","example":"Check calls at random instead of every Friday."},"stop":{"label":"Monitor less, or stop","example":"Check one call a month instead of five a week."}},"removes":false},{"id":"approval_step","name":"Add an approval step","plain":"Require one more sign-off before it can happen.","family":"control","runs_through":["diffusion","hassle"],"counters":[],"side_effects":["threshold_bunching","ownership_drops","decisions_slow"],"cues":[],"unless":["sign off alone","signs off alone","approve alone","approves alone","without a second signature","single signature"],"levers":[],"counter_why":{},"example":"Spend over £500 needs a second manager's sign-off.","actions":{"start":{"label":"Add a sign-off or tighten it","example":"Lower the sign-off limit from £1,000 to £500."},"adjust":{"label":"Change who signs or how","example":"Move the sign-off from the line manager to finance."},"stop":{"label":"Raise the sign-off limit","example":"Raise the sign-off limit from £500 to £1,000."}},"removes":false},{"id":"automate","name":"Automate a judgement","plain":"Let a model or system make or rank the decision.","family":"control","runs_through":["automation_bias"],"counters":["capacity"],"side_effects":["override_collapse","judgement_fades"],"cues":[],"unless":[],"levers":[],"counter_why":{"capacity":"The system takes on volume that is beyond people's capacity."},"example":"A model ranks incoming complaints by risk.","actions":{"start":{"label":"Automate more decisions","example":"Let the model rank every complaint, on every channel."},"adjust":{"label":"Change how the system works","example":"Retrain the model and show its score beside each case."},"stop":{"label":"Automate less, or switch it off","example":"Send complaints over £10,000 back to manual review."}},"removes":false},{"id":"numeric_target","name":"Set a numeric target","plain":"Set a number that people are expected to reach.","family":"control","runs_through":["metric_gaming"],"counters":["present_bias"],"side_effects":["period_end_bunching","cheapest_margin","unmeasured_quality_slips"],"cues":[],"unless":[],"levers":[],"counter_why":{"present_bias":"A dated number gives people something to be held to."},"example":"Each branch must reach 40 client reviews a quarter.","actions":{"start":{"label":"Add a target or raise it","example":"Raise the target from 40 to 50 reviews a quarter."},"adjust":{"label":"Change how the target works","example":"Set next quarter’s target from this quarter’s result."},"stop":{"label":"Lower the target or drop it","example":"Drop the 40-review target."}},"removes":false},{"id":"publish_rate","name":"Publish a compliance statistic","plain":"Tell people how many are, or are not, complying.","family":"control","runs_through":["descriptive_norm","metric_gaming"],"counters":["attention"],"side_effects":["drift_to_stated_rate","cheapest_margin","report_cards_select_cases","rank_feedback_backfires"],"cues":[],"unless":[],"levers":["mindspace:norms"],"counter_why":{"attention":"It makes the issue visible."},"example":"Post the share of teams that filed on time.","actions":{"start":{"label":"Publish it, or publish more often","example":"Post each team’s on-time rate every week."},"adjust":{"label":"Change what the figure shows","example":"Show the share who filed on time, not the share who did not."},"stop":{"label":"Publish less, or stop","example":"Stop the weekly email with the rate."}},"removes":false},{"id":"sanction","name":"Fine or sanction it","plain":"Attach a penalty to the behaviour.","family":"control","runs_through":["crowding_out","reactance"],"counters":["misaligned"],"side_effects":["fine_becomes_price","goes_underground"],"cues":[],"unless":[],"levers":["mindspace:incentives"],"counter_why":{"misaligned":"A cost can offset whatever rewards the behaviour."},"example":"A £20 charge for each late timesheet.","actions":{"start":{"label":"Add a penalty or raise it","example":"Charge £20 for each late timesheet."},"adjust":{"label":"Change how the penalty works","example":"Charge the £20 to the team budget, not to the person."},"stop":{"label":"Lower the penalty or drop it","example":"Drop the £20 charge for late timesheets."}},"removes":false},{"id":"incentive","name":"Pay a bonus or reward","plain":"Reward the behaviour with money or recognition.","family":"control","runs_through":["crowding_out","metric_gaming"],"counters":["misaligned","capacity"],"side_effects":["unrewarded_work_shrinks","cheapest_margin","unmeasured_quality_slips","adjacent_voluntary_drop"],"cues":[],"unless":[],"levers":["east:attractive","mindspace:incentives"],"counter_why":{"misaligned":"It can outweigh the competing reward.","capacity":"It can pay for the extra time the behaviour needs."},"example":"A £500 bonus for each year of mentoring.","actions":{"start":{"label":"Add a reward or increase it","example":"Pay a £500 bonus for each year of mentoring."},"adjust":{"label":"Change what the reward pays for","example":"Pay the bonus on client ratings, not on sales."},"stop":{"label":"Reduce the reward or drop it","example":"End the mentoring bonus next year."}},"removes":false},{"id":"ban_restrict","name":"Ban or restrict it","plain":"Forbid it, or cap how much is allowed.","family":"control","runs_through":["reactance","social_proximity"],"counters":[],"side_effects":["goodwill_withdrawn","behaviour_moves_elsewhere","goes_underground","breaches_spread"],"cues":[],"unless":[],"levers":[],"counter_why":{},"example":"No personal phones on the trading floor.","actions":{"start":{"label":"Ban it, or tighten the limit","example":"No p :"feedback","name":"Give timely feedback","plain":"Show people how they compare, soon after acting.","family":"enable","runs_through":[],"counters":["information","attention"],"side_effects":["above_average_do_less","feedback_lowers_performance","rank_feedback_backfires"],"cues":[],"unless":[],"levers":["mindspace:salience"],"counter_why":{"information":"People learn what good looks like.","attention":"It keeps the behaviour visible."},"example":"Show each surgeon their start times next to the theatre median.","actions":{"start":{"label":"Give feedback, or give it more often","example":"Show each surgeon their start times next to the theatre median."},"adjust":{"label":"Change what the feedback shows","example":"Add a word of praise for surgeons who beat the median."},"stop":{"label":"Give feedback less often, or stop","example":"Send the start-time report monthly, not weekly."}},"removes":false},{"id":"positive_norm","name":"Say what most people do right","plain":"Tell people what most colleagues already do.","family":"enable","runs_through":["descriptive_norm"],"counters":["descriptive_norm"],"side_effects":["above_average_do_less","peer_comparison_uneven","low_rate_message_lowers_rate"],"cues":[],"unless":[],"levers":["east:social","mindspace:norms"],"counter_why":{"descriptive_norm":"People then hear that the good behaviour is the common one."},"example":"Tell staff that 8 in 10 colleagues file on time.","actions":{"start":{"label":"Send it more widely","example":"Tell staff that 8 in 10 colleagues file on time."},"adjust":{"label":"Change the figure or wording","example":"Say 8 in 10 in your team, not in the firm."},"stop":{"label":"Send it less often, or stop","example":"Drop the line from the monthly email."}},"removes":false},{"id":"single_owner","name":"Name one owner","plain":"Name one person accountable for the decision.","family":"enable","runs_through":[],"counters":["diffusion"],"side_effects":["scapegoat","blame_shifted_to_owner"],"cues":[],"unless":[],"levers":[],"counter_why":{"diffusion":"Responsibility can no longer be diffused across several people."},"example":"Name one person who owns the theatre start time.","actions":{"start":{"label":"Name an owner, or widen their remit","example":"Name one person who owns the theatre start time."},"adjust":{"label":"Change who owns it","example":"Hand the start time from the clinical lead to the theatre manager."},"stop":{"label":"Share it again, or narrow the role","example":"Return the start time to the whole theatre team."}},"removes":false},{"id":"human_check","name":"Retain human review","plain":"Keep a person involved in each decision.","family":"enable","runs_through":[],"counters":["automation_bias"],"side_effects":["reasons_become_boilerplate","reviewers_over_rely","explanations_may_not_stop_over_reliance"],"cues":[],"unless":["explain~~director","explain~~boss","explain~~supervisor","explain~~head of","explain~~chief","explain~~committee","explain~~=board","explain~~senior","explain~~line manager","explain~~their manager","explain~~your manager","explain~~his manager","explain~~her manager","justify~~director","justify~~boss","justify~~supervisor","justify~~head of","justify~~chief","justify~~committee","justify~~=board","justify~~senior","justify~~line manager","justify~~their manager","justify~~your manager","justify~~his manager","justify~~her manager","report~~director","report~~boss","report~~supervisor","report~~head of","report~~chief","report~~committee","report~~=board","report~~senior","report~~line manager","report~~their manager","report~~your manager","report~~his manager","report~~her manager","account for~~director","account for~~boss","account for~~supervisor","account for~~head of","account for~~chief","account for~~committee","account for~~=board","account for~~senior","account for~~line manager","account for~~their manager","account for~~your manager","account for~~his manager","account for~~her manager","answer to~~director","answer to~~boss","answer to~~supervisor","answer to~~head of","answer to~~chief","answer to~~committee","answer to~~=board","answer to~~senior","answer to~~line manager","answer to~~their manager","answer to~~your manager","answer to~~his manager","answer to~~her manager"],"levers":[],"counter_why":{"automation_bias":"It forces an independent judgement before the model's answer is seen."},"example":"A reviewer checks a blind sample of the model's decisions.","actions":{"start":{"label":"Review more of the model’s decisions","example":"A reviewer checks a blind sample of the model’s decisions."},"adjust":{"label":"Change how the review works","example":"Ask for a reason on a random sample, not on every case."},"stop":{"label":"Review less, or stop","example":"Check 1 in 100 decisions instead of 1 in 10."}},"removes":false},{"id":"basket_of_measures","name":"Use a small set of measures","plain":"Judge the work on several measures, not one.","family":"enable","runs_through":[],"counters":["metric_gaming"],"side_effects":["attention_spread_thin","measures_become_the_goal"],"cues":[],"unless":[],"levers":[],"counter_why":{"metric_gaming":"Several measures are harder to game than one."},"example":"Track complaints next to the sales target.","actions":{"start":{"label":"Add measures next to the current one","example":"Track complaints next to the sales target."},"adjust":{"label":"Replace a measure with another","example":"Track repeat visits instead of complaints."},"stop":{"label":"Drop measures","example":"Go back to the sales target alone."}},"removes":false},{"id":"add_capacity","name":"Add time or resources","plain":"Give people the time, cover or budget needed.","family":"enable","runs_through":[],"counters":["capacity"],"side_effects":["time_absorbed","households_offset_resources","staff_ease_off_when_help_arrives"],"cues":[],"unless":[],"levers":[],"counter_why":{"capacity":"It removes the constraint instead of working around it."},"example":"Free two hours a week for the review.","actions":{"start":{"label":"Add time or resources","example":"Free two hours a week for the review."},"adjust":{"label":"Change how the time is used","example":"Book the two hours as a fixed Tuesday slot."},"stop":{"label":"Cut the time or resources","example":"Cut the review time from two hours to one."}},"removes":false},{"id":"train_clarify","name":"Train or clarify","plain":"Close the knowledge or skill gap.","family":"enable","runs_through":[],"counters":["information"],"side_effects":["training_becomes_box_ticking","training_effects_fade"],"cues":[],"unless":[],"levers":[],"counter_why":{"information":"People then know how to do what is asked."},"example":"A short session on what the control step protects.","actions":{"start":{"label":"Train more, or more people","example":"A short session on what the control step protects."},"adjust":{"label":"Change the format or content","example":"Swap the hour-long course for a ten-minute guide at the desk."},"stop":{"label":"Train less, or stop","example":"Drop the refresher for staff with five years’ service."}},"removes":false},{"id":"realign_incentive","name":"Remove the conflicting reward","plain":"Change the reward for the unwanted behaviour.","family":"enable","runs_through":[],"counters":["misaligned"],"side_effects":["effect_outlasts_removal","useful_effect_lost","short_term_incentive_weakens_motive"],"cues":[],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."},"example":"Stop paying the bonus on sales volume alone.","actions":{"start":{"label":"Remove the reward","example":"Stop paying the bonus on sales volume alone."},"adjust":{"label":"Move the reward to another target","example":"Pay the bonus on renewals instead of new sales."},"stop":{"label":"Bring the reward back","example":"Restore the bonus on sales volume."}},"removes":true}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours resistance. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is resistance. If effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap. If minimum effort persists, it is resistance."},{"a":"reactance","b":"hassle","observation":"You can remove one step for a random sample. If more of them complete it, or complete it properly, it was friction. If they still do the minimum, it is resistance."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity. If the easy parts still carry the number, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"You can look at the pattern inside the period. Gaming concentrates on the cheapest component. Procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target. If it is where another reward conflicts, it is a conflicting incentive."},{"a":"diffusion","b":"hassle","observation":"You can remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion. If only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. If checks remain shallow despite the extra time, this points to diffusion of responsibility. Deeper checks point to time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. If overrides remain rare despite the extra time, this points to deference to the model. More overrides would point to time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones track the model, including where it was wrong, they were deferring. If blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams that see breaches in units they feel no closeness to with teams that see only their own record. If compliance slides only where distant breaches are visible, weak ties are the problem. If both slide to the same minimum, it is resistance to the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance. If everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction. If compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds no message, the message with the statistic, or the same message without it. If the version without the statistic wins, the statistic was the problem. If both beat no message equally, attention did the work and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"You can check whose performance fell. If it is the people who used to do it without being paid or charged, payment is displacing existing motives. If it is where a competing reward is strongest, it is a conflicting incentive."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction. If starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity. If instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"You can observe three people attempting the task. If they know what to do but give up on the process, it is friction. If they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention. If most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default. If only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the intended time.","preset":{"change_iv":"mandate","change_mode":"adjust","change":"Keep the training required, and let managers choose its format and timing.","justify":"Choosing the format and timing gives managers back some control, which can ease their resistance to being told what to do","reason1":"Managers are too busy in the window to give the training proper time.","reason2":"Managers resent being required to take it and do the minimum.","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or resistance to the requirement? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","dobbin2020"]},{"id":"c1","kind":"preset","title":"The annual conduct module","short":"Conduct module","teaser":"After a regulatory finding, a 5,000‑person firm made its annual conduct module mandatory. Completion is now 100 per cent. The median time is 9 minutes.","theme":"Annual training in a regulated firm","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The client-review target","short":"Client-review target","teaser":"Each regional team’s bonus depends on 40 client reviews a qu     restoreFocus("fx:" + UI.focus);
  },
  focus: function (id) { if (R.cards().indexOf(id) < 0) return; clearTimeout(advT); UI.focus = id; render(); restoreFocus("fx:" + id); showCard(id); },
  link: function (arg) {
    var k = arg.lastIndexOf(":"), id = arg.slice(0, k), v = arg.slice(k + 1);
    if (!R.open() || R.cards().indexOf(id) < 0) return;
    if (v !== "none" && !(["1", "2", "3", "4"].indexOf(v) >= 0 && val(S.lines[Number(v) - 1]))) return;
    if (S.link[id] === v) delete S.link[id]; else S.link[id] = v;
    UI.msg = ""; R.saveSoon(); render(); var t = R.tally(); R.announce(t.marked ? "We named " + t.named + " of " + t.n + "." : "Answer removed.");
    clearTimeout(advT);
    if (S.link[id]) { var nx = R.cards().filter(function (c) { return !S.link[c]; })[0]; if (nx) advT = setTimeout(function () { if (S.screen !== "disclose" || UI.focus !== id) return; UI.focus = nx; render(); restoreFocus("fx:" + nx); showCard(nx); }, 1100); }
  },
  track: function (id) {
    var wn = R.WAYID.hasOwnProperty(id) ? R.WAYID[id] : 0;
    if (!R.open() || (R.cards().indexOf(id) < 0 && !(wn && val(S.lines[wn - 1])))) return;
    R.setWatch(id); UI.msg = ""; R.saveSoon(); render(); R.announce("We track: " + R.watchName());
  },
  decide: function (d) { if (!DEC[d]) return; S.decision = d; UI.msg = ""; R.saveSoon(); render(); var c = $("#why"); if (c) c.focus({preventScroll: true}); },
  show: function () { if (!S.sealed_at) return say("Seal our prediction first."); enterFs(); present(1); },
  beat: function (n) { present(Math.max(1, Math.min(3, UI.present + Number(n)))); },
  close: function () { leaveFs(); present(0); },
  copy: copyText,
  pdf: function () {
    try { download(slug() + ".pdf", new Blob([window.RADAR_PDF.build(pdfModel())], {type: "application/pdf"})); say(window.RADAR_PDF.lossy ? "PDF saved. Some characters could not be shown in it." : "PDF saved."); }
    catch (e) { say("The PDF could not be made. Use Copy text."); }
  }
};

/* ---------------- listeners ---------------- */
function startClock() { if (S.started && S.screen !== "start" && !S.t0) { S.t0 = Date.now(); R.saveSoon(); } }
document.addEventListener("click", function (e) {
  startClock();
  var t = e.target.closest ? e.target.closest("[data-a]") : null;
  if (t) { var f = A[t.getAttribute("data-a")]; if (f) f(t.getAttribute("data-arg"), t, e); return; }
  /* a click on one of our ways answers the open effect, the same as its Way button */
  var w = e.target.closest ? e.target.closest(".linking .way") : null;
  if (w && UI.focus) A.link(UI.focus + ":" + w.getAttribute("data-way"));
});
document.addEventListener("input", function (e) {
  var t = e.target, f = t.getAttribute && t.getAttribute("data-f"); if (!f) return;
  startClock(); grow(t);
  var max = +t.getAttribute("maxlength") || 240, cn = document.getElementById("cnt-" + t.id); if (cn) cn.textContent = cnt(t.value.length, max);
  if (S.sealed_at && (f === "plan" || f === "whom" || f === "line" || f === "num")) return;
  if (f === "line") S.lines[+t.getAttribute("data-i")] = R.oneLine(t.value, R.MAXLEN.line);
  else if (f === "num") S.nums[+t.getAttribute("data-i")] = R.oneLine(t.value, R.MAXLEN.num);
  else if (f === "plan") S.plan = R.cleanText(t.value, R.MAXLEN.plan);
  else if (f === "ans") { var cid = t.getAttribute("data-i"); if (!R.open() || R.cards().indexOf(cid) < 0) return; var av = R.oneLine(t.value, R.MAXLEN.ans); if (av) S.ans[cid] = av; else delete S.ans[cid]; }
  else if (f === "why") { if (!S.decision) return; S.why[S.decision] = R.oneLine(t.value, R.MAXLEN.why); }
  else if (["whom", "figure", "level", "by", "owner"].indexOf(f) >= 0) S[f] = R.oneLine(t.value, R.MAXLEN[f]);
  else return;
  if (f === "figure") { var kp = $("#kept"); if (kp && val(S.figure)) kp.remove(); }
  UI.msg = ""; R.saveSoon();
  if (f === "plan" || f === "whom") read1(); else if (f === "line" || f === "num") read2(); else if (f !== "ans") read4();
  refresh();
});
/* a newline never enters a one-line field: Enter moves on */
document.addEventListener("keydown", function (e) {
  startClock();
  var t = e.target;
  if (UI.present) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); A.beat(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); A.beat(-1); }
    else if (e.key === "Escape") { e.preventDefault(); A.close(); }
    return;
  }
  if (t.id === "gsvg" && gmode().key) {
    var c = S[gmode().key]; if (c === null) c = S.conf0 === null || !S.sealed_at ? 50 : S.conf0;
    var v = e.key === "ArrowRight" || e.key === "ArrowUp" ? c + 5 : e.key === "ArrowLeft" || e.key === "ArrowDown" ? c - 5 : e.key === "PageUp" ? c + 10 : e.key === "PageDown" ? c - 10 : e.key === "Home" ? 0 : e.key === "End" ? 100 : null;
    if (v !== null) { e.preventDefault(); setConf(v); }
    return;
  }
  if (e.key === "Enter" && t.tagName === "TEXTAREA" && t.id !== "plan") e.preventDefault();
  if (t.matches && t.matches(".kind") && /^Arrow|^Home$|^End$/.test(e.key)) {
    var g = $$(".kind"), i = g.indexOf(t), n = g.length, cols = Math.max(1, Math.round($(".kinds").clientWidth / t.offsetWidth));
    var j = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : e.key === "ArrowDown" ? i + cols : e.key === "ArrowUp" ? i - cols : e.key === "Home" ? 0 : n - 1;
    if (j >= 0 && j < n) { e.preventDefault(); g[j].focus(); }
  }
});
var dragging = false;
document.addEventListener("pointerdown", function (e) { var sv = e.target.closest ? e.target.closest("#gsvg") : null; if (!sv || !gmode().key || UI.present) return; dragging = true; e.preventDefault(); sv.focus({preventScroll: true}); gaugeAt(e); });
document.addEventListener("pointermove", function (e) { if (dragging) gaugeAt(e); });
document.addEventListener("pointerup", function () { dragging = false; });
document.addEventListener("pointercancel", function () { dragging = false; });
document.addEventListener("scroll", function (e) { if (e.target.classList && e.target.classList.contains("body")) wires(); }, true);
document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement && UI.present && UI.fsOn) { UI.fsOn = false; present(0); } else if (document.fullscreenElement) UI.fsOn = true; clearTimeout(settleT); settleT = setTimeout(settle, 120); });
var rsT = null;
window.addEventListener("resize", function () { wires(); clearTimeout(rsT); rsT = setTimeout(settle, 90); });
R.onSave(function () { var w = $("#who"); if (w && S.screen !== "start") w.innerHTML = whoHTML(); });
window.addEventListener("pagehide", function () { R.flushSave(); });
window.addEventListener("beforeunload", function () { R.flushSave(); });

window.RADAR3.UIK = {disp: disp, WORKED: WORKED, NEXT: NEXT, CLOSEST: CLOSEST, hint: hint};
window.RADAR3.render = render; window.RADAR3.recordText = recordText; window.RADAR3.pdfModel = pdfModel; window.RADAR3.rows = function () { return R.ledgerGroups(null, false); };
window.RADAR3.present = present; window.RADAR3.setConf = setConf; window.RADAR3.go = go;
