*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--hdr,150px) + 16px);scroll-padding-bottom:calc(var(--ftr,70px) + 16px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:var(--t3)/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:var(--teal);line-height:1.15}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a.skip-link:focus{position:fixed;top:8px;left:8px;z-index:1000;width:auto;height:auto;padding:12px 18px;clip:auto;overflow:visible;background:var(--ink);color:#fff}
.none{color:var(--muted);font-style:italic}
.printonly{display:none}
main{flex:1 0 auto;width:100%;max-width:1240px;margin:0 auto;padding:32px 24px 40px}
main:focus{outline:none}
.tn,.al,.dn,.ext,h1,h2,h3,.gt,.lede{text-wrap:balance}
p,li,dd,.tp,.ae,.exp,.evg{text-wrap:pretty}
h1{font-size:var(--t6);letter-spacing:-.01em;margin-bottom:8px;outline:none}
h2{font-size:var(--t4)}
h3{font-size:var(--t3)}
.sub{font-size:var(--t3);color:var(--muted);margin-bottom:24px}

/* header, tabs, pinned plan */
.hd{position:sticky;top:var(--hdtop,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow,.tabs,.plan{padding-inline:max(24px,calc((100% - 1192px)/2))}
.hrow{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;gap:3px}.mark i{display:block;width:5px;height:26px;background:var(--amber)}
.bn{font-family:var(--serif);font-weight:600;font-size:var(--t5);letter-spacing:.02em;color:var(--teal)}
.bs{font-size:var(--t1);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;padding-top:6px}
.sp{flex:1}
.credit{font-size:var(--t1);color:var(--muted)}
.clock{font-size:var(--t2);color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-bottom:0}
.tab{display:flex;align-items:baseline;gap:10px;padding:8px 14px 9px;border-bottom:4px solid var(--line);color:var(--muted);min-height:52px;position:relative;border-radius:6px 6px 0 0}
.tab:hover{background:var(--panel2)}
.tab .tl{font-family:var(--serif);font-size:var(--t5);font-weight:600;color:var(--amber);line-height:1}
.tab .tn{font-size:var(--t3);font-weight:700;color:var(--ink)}
.tab[aria-current=step]{background:var(--teal);border-bottom-color:var(--gold)}
.tab[aria-current=step] .tl{color:var(--gold)}.tab[aria-current=step] .tn{color:#fff}
.tab.done{border-bottom-color:var(--green)}
.tab.done .tn::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:8px;vertical-align:middle}
.plan{display:flex;gap:12px;align-items:baseline;white-space:nowrap;overflow:hidden;background:var(--panel2);border-top:1px solid var(--line);padding-block:8px;font-size:var(--t2);cursor:default}
.plan .pk{font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;flex:none}
.plan .pt{overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:var(--serif);font-size:var(--t3)}
.plan:focus,.plan:focus-visible{white-space:normal;overflow:visible;outline:3px solid var(--amber);outline-offset:-3px;border-radius:0}
.plan:focus .pt{overflow:visible}

/* footer */
.foot{position:sticky;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(var(--ink-rgb),.07);padding:10px max(24px,calc((100% - 1192px)/2)) 8px}
.foot[hidden]{display:none}
.frow{display:flex;align-items:center;gap:12px}
.hint{font-size:var(--t2);color:var(--muted);margin-top:6px;min-height:22px}

/* buttons and links */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 22px;border-radius:6px;font-weight:700;font-size:var(--t3);border:2px solid transparent;text-align:center;line-height:1.2}
.btn.pri{background:var(--amber);color:#fff}.btn.pri:hover{background:var(--amber2)}
.btn.gold{background:var(--gold);color:var(--teal2)}.btn.gold:hover{background:#F2C25C}
.btn.ghost{background:var(--panel);border-color:var(--line2);color:var(--ink)}.btn.ghost:hover{border-color:var(--amber);color:var(--amber2)}
.btn.ghost.light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.big{min-height:56px;padding:12px 32px;font-size:var(--t4);font-family:var(--serif)}
.btn.sm{min-height:40px;padding:6px 16px;font-size:var(--t2)}
.lnk{color:var(--amber);text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:40px;padding:8px 0;font-size:var(--t3)}
.lnk:hover{color:var(--amber2)}
.lnk.lt{color:var(--gold)}.lnk.lt:hover{color:#fff}

/* fields */
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:700;font-size:var(--t2);margin-bottom:6px;color:var(--ink)}
input[type=text],input[type=search],input[type=date],textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:9px 12px;min-height:44px;font-size:var(--t3);line-height:1.4}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#5F6E72;opacity:1}
input:focus,textarea:focus,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
.fld.locked input,.fld.locked textarea{background:#F1EEE5;border-style:dashed;color:var(--ink)}
.cardp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 1px 2px rgba(var(--ink-rgb),.05)}
.cardp h2{margin-bottom:12px}
.msg{color:var(--red);font-weight:600;min-height:24px;margin-top:8px}
.gs{color:var(--muted);margin-bottom:12px}
.gt{font-family:var(--serif);font-size:var(--t5);color:var(--teal);margin-bottom:6px;font-weight:600}

/* start */
body.is-start .hd{background:var(--teal);border-bottom:0}
body.is-start .bn{color:#fff}body.is-start .credit{color:#B9CCC8}
body.is-start .mark i{background:var(--gold)}body.is-start .bs{color:var(--gold)}
body.is-start main{max-width:none;padding:0}
.hero{background:var(--teal);color:#fff;padding:24px 0 96px}
.hero-in{max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
.kick{font-size:var(--t1);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:16px}
.hero h1{color:#fff;font-size:var(--t6);line-height:1.08;margin-bottom:20px}
.lede{font-size:var(--t4);line-height:1.4;color:#E4EEEB;max-width:36ch;font-family:var(--serif)}
.hero-act{display:flex;align-items:center;gap:28px;margin:32px 0 20px;flex-wrap:wrap}
.hero .btn.gold{min-height:56px;padding:12px 40px;font-size:var(--t4);font-family:var(--serif)}
.fine{font-size:var(--t2);color:#B9CCC8}
.hero-art{display:flex;justify-content:center}
.hero-env{width:min(440px,100%);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.five{max-width:1240px;margin:-52px auto 48px;padding:0 24px;width:100%}
.five ol{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(var(--ink-rgb),.12)}
.five li{padding:20px 20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.five li:last-child{border-right:0}
.fl{font-family:var(--serif);font-size:var(--t6);line-height:1;font-weight:600;color:var(--amber)}
.fn{font-weight:700;font-size:var(--t3);margin-top:6px}.fd{font-size:var(--t2);color:var(--muted)}
.confirm{margin:0 0 16px;padding:16px 20px;background:#fff;color:var(--ink);border:2px solid var(--amber);border-radius:8px;max-width:560px}
.confirm p{margin-bottom:12px;font-weight:600}.crow{display:flex;gap:12px;flex-wrap:wrap}
.tools+.confirm{margin-top:16px}

/* R: Rule */
.rgrid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"rf rt" "ra rt";gap:24px 32px;align-items:start;margin-top:16px}
.rf{grid-area:rf;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 20px 12px}
.rt{grid-area:rt;min-width:0}
.ra{grid-area:ra;position:sticky;top:calc(var(--hdr,150px) + 16px)}
.rt h2{margin-bottom:12px}
.fil{margin-bottom:8px}
.fam{font-size:var(--t1);font-family:var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:20px 0 10px;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tb{display:flex;flex-direction:column;gap:3px;padding:12px 14px 12px 16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:6px;min-height:92px;position:relative}
.tb:hover{border-color:var(--amber);border-left-color:var(--amber)}
.tb .tn{font-weight:700;font-size:var(--t3);line-height:1.25;padding-right:20px}
.tb .tp{font-size:var(--t2);color:var(--muted);line-height:1.4}
.tb.on{background:var(--teal);border-color:var(--teal);border-left-color:var(--gold)}
.tb.on .tn{color:#fff}.tb.on .tp{color:#D3E1DE}
.tb.on::after{content:"";position:absolute;top:12px;right:12px;width:16px;height:9px;border-left:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(-45deg)}
.empty{color:var(--muted);padding:24px 0}
.acts{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;border-top:4px solid var(--amber)}
.acts h2{font-size:var(--t4);margin-bottom:2px}
.chosen{font-size:var(--t2);color:var(--muted);margin-bottom:10px}
.agrid{display:flex;flex-direction:column;gap:8px}
.ab{display:flex;flex-direction:column;padding:9px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;min-height:44px;position:relative}
.ab:hover{border-color:var(--amber)}
.av{font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--amber)}
.al{font-weight:700;font-size:var(--t3);line-height:1.25}
.ae{font-size:var(--t1);color:var(--muted);line-height:1.35;margin-top:2px}
.ab.on{background:var(--teal);border-color:var(--teal)}
.ab.on .av{color:var(--gold)}.ab.on .al{color:#fff}.ab.on .ae{color:#C9DAD6}
.exs{margin:16px 0 8px;padding:20px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ex{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ex:hover{border-color:var(--amber)}
.exk{font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.ext{font-family:var(--serif);font-weight:600;font-size:var(--t4);color:var(--teal);line-height:1.15}
.exp{font-size:var(--t2);color:var(--ink)}.exm{font-size:var(--t1);color:var(--muted);margin-top:4px}

/* A: Anticipate */
.agrid2{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);grid-template-areas:"s l" "k l";gap:24px;align-items:start}
.ca-slider{grid-area:s}.ca-lines{grid-area:l}.ca-seal{grid-area:k;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clab{font-family:var(--serif);font-weight:600;font-size:var(--t4);line-height:1.2;color:var(--teal);display:block;margin-bottom:12px}
.cread{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.cnum{font-family:var(--serif);font-weight:600;font-size:var(--t6);line-height:1;color:var(--amber);min-width:2ch}
.cnum.unset{font-size:var(--t5);color:var(--muted);font-style:italic}
.cof{font-size:var(--t2);color:var(--muted)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;--p:50%;cursor:pointer;margin:2px 0}
.rng::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(to right,var(--amber) var(--p),var(--raise) var(--p))}
.rng::-moz-range-track{height:12px;border-radius:6px;background:var(--raise)}
.rng::-moz-range-progress{height:12px;border-radius:6px;background:var(--amber)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--amber);border:4px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);margin-top:-9px}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--amber);border:4px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.rng:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
.scale{display:flex;justify-content:space-between;font-size:var(--t1);color:var(--muted);gap:12px}
.conf.locked .cbar{height:12px;background:var(--raise);border-radius:6px;overflow:hidden}.conf.locked .cbar i{display:block;height:100%;background:var(--teal)}
.clock-note{font-size:var(--t2);color:var(--muted);margin-top:8px}
.plines{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-bottom:8px}
.pl{display:flex;gap:10px;align-items:flex-end}.pl .fld{flex:1;min-width:0}
.pn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:var(--t2);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.ca-lines h2{font-size:var(--t4);margin-bottom:16px}
.sealnote{font-size:var(--t2);color:var(--muted)}
.stamp{display:flex;align-items:center;gap:14px;border:3px double var(--amber);border-radius:10px;padding:10px 20px 10px 14px;color:var(--amber);transform:rotate(-3deg);background:var(--amberT)}
.stt{display:flex;flex-direction:column}.stt b{font-family:var(--serif);font-size:var(--t5);letter-spacing:.14em;text-transform:uppercase;line-height:1}
.stt span{font-size:var(--t4);font-weight:700;font-variant-numeric:tabular-nums}
.stamp.pop{animation:stampin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampin{from{transform:scale(2.4) rotate(-16deg);opacity:0}60%{opacity:1}to{transform:scale(1) rotate(-3deg);opacity:1}}

/* D: Disclose */
.gate,.opener{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:640px;margin-top:16px}
.gate-env,.open-env{width:220px;height:auto;margin-bottom:8px}
.showing{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;font-size:var(--t3);margin:4px 0 20px}
.showing b{font-weight:700}
.dtop{display:flex;align-items:center;gap:28px;margin-bottom:24px;flex-wrap:wrap}
.mini-env{width:150px;height:auto;flex:none}
.mini-env.play .flap{animation:flapopen .5s ease-out both}
.mini-env.play .wxi{animation:waxout .4s ease-out both}
.mini-env .flap{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(-1)}
.mini-env .wx{opacity:0}
@keyframes flapopen{from{transform:scaleY(1)}to{transform:scaleY(-1)}}
@keyframes waxout{from{opacity:1}to{opacity:0}}
.tally{display:flex;gap:16px;flex-wrap:wrap}
.tn1{display:flex;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 18px}
.tn1 b{font-family:var(--serif);font-size:var(--t6);line-height:1.1;color:var(--teal);font-weight:600}
.tn1 span{font-size:var(--t2);color:var(--muted);font-weight:700}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.drail{position:sticky;top:calc(var(--hdr,150px) + 16px)}
.sealedcard{background:var(--amberT);border:1px solid #E5C9BC;border-radius:10px;padding:18px 18px 14px}
.sealedcard .sk{display:flex;align-items:center;gap:8px;font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;color:var(--amber2);font-weight:700;margin-bottom:8px}
.sealedcard h2{font-size:var(--t4);margin-bottom:8px}
.sealedcard ol{padding-left:22px;margin-bottom:10px;font-size:var(--t2)}.sealedcard li{margin-bottom:6px}
.worr{font-size:var(--t2);margin-bottom:8px}.worr b{display:block;font-size:var(--t1);letter-spacing:.08em;text-transform:uppercase;color:var(--amber2)}
.before{font-size:var(--t2);border-top:1px solid #E5C9BC;padding-top:8px}
.se{background:#fff;border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:8px;padding:20px 24px 18px;margin-bottom:16px}
.se.fade{opacity:0;animation:fadein .24s ease-out forwards;animation-delay:calc(var(--i) * .12s)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.se h3{font-size:var(--t4);margin-bottom:6px;outline:none}
.evl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ev{display:inline-block;font-size:var(--t1);font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--teal);color:#fff}
.ev.mixed{background:#F3DFA9;color:#4A3500}.ev.extrapolation{background:#fff;color:var(--ink);border:1px dashed var(--muted)}.ev.structural{background:var(--raise);color:var(--ink)}
.evg{font-size:var(--t2);color:var(--muted)}
.beh{font-weight:700;margin-bottom:10px}
.basis,.cites{margin-bottom:10px}
.se h4{font-family:var(--f);font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:2px}
.basis p{font-size:var(--t2);line-height:1.55}
.cites ul{list-style:none;font-size:var(--t1);color:var(--muted);line-height:1.45}.cites li{margin-bottom:3px}
.doi{white-space:nowrap}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px}
.sg dt{font-size:var(--t1);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sg dd{font-size:var(--t2)}
.marks{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.mk{min-height:44px;padding:8px 20px;border:2px solid var(--line2);border-radius:6px;font-weight:700;background:#fff;font-size:var(--t2)}
.mk:hover{border-color:var(--amber)}
.mk[data-arg$=":named"].on{background:var(--green);border-color:var(--green);color:#fff}
.mk[data-arg$=":not"].on{background:var(--muted);border-color:var(--muted);color:#fff}
.others{margin:8px 0 20px}.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.oth h3{font-family:var(--f);font-size:var(--t2);font-weight:700;color:var(--ink);margin-bottom:6px}
.oth ul{list-style:none;font-size:var(--t2);color:var(--muted)}.oth li{padding:3px 0 3px 14px;position:relative}.oth li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--line2)}
.watch{margin-bottom:20px}.watch legend{font-family:var(--serif);font-size:var(--t4);font-weight:600;color:var(--teal);padding:0 6px;float:left;width:100%;margin-bottom:12px}
.chips{display:flex;gap:10px;flex-wrap:wrap;clear:both}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:2px solid var(--line2);border-radius:999px;font-weight:700;font-size:var(--t2);background:#fff}
.chip input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.nowc .clab{margin-bottom:6px}
.ba{margin-top:14px}
.batxt{font-size:var(--t3);font-weight:700;margin-bottom:6px}
.batrack{position:relative;height:12px;background:var(--raise);border-radius:6px;margin:34px 10px 38px}
.baseg{position:absolute;top:0;height:12px;background:rgba(var(--amber-rgb),.35)}
.bam{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%)}

future: temporal perspective in the explanation of events’, Journal of Behavioral Decision Making, 2(1), 25-38.","doi":"10.1002/bdm.3960020103","lab":true},{"id":"klein2007","short":"Klein (2007)","text":"Klein, G. (2007) ‘Performing a project premortem’, Harvard Business Review, 85(9), 18-19."},{"id":"allcott_rogers2014","short":"Allcott and Rogers (2014)","text":"Allcott, H. and Rogers, T. (2014) ‘The short-run and long-run effects of behavioral interventions: experimental evidence from energy conservation’, American Economic Review, 104(10), 3003-3037.","doi":"10.1257/aer.104.10.3003"},{"id":"nagin2002","short":"Nagin, Rebitzer, Sanders and Taylor (2002)","text":"Nagin, D.S., Rebitzer, J.B., Sanders, S. and Taylor, L.J. (2002) ‘Monitoring, motivation, and management: the determinants of opportunistic behavior in a field experiment’, American Economic Review, 92(4), 850-873.","doi":"10.1257/00028280260344498"},{"id":"obermeyer2019","short":"Obermeyer and colleagues (2019)","text":"Obermeyer, Z., Powers, B., Vogeli, C. and Mullainathan, S. (2019) ‘Dissecting racial bias in an algorithm used to manage the health of populations’, Science, 366(6464), 447-453.","doi":"10.1126/science.aax2342"}],"steps":[{"id":"recognise","outline":"Assessment Phase 1: define the target behaviour","outline_full":"Assessment Phase 1: Define the target behaviour","plain":"What people do now, in numbers","letter":"R","name":"Recognise","question":"What do people currently do?","why":"You can only judge an intervention against something you can count.","done":"You have the behaviour and the current intervention.","help":"Say it in figures someone could count.","minutes":5,"live":false,"sceptic":"Could you measure this next week?","research":{"headline":"An easier measure hid who needed help","finding":"A widely used US health algorithm took health costs as a proxy for need, and remedying the resulting disparity would raise the share of Black patients receiving extra help from 17.7 to 46.5 per cent.","manager":"count the behaviour itself, not an easier stand-in.","plate":{"title":"Share of Black patients receiving extra help","unit":"%","highlight":1,"source":"obermeyer2019","bars":[["Current algorithm",17.7],["Spending gap removed (simulated)",46.5]]},"scope":"The study examined one widely used commercial algorithm in US health care. The size of the bias depends on the spending gap in each health system."},"citations":["obermeyer2019"]},{"id":"analyse","outline":"Assessment Phase 2: diagnose barriers and enablers","outline_full":"Assessment Phase 2: Diagnose barriers and enablers to the target behaviours","plain":"Two explanations, and the likelier one","letter":"A","name":"Analyse","question":"Why might people behave this way?","why":"Different causes need different interventions.","done":"You have two explanations, a cause for each and the likelier one.","help":"Two explanations. Click a cause for each, then the likelier one.","minutes":5,"live":true,"sceptic":"What would you see if the first cause were wrong?","research":{"after_pm":true,"headline":"One message moved light users the wrong way","finding":"Households already below the neighbourhood average raised their daily use from 10.15 to 11.13 kWh once told the average. Similar households who also received an approving smiley stayed at baseline.","manager":"check which cause fits which people before you choose. One message can help one group and harm another.","plate":{"title":"Daily electricity use of below-average homes, kWh","unit":"","highlight":1,"source":"schultz2007","bars":[["Average only, before",10.15],["Average only, weeks later",11.13],["Average and smiley, before",10.04],["Average and smiley, weeks later",10.14]]},"scope":"Doorhanger messages to 290 households in San Marcos, California. The last meter reading came about four weeks after the first message. The figures are for the below-average homes (68 and 70 households)."},"citations":["schultz2007"]},{"id":"design","outline":"Assessment Phase 3: design the strategy and pretest","outline_full":"Assessment Phase 3: Design the strategy to influence behaviour and pretest interventions","plain":"One intervention for the likelier cause","letter":"D","name":"Design","question":"Which intervention addresses the more likely cause?","why":"An intervention works only if it tackles the real cause.","done":"You have one intervention for the likelier cause.","help":"Pick one intervention for the likelier cause.","minutes":6,"live":false,"sceptic":"Which cause does this leave untouched?","research":{"after_pm":true,"headline":"A fine for lateness made lateness more common","finding":"At one of six day-care centres that fined late pick-ups, late-coming parents rose from 7.25 to 12.5 a week, and to 15.25 after the fine was withdrawn.","manager":"ask whether a control turns a duty into a price or signals distrust, and test an enabling option first.","plate":{"title":"Late-coming parents per week at one fined centre","unit":"","highlight":2,"source":"gneezy_rustichini2000","bars":[["Before the fine, weeks 1 to 4",7.25],["With the fine, weeks 5 to 16",12.5],["After it ended, weeks 17 to 20",15.25]]},"scope":"Ten day-care centres were observed for 20 weeks. Six introduced a fine of NIS 10 for delays of ten minutes or more, and the four control centres showed no noticeable change. Falk and Kosfeld report the distrust reading of control from a laboratory game."},"citations":["gneezy_rustichini2000","falk_kosfeld2006"]},{"id":"act","outline":"Assessment Phase 4: implement the intervention","outline_full":"Assessment Phase 4: Implement the intervention (hypothetical)","plain":"Who starts, and by when","letter":"A","name":"Act","question":"Who takes the first step, and by when?","why":"Nothing happens until someone owns the first step.","done":"You have a first step, an owner and a deadline.","help":"Name the first step, who takes it and by when.","minutes":2,"live":false,"sceptic":"Would the owner agree to this next week?","research":{"headline":"Plans that fix when and where are carried out more often","finding":"Gollwitzer reviews experiments in which if-then plans, stating when, where and how a person will act, helped people act on intentions they already held.","manager":"leave with one name, one first step and one date.","plate":null,"scope":"Experiments on individuals pursuing their own goals, reviewed by the psychologist who proposed the concept."},"citations":["gollwitzer1999"]},{"id":"routinise","outline":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","outline_full":"Assessment Phases 4 and 5: unintended consequences, reactance and side effects","plain":"How it could backfire, and what to watch","letter":"R","name":"Routinise","question":"Why did the intervention backfire?","why":"Side effects are cheapest to fix before launch.","done":"You have the side effect to watch, how you would check it and your decision on the design.","help":"Say how it failed, then what to watch.","minutes":12,"live":true,"sceptic":"Who would rather this side effect never showed up in a report?","research":{"headline":"Treating a failure as certain brings fuller explanations","finding":"People who treated an outcome as certain, as if it had already happened, generated more reasons and a larger share of concrete, episodic reasons than people told the outcome was uncertain. Mitchell, Russo and Pennington called this prospective hindsight, and Klein built it into the pre-mortem.","manager":"give each likely side effect an indicator you can count.","plate":null,"scope":"Laboratory studies of how people explain events. Klein describes the pre-mortem as a working method for project teams."},"citations":["mitchell1989","klein2007"]}],"frameworks":[{"id":"basic","name":"BASIC","kind":"scheme","owner":"OECD","expansion":"Behaviour, Analysis, Strategies, Intervention, Change","stages":["Behaviour","Analysis","Strategies","Intervention","Change"],"plain":"A five-stage process from defining a target behaviour to scaling an intervention.","side_effects":"It names ‘potential side effects’ as one of the nine parts of every behavioural insight, asks at the Behaviour stage about ‘any potential risks or unintended consequences’, and says to monitor potential side effects ‘throughout all relevant stages’.","gap":"BASIC asks you to consider side effects and plan measures to monitor them. RADAR adds a list linking each type of intervention to its known side effects and an indicator for each.","radar_map":{"recognise":"Behaviour","analyse":"Analysis","design":"Strategies","act":"Intervention","routinise":"Change"},"assessment":"Named in the course outline as an example design scheme.","citation":"oecd_basic2019"},{"id":"tests","name":"TESTS","kind":"scheme","owner":"Behavioural Insights Team","expansion":"Target, Explore, Solution, Trial, Scale","stages":["Target","Explore","Solution","Trial","Scale"],"plain":"BIT's five-phase method for running a behavioural project, moving back and forth between phases as you learn.","side_effects":"Asks at the Solution phase, when you prioritise interventions: 'Are there any potential safety considerations, possible negative side-effects or any other ethical concerns?', and whether the initiative could harm equity. Its worked example gives one specific side effect.","gap":"It offers a question and a worked example. RADAR adds a route from each type of intervention to its likely side effects and an indicator for each.","radar_map":{"recognise":"Target","analyse":"Explore","design":"Solution","act":"Trial","routinise":"Scale"},"assessment":"Named in the course outline as an example design scheme.","citation":"bit_tests"},{"id":"rare","name":"RARE","kind":"scheme","owner":"Rare (rare.org)","expansion":"Rare's Behavior-Centered Design: Frame, Empathize, Map, Ideate, Prototype, Test, Launch, Assess","stages":["Frame","Empathize","Map","Ideate","Prototype","Test","Launch","Assess"],"plain":"Rare's own eight-step method, Behavior-Centered Design, described in the toolkit Rare wrote with the Behavioural Insights Team (2019).","side_effects":"The toolkit's chapters on strategies warn that payments can crowd out the motives people already had, that a fine can be read as a price, and that guilt and fear appeals can backfire, with remedies for each.","gap":"It gives specific warnings for incentives, fines and emotional appeals. RADAR extends this to other types of intervention, with an indicator for each side effect.","radar_map":{"recognise":"Frame and Empathize","analyse":"Map","design":"Ideate and Prototype","act":"Test and Launch","routinise":"Assess"},"assessment":"Named in the course outline as an example design scheme, and among the Phase 3 methods.","citation":"rare_bit2019"},{"id":"east","name":"EAST","kind":"inventory","owner":"Behavioural Insights Team","expansion":"Easy, Attractive, Social, Timely","stages":["Easy","Attractive","Social","Timely"],"plain":"Four levers for making a behaviour more likely.","side_effects":"The revised edition (2024) adds ‘behavioural pitfall’ boxes, for example on financial incentives that backfire by undermining the reasons people already had.","gap":"It is a list of levers, some with warnings, used within the Design step. RADAR adds a step for anticipating side effects.","radar_map":{"design":"Choosing the lever"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"bit_east2024"},{"id":"mindspace","name":"MINDSPACE","kind":"inventory","owner":"Institute for Government and Cabinet Office","expansion":"Messenger, Incentives, Norms, Defaults, Salience, Priming, Affect, Commitments, Ego","stages":["Messenger","Incentives","Norms","Defaults","Salience","Priming","Affect","Commitments","Ego"],"plain":"A checklist of nine influences on behaviour, set inside the report's 6 Es framework for applying them to policy.","side_effects":"Says it ‘can also show how policymaking can have unintended and perverse effects on behaviour’, with examples such as the energy-use boomerang, where households below the average used more once told the average.","gap":"It gives examples. RADAR adds a route from a planned intervention to its likely side effects and their indicators.","radar_map":{"design":"Choosing the influence"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"dolan2010"}],"mechanisms":[{"id":"reactance","family":"behavioural","name":"Resistance to control","technical":"Reactance and the hidden costs of control","gloss":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom. A related finding, the hidden costs of control, is that some people then do the minimum the rule requires and withdraw the effort nobody specified.","example":"Managers complete mandatory training at the minimum time the system allows, and stop volunteering for related work.","see":["Behaviour clusters at the minimum the rule will accept","A voluntary version of the same activity gets more real engagement","Related effort that was never required falls after the rule starts"],"cues":["mandatory","compulsory","required","requirement","forced","enforce","enforced","imposed","policed","monitored","surveillance","tick box","box ticking","bare minimum","do the minimum","minimum effort","minimum required","just the minimum","resent","resentment","pushback from","pushback against","pushback problem","pushback issue","push back against","get pushback","getting pushback","face pushback","facing pushback","lots of pushback","strong pushback","told to","micromanaged","micromanage","micromanagement","feel controlled","feel distrusted","treated like children","waste of time","telling off","told off","humiliating","humiliated","public shaming","take their jobs","take their job","take our jobs","lose their jobs","lose their job","lose our jobs","job losses","job security","made redundant"],"strength":"mixed","basis":"Two related findings support this. Reactance theory: people push back to restore a freedom that is threatened (Brehm). The hidden costs of control: in a laboratory principal-agent game, being controlled lowered the effort of most agents, and agents who reacted negatively said they read the control as a signal of distrust (Falk and Kosfeld). Four repetitions found these hidden costs, smaller than in the original, and control often still paid for the principal (Ziegelmeyer and colleagues). Observational data from more than 800 US firms link mandatory diversity training to lower diversity five years on, which the authors attribute to resistance (Dobbin and Kalev).","citations":["brehm1966","falk_kosfeld2006","ziegelmeyer2012","dobbin_kalev2016"],"line":"People push back when a rule removes choice or signals distrust.","gloss_class":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom.","short":"Resistance to control"},{"id":"crowding_out","family":"behavioural","name":"Payment displaces existing motives","technical":"Motivation crowding out","gloss":"A fine, fee or bonus can weaken the social or professional reasons people already had to act.","example":"After a late fee was introduced at day-care centres, more parents collected their children late.","see":["The behaviour gets worse among people who used to do it without being paid or charged","People talk about the fee or the bonus, not the reason for the rule","Removing the fee or bonus does not bring the old behaviour back"],"cues":["penalty","penalties","penalised","late fee","late fees","charge~~=fee","charge~~=fees","pay~~=fee","pay~~=fees","new fee","new fees","introduce~~=fee","introduce~~=fees","=charged","charge for","charge them","bonus","bonuses","incentive","incentives","=reward","=rewards","reward them","reward people","reward staff","rewar r","explain~~boss","explain~~supervisor","explain~~head of","explain~~chief","explain~~committee","explain~~=board","explain~~senior","explain~~line manager","explain~~their manager","explain~~your manager","explain~~his manager","explain~~her manager","justify~~director","justify~~boss","justify~~supervisor","justify~~head of","justify~~chief","justify~~committee","justify~~=board","justify~~senior","justify~~line manager","justify~~their manager","justify~~your manager","justify~~his manager","justify~~her manager","report~~director","report~~boss","report~~supervisor","report~~head of","report~~chief","report~~committee","report~~=board","report~~senior","report~~line manager","report~~their manager","report~~your manager","report~~his manager","report~~her manager","account for~~director","account for~~boss","account for~~supervisor","account for~~head of","account for~~chief","account for~~committee","account for~~=board","account for~~senior","account for~~line manager","account for~~their manager","account for~~your manager","account for~~his manager","account for~~her manager","answer to~~director","answer to~~boss","answer to~~supervisor","answer to~~head of","answer to~~chief","answer to~~committee","answer to~~=board","answer to~~senior","answer to~~line manager","answer to~~their manager","answer to~~your manager","answer to~~his manager","answer to~~her manager"],"levers":[],"counter_why":{"automation_bias":"It forces an independent judgement before the model's answer is seen."},"example":"A reviewer checks a blind sample of the model's decisions.","actions":{"start":{"label":"Review more of the model’s decisions","example":"A reviewer checks a blind sample of the model’s decisions."},"adjust":{"label":"Change how the review works","example":"Ask for a reason on a random sample, not on every case."},"stop":{"label":"Review less, or stop","example":"Check 1 in 100 decisions instead of 1 in 10."}},"removes":false},{"id":"basket_of_measures","name":"Use a small set of measures","plain":"Pair the target with a counterweight that is hard to game.","family":"enable","runs_through":[],"counters":["metric_gaming"],"side_effects":["attention_spread_thin"],"cues":["basket","balanced scorecard","counterweight","quality measure","combine~~quality","score both","several indicators","combine two measures","balanced index","combine~~metrics","combine~~measures","two performance metrics","several performance measures","index of quality"],"unless":[],"levers":[],"counter_why":{"metric_gaming":"Several measures are harder to game than one."},"example":"Track complaints next to the sales target.","actions":{"start":{"label":"Add measures next to the current one","example":"Track complaints next to the sales target."},"adjust":{"label":"Replace a measure with another","example":"Track repeat visits instead of complaints."},"stop":{"label":"Drop measures","example":"Go back to the sales target alone."}},"removes":false},{"id":"add_capacity","name":"Add time or resources","plain":"Give people the time, cover or budget the behaviour needs.","family":"enable","runs_through":[],"counters":["capacity"],"side_effects":["time_absorbed"],"cues":["more time","extra day","extra days","extra afternoon","extra hour","another afternoon","additional colleague","extra colleague","headcount","cover for","extra cover","resource","resources","protected time","hire a","hire an","hire~more","hire~extra","hire~additional","recruit a","recruit~more","recruit~extra","backfill","locum","temporary staff","agency staff","extra~staff","more~staff","additional~staff","more people","extra people","more capacity","extra capacity","more hands","add another nurse","add another worker","add another person","add~~nurse","add~~doctor","add~~staff","increase staffing","staff the peak","more shift cover","additional pharmacist","additional caseworker","extra caseworker","extra paid time","another shift worker","another cashier","additional cashier","another clinician","extra clerk","another engineer","additional nurse","another pharmacist","more paid time","additional operator","extra operator"],"unless":[],"levers":[],"counter_why":{"capacity":"It removes the constraint instead of working around it."},"example":"Free two hours a week for the review.","actions":{"start":{"label":"Add time or resources","example":"Free two hours a week for the review."},"adjust":{"label":"Change how the time is used","example":"Book the two hours as a fixed Tuesday slot."},"stop":{"label":"Cut the time or resources","example":"Cut the review time from two hours to one."}},"removes":false},{"id":"train_clarify","name":"Train or clarify","plain":"Close the knowledge or skill gap.","family":"enable","runs_through":[],"counters":["information"],"side_effects":["training_becomes_box_ticking"],"cues":["training","train","guidance","clarify","coaching","coach staff","coach employees","instructions","written instructions","clearer written instructions","one to one coaching"],"unless":[],"levers":[],"counter_why":{"information":"People then know how to do what is asked."},"example":"A short session on what the control step protects.","actions":{"start":{"label":"Train more, or more people","example":"A short session on what the control step protects."},"adjust":{"label":"Change the format or content","example":"Swap the hour-long course for a ten-minute guide at the desk."},"stop":{"label":"Train less, or stop","example":"Drop the refresher for staff with five years’ service."}},"removes":false},{"id":"realign_incentive","name":"Remove the conflicting reward","plain":"Change the rule or reward that pays for the behaviour you want to stop.","family":"enable","runs_through":[],"counters":["misaligned"],"side_effects":["effect_outlasts_removal","useful_effect_lost"],"cues":["realign","remove the incentive","remove~~bonus","change the bonus","conflicting target"],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."},"example":"Stop paying the bonus on sales volume alone.","actions":{"start":{"label":"Remove the reward","example":"Stop paying the bonus on sales volume alone."},"adjust":{"label":"Move the reward to another target","example":"Pay the bonus on renewals instead of new sales."},"stop":{"label":"Bring the reward back","example":"Restore the bonus on sales volume."}},"removes":true}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours resistance. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is resistance. If effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap. If minimum effort persists, it is resistance."},{"a":"reactance","b":"hassle","observation":"You can remove one step for a random sample. If more of them complete it, or complete it properly, it was friction. If they still do the minimum, it is resistance."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity. If the easy parts still carry the number, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"You can look at the pattern inside the period. Gaming concentrates on the cheapest component. Procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target. If it is where another reward conflicts, it is a conflicting incentive."},{"a":"diffusion","b":"hassle","observation":"You can remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion. If only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. If checks remain shallow despite the extra time, this points to diffusion of responsibility. Deeper checks point to time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. If overrides remain rare despite the extra time, this points to deference to the model. More overrides would point to time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones track the model, including where it was wrong, they were deferring. If blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams that see breaches in units they feel no closeness to with teams that see only their own record. If compliance slides only where distant breaches are visible, weak ties are the problem. If both slide to the same minimum, it is resistance to the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance. If everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction. If compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds no message, the message with the statistic, or the same message without it. If the version without the statistic wins, the statistic was the problem. If both beat no message equally, attention did the work and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"You can check whose performance fell. If it is the people who used to do it without being paid or charged, payment is displacing existing motives. If it is where a competing reward is strongest, it is a conflicting incentive."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction. If starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity. If instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"You can observe three people attempting the task. If they know what to do but give up on the process, it is friction. If they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention. If most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default. If only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the intended time.","preset":{"change_iv":"mandate","change_mode":"adjust","change":"Keep the training required, and let managers choose its format and timing.","justify":"Choosing the format and timing gives managers back some control, which can ease their resistance to being told what to do","reason1":"Managers are too busy in the window to give the training proper time.","reason2":"Managers resent being required to take it and do the minimum.","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or resistance to the requirement? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","kalev_dobbin2020"]},{"id":"c1","kind":"preset","title":"The annual conduct module","short":"Conduct module","teaser":"After a regulatory finding, a 5,000‑person firm made its annual conduct module mandatory. Completion is now 100 per cent. The median time is 9 minutes.","theme":"Annual training in a regulated firm","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The client-review target","short":"Client-review target","teaser":"Each regional team’s bonus depends on 40 client reviews a quarter. For six quarters, every region has reported between 40 and 42.","theme":"A team target linked to the bonus","situation":"A services business set each regional team a target of 40 client reviews a quarter, tied to the team bonus.","behaviour":"Mean review length fell from 52 minutes to 31. Reviews booked in the last two weeks of the quarter rose from 18 to 47 per cent. Client satisfaction is unchanged. For six quarters, every region has reported between 40 and 42.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"numeric_target","likely":["metric_gaming","capacity","present_bias"],"bridge":"Why has no region reported more than 42 reviews in a quarter?"},{"id":"c3","kind":"preset","title":"The two-step sign-in campaign","short":"Sign-in campaign","teaser":"Weekly emails told 4,000 staff that only 38 per cent had switched on two-step sign-in. Sign-ups then stalled at 51 per cent.","theme":"A weekly email from IT security","situation":"An IT security team emailed all 4,000 staff every Monday for six weeks: 'Only 38 per cent of you have switched on two-step sign-in. Do not be one of the 62 per cent.'","behaviour":"Sign-ups rose in week one, then stalled at 51 per cent. In the three departments that were above 60 per cent before the emails, new sign-ups fell to almost none.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"publish_rate","likely":["descriptive_norm","hassle","information"],"bridge":"Why might sign-ups stop in the departments that were already ahead?"},{"id":"c4","kind":"preset","title":"The client-gift logging rule","short":"Gift-logging rule","teaser":"Group compliance emailed 30 country offices a rule to log client gifts above £50. Within six months, logging fell from 90 to 61 per cent.","theme":"A rule sent to 30 country offices","situation":"Group headquarters told all 30 country offices to log every client gift above £50 within a week. The rule arrived by email from the group compliance team, whom most offices have never met.","behaviour":"Logging ran at 90 per cent in month one and 61 per cent by month six. The fall was steepest in offices where staff could see that colleagues had stopped logging.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["social_proximity","descriptive_norm","hassle"],"bridge":"What would tell apart the offices that kept logging from those that stopped?"}],"checklist":["What exactly are people doing now, and how often?","What are two different reasons they might be doing it?","Is this a control intervention? If so, which voluntary effort might be lost?","Which unmeasured behaviour might the intervention affect, and whose?","Which indicator would show it, and who will review it?","What is the review trigger, and when is the review date?"],"glossary":[{"term":"RADAR","def":"Recognise the behaviour, Analyse the causes, Design the intervention, Act, Routinise. A five-step check used within a design scheme."},{"term":"Side effect","def":"An effect of the intervention on behaviour it was not intended to change, and which is not being measured. Also called an unintended consequence."},{"term":"Indicator","def":"An obtainable figure that would show whether a side effect, or the intended effect, is occurring."},{"term":"Distinguishing observation","def":"An observation that would come out differently depending on which of the two explanations is correct."},{"term":"Working hypothesis","def":"The explanation currently considered more likely. The intervention is designed around it, and the pilot tests it."},{"term":"Control and enabling designs","def":"A control design requires, monitors or prices a behaviour. An enabling design makes it easier, clearer or more attractive."},{"term":"Pre-mortem","def":"An exercise in which the group assumes the intervention has failed and describes how."},{"term":"Evidence check","def":"A comparison of the pre-mortem with the side effects listed for this type of intervention, each labelled by strength of evidence."},{"term":"Review trigger","def":"The level of the indicator that starts a review, for example below 30 per cent."},{"term":"Revision","def":"The decision to keep the intervention or change it in the light of the evidence check."},{"term":"Reviewer","def":"The person, other than the sponsor, who monitors the indicator and can act on it."},{"term":"Design scheme","def":"The stepwise process a behavioural project follows, for example TESTS, BASIC or RARE. EAST and MINDSPACE are lists of levers used within it."},{"term":"COM-B (Capability, Opportunity, Motivation)","def":"A diagnostic model (Michie, van Stralen and West, 2011) named in Phase 2 of the course assignment: a behaviour occurs when people have the Capability, Opportunity and Motivation to perform it. In RADAR's Analyse step, Capability and Opportunity correspond to skill gaps, friction and capacity constraints, while Motivation corresponds to incentives, norms and resistance to control."}],"coach":{"negations":["not","no","never","without","isn't","aren't","don't","doesn't","didn't","wasn't","weren't","nor","wo       if (!S.mode) return stop({k: "mode", t: "Choose whether you are starting it, changing it or stopping it."}, ".ab");
    }
    if (S.screen === "disclose") {
      if (!S.sealed_at) { go("anticipate"); return; }
      if (!S.revealed) { var rv = $("[data-k=reveal]"); if (rv) { rv.focus({preventScroll: true}); rv.scrollIntoView({block: "center"}); } R.announce("Show the research first."); return; }
      if (!S.watch) {
        UI.watchMsg = true; render(); R.announce("Pick the effect you will watch.");
        var w = $("input[name=watch]"); if (w) { w.focus({preventScroll: true}); var ws = $("#watchset"); if (ws) ws.scrollIntoView({block: "center"}); }
        return;
      }
    }
    if (S.screen === "disclose" && S.conf1 === null) return stopAt("conf1", "Move the slider to set how confident you are now.", "#rng-conf1");
    if ((S.screen === "adjust" || S.screen === "record") && (!S.iv || !S.mode || !S.sealed_at)) return go(!S.iv || !S.mode ? "rule" : "anticipate");
    if (S.screen === "adjust") {
      if (!S.decision) return stop({k: "dec", t: "Choose keep it, change it or drop it."}, ".db");
      if (S.decision === "change" && !val(S.change)) return stopAt("change", "Write what you will change.", "#change");
      if (R.guardN() && !val(S.change)) return stopAt("change", "Write why you keep it.", "#change");
      if (!val(S.figure)) return stopAt("figure", "Write the figure that would show it.", "#figure");
    }
    go(K.NEXT[S.screen]);
  },
  back: function () { var i = R.SCREENS.indexOf(S.screen); if (i > 0) go(R.SCREENS[i - 1]); },
  iv: function (id) {
    if (!E.IV[id] || S.sealed_at) return;
    var changed = S.iv !== id;
    UI.ruleMsg = null;
    if (changed) {
      S.iv = id; S.mode = ""; R.resetRouteDerived();
      var xe = S.ex && K.exampleFor(S.ex); if (xe && xe.iv !== id) S.ex = "";
    }
    R.saveSoon(); render(); R.announce(E.IV[id].name + " chosen. Now choose whether you are starting it, changing it or stopping it.");
    if (changed) { var ha = $("#h-act"); if (ha) ha.focus({preventScroll: true}); ensureVisible($("#actwrap .acts")); }
  },
  mode: function (m) {
    if (R.MODES.indexOf(m) < 0 || !S.iv || S.sealed_at) return;
    UI.ruleMsg = null;
    if (S.mode !== m) { S.mode = m; R.resetRouteDerived(); }
    R.saveSoon(); render(); R.announce(R.MODE_VERB[m] + " chosen.");
  },
  "ex-open": function () { UI.examples = true; render(); var f = $(".ex"); if (f) f.focus(); },
  "ex-close": function () { UI.examples = false; render(); var f = $("[data-k='ex-open']"); if (f) f.focus(); },
  "ex-pick": function (id) {
    var ex = K.exampleFor(id); if (!ex) return;
    applyExample(ex); UI.examples = false; R.saveSoon(); render(); R.announce(E.IV[ex.iv].name + " chosen.");
    var n = $("[data-k=next]"); if (n) n.focus();
  },
  seal: function () {
    if (S.sealed_at) return;
    if (!val(S.plan)) return toRule("plan", "Write what your organisation plans to do before you seal.", "#plan");
    var msg = $("#sealmsg"), why = "", focus = "";
    if (!S.iv || !S.mode) { why = "Choose the kind of plan and the action on Rule first."; focus = "[data-k=tab\\:rule]"; }
    else if (!R.strongLines().length && S.conf0 === null) { why = "Set confidence and write one way, in at least four different words."; focus = "#ln0"; }
    else if (!R.strongLines().length) { why = "Write one way it could backfire, in at least four different words."; focus = "#ln0"; }
    else if (S.conf0 === null) { why = "Move the confidence slider to set your confidence first."; focus = "#rng-conf0"; }
    if (why) {
      UI.sealMsg = why; if (msg) msg.textContent = why; R.announce(why);
      var f = $(focus); if (f) { f.focus({preventScroll: true}); f.scrollIntoView({block: "center"}); }
      return;
    }
    S.sealed_at = Date.now(); UI.sealMsg = ""; UI.anim = "seal";
    R.flushSave(); render(); UI.anim = "";
    R.announce("Prediction sealed at " + R.clockTime(S.sealed_at) + ". The research can now be shown.");
    window.scrollTo(0, 0);
    var n = $("[data-k=next]"); if (n) n.focus({preventScroll: true});
  },
  reveal: function () {
    if (!S.sealed_at || S.revealed || !S.mode) return;
    S.revealed = true; UI.anim = "reveal"; R.flushSave(); render(); UI.anim = "";
    R.announce("Research opened. " + R.cards().length + (R.cards().length === 1 ? " card" : " cards") + ". Mark each one the group named.");
    var f = $(".gap"); if (f) { f.setAttribute("tabindex", "-1"); f.focus({preventScroll: false}); }
  },
  mark: function (arg) {
    var p = arg.split(":"), id = p[0], v = p[1];
    if (!R.open() || R.cards().indexOf(id) < 0) return;
    if (S.marks[id] === v) delete S.marks[id]; else S.marks[id] = v;
    R.saveSoon(); render(); R.announce(R.tallyLive() || "Mark removed.");
  },
  decide: function (d) {
    if (["keep", "change", "drop"].indexOf(d) < 0) return;
    S.decision = d; UI.decMsg = ""; R.saveSoon(); render(); if (d === "change" || (d === "keep" && R.guardN())) { var c = $("#change"); if (c) c.focus(); }
  },
  idea: function (i) {
    var se = R.open() && S.watch && S.watch !== "own" ? E.SE[S.watch] : null; if (!se || !se.mitigations[+i]) return;
    var cur = val(S.change).replace(/[.\s]+$/, ""); S.change = R.oneLine((cur ? cur + ". " : "") + K.disp(se.mitigations[+i]), R.MAXLEN.change);
    if (UI.stop && UI.stop.k === "change") UI.stop = null;
    var c = $("#change"); if (c) c.value = S.change; R.saveSoon(); updateChrome();
  },
  worryfrom: function (i) {
    var t = S.lines[+i]; if (!val(t) || S.sealed_at) return;
    S.worry = t; R.saveSoon(); render(); var w = $("#worry"); if (w) w.focus({preventScroll: true});
  },
  recchange: function () { UI.recChange = true; render(); var r = $("#rng-conf1"); if (r) r.focus({preventScroll: true}); },
  usefig: function () {
    var ex = R.exampleFigure(); if (!ex.fig) return;
    S.figure = ex.fig; S.figure_src = ex.src; S.figure_for = S.watch; R.saveSoon(); render();
    var f = $("#figure"); if (f) f.focus({preventScroll: true});
  },
  show: function () {
    if (!S.iv || !S.mode || !S.sealed_at) return go(!S.iv || !S.mode ? "rule" : "anticipate");
    if (!val(S.owner)) return stopAt("owner", "Write who owns it and by when.", "#owner");
    if (S.conf1 === null) return stopAt("conf1", "Move the slider to set how confident you are now.", "#rng-conf1");
    if (R.guardN() && !val(S.change)) { go("adjust"); return stopAt("change", "Write why you keep it.", "#change"); }
    overlayTrigger = "next"; UI.overlay = true; renderOverlay(); enterFs();
  },
  close: function () { UI.overlay = false; UI.fsOn = false; leaveFs(); renderOverlay(); restoreFocus(overlayTrigger || "next"); },
  copy: copyText,
  pdf: function () {
    try {
      var bytes = window.RADAR_PDF.build(pdfModel());
      download(slug() + ".pdf", "application/pdf", new Blob([bytes], {type: "application/pdf"}));
      fileMsg(window.RADAR_PDF.lossy ? "PDF saved. Some characters could not be shown in it." : "PDF saved.");
    } catch (e) { fileMsg("The PDF could not be made. Use Print instead."); }
  },
  again: function () { UI.confirmAgain = true; render(); var y = $("[data-k=again-yes]"); if (y) y.focus(); },
  "again-yes": function () {
    R.wipe(); R.setState(R.fresh()); UI.restorable = null; UI.confirmAgain = false; UI.examples = false; UI.filter = ""; UI.sealMsg = ""; UI.ruleMsg = null; UI.decMsg = ""; UI.fileMsg = "";
    render({go: true}); R.announce("Cleared. Start again.");
  },
  "again-no": function () { UI.confirmAgain = false; render(); }
};

/* ---------------- listeners ---------------- */
function startClock() { if (S.started && S.screen !== "start" && !S.t0) { S.t0 = Date.now(); R.saveSoon(); } }
document.addEventListener("click", startClock, true);
document.addEventListener("mousedown", function (e) { var t = e.target; if (t && t.matches && t.matches(".fld.locked input,.fld.locked textarea")) e.preventDefault(); });
document.addEventListener("keydown", startClock, true);
document.addEventListener("input", startClock, true);
document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("[data-a]") : null; if (!t) return;
  var f = A[t.getAttribute("data-a")]; if (f) f(t.getAttribute("data-arg"), t, e);
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.matches && t.matches("input[data-conf]")) return sliderMoved(t);
  var f = t.getAttribute && t.getAttribute("data-f"); if (!f) return;
  if (f === "filter") { UI.filter = t.value; $("#types").innerHTML = K.typesHTML(); R.tidy($("#types")); return; }
  if (t.classList && t.classList.contains("grow")) grow(t);
  if ((f === "line" || f === "worry") && UI.sealMsg) { UI.sealMsg = ""; var sm = $("#sealmsg"); if (sm) sm.textContent = ""; }
  if (S.sealed_at && (f === "plan" || f === "whom" || f === "line" || f === "worry")) return;
  if (f === "plan" && UI.ruleMsg && UI.ruleMsg.k === "plan") { UI.ruleMsg = null; var pm = $("#msg-plan"); if (pm) pm.remove(); }
  if (f === "line") S.lines[+t.getAttribute("data-i")] = R.oneLine(t.value, R.MAXLEN.line);
  else if (f === "plan") S.plan = R.cleanText(t.value, R.MAXLEN.plan);
  else if (f === "worry") S.worry = R.oneLine(t.value, R.MAXLEN.worry);
  else if (R.MAXLEN[f] !== undefined) S[f] = R.oneLine(t.value, R.MAXLEN[f]);
  if (UI.stop && UI.stop.k === f) { UI.stop = null; var xm = $("#msg-" + f); if (xm) xm.remove(); }
  if (f === "figure") {
    /* a source that came with the table example no longer belongs to a figure the group has rewritten */
    var ex = R.exampleFigure();
    if (S.figure_src && S.figure_src === ex.src && val(S.figure) !== ex.fig) { S.figure_src = ""; var fs = $("#figure_src"); if (fs) fs.value = ""; }
    var tg = $(".stag"); if (tg && val(S.figure) && val(S.figure) !== ex.fig) tg.remove();
  }
  R.saveSoon(); updateChrome();
});
document.addEventListener("pointerup", function (e) {   /* a click on the thumb without moving it still sets the value */
  var t = e.target; if (t && t.matches && t.matches("input[data-conf]") && S[t.getAttribute("data-conf")] === null) sliderMoved(t);
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.matches && t.matches("input[type=radio][name=watch]")) {
    if (!R.open() || (R.cards().indexOf(t.value) < 0 && t.value !== "own")) return;
    R.setWatch(t.value); R.saveSoon(); updateChrome(); R.announce(R.watchName() + " chosen to watch.");
  } else if (t.matches && t.matches("input[data-conf]") && S[t.getAttribute("data-conf")] === null) sliderMoved(t);
});
document.addEventListener("keydown", function (e) {
  if (UI.overlay) {
    if (e.key === "Escape") { e.preventDefault(); A.close(); }
    else if (e.key === "Tab") { e.preventDefault(); var c = $("[data-k=close]"); if (c) c.focus(); }
    return;
  }
  var t = e.target;
  if (t.matches && t.matches(".tb,.ab,.ex,.db") && /^Arrow|^Home$|^End$/.test(e.key)) {
    var grp = $$(t.classList.contains("tb") ? ".tb" : t.classList.contains("ab") ? ".ab" : t.classList.contains("ex") ? ".ex" : ".db"), i = grp.indexOf(t), n = grp.length, j = i;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") j = (i + 1) % n; else if (e.key === "ArrowLeft" || e.key === "ArrowUp") j = (i - 1 + n) % n; else if (e.key === "Home") j = 0; else j = n - 1;
    e.preventDefault(); grp.forEach(function (b, k) { b.setAttribute("tabindex", k === j ? "0" : "-1"); }); grp[j].focus();
  }
});
document.addEventListener("focusin", function (e) {
  var t = e.target; if (t.matches && t.matches(".tb")) $$(".tb").forEach(function (b) { b.setAttribute("tabindex", b === t ? "0" : "-1"); });
});
var rsT = null;
function retidy() { clearTimeout(rsT); rsT = setTimeout(function () { R.tidy($("#hd")); R.tidy($("#main")); R.tidy($("#foot")); if (UI.overlay) { fitOverlay(true); R.tidy($("#overlay")); fitOverlay(false); } growAll(); syncHdr(); }, 90); }
document.addEventListener("fullscreenchange", function () {
  if (document.fullscreenElement) UI.fsOn = true;
  else if (UI.fsOn) { UI.fsOn = false; if (UI.overlay) A.close(); }
  retidy();
});
R.onSave(function () { updateChrome(); });
window.addEventListener("resize", retidy);
if (window.ResizeObserver) new ResizeObserver(retidy).observe($("#main"));
window.addEventListener("pagehide", function () { R.flushSave(); });
window.addEventListener("beforeunload", function () { R.flushSave(); });
setInterval(function () { var c = $("#clk"); if (c) c.textContent = R.elapsedText(); }, 15000);

/* ---------------- boot ---------------- */
(function boot() {
  UI.restorable = R.load();
  render({});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { R.tidy($("#hd")); R.tidy($("#main")); R.tidy($("#foot")); syncHdr(); });
  window.RADAR3.render = render; window.RADAR3.rows = rows; window.RADAR3.recordText = recordText; window.RADAR3.pdfModel = pdfModel;
})();
})();
</script>
</body>
