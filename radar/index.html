<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADAR: a pre-flight check for any change that tightens control</title>
<meta name="description" content="RADAR, Cambridge Judge Business School Executive MBA, Session 4. Works offline; nothing you type leaves this device.">
<meta name="color-scheme" content="light">
<style>:root{
 --bg:#000;--panel:#171A20;--panel2:#101318;--raise:#1F232B;--line:#2C323A;--line2:#3A414A;
 --amber:#E8B23A;--amber2:#C9932A;--amberT:rgba(232,178,58,.13);--ink:#F2F2F2;--white:#fff;
 --muted:#A3A8AF;--dim:#8E949C;--red:#E0625D;--redT:rgba(224,98,93,.12);--green:#6CC08A;--greenT:rgba(108,192,138,.12);
 --blue:#8FB3D9;--r:10px;--focus:0 0 0 3px rgba(232,178,58,.55);
 --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:var(--hdr,140px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--amber)}
/* ---------------- header ---------------- */
header.hd{position:sticky;top:0;z-index:40;background:#000;border-bottom:1px solid var(--line)}
.hrow{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px}
.mark{display:flex;gap:4px}.mark i{display:block;width:6px;height:24px;background:var(--amber)}
.brand b{display:block;font-size:20px;letter-spacing:.06em;color:var(--white)}
.brand span{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sp{flex:1}
.clock{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px}
.clock output{font-weight:700;font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.clock.warn output{color:var(--red)}.clock.done output{color:var(--red)}
.clock small{font-size:11.5px;color:var(--muted);max-width:110px;line-height:1.2}
.ib{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:14px;background:var(--panel2)}
.ib:hover{border-color:var(--amber)}
.ib.pri{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.ib.pri:hover{background:var(--amber2)}
.ib[disabled]{cursor:not-allowed;color:var(--muted);background:var(--raise);border-color:var(--line2)}
.ib.pri[disabled]{background:#3A3524;border-color:#5A5030;color:#D9D3BF}   /* still reads as the main action, and still legible */
nav.tabs{max-width:1240px;margin:10px auto 0;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:132px;text-align:left;padding:8px 12px 9px;border-radius:9px 9px 0 0;background:var(--panel);border-bottom:3px solid transparent;color:var(--muted)}
.tab .l{font-size:18px;font-weight:700;color:#5E6773;margin-right:7px}
.tab .n{font-size:13.5px;color:var(--ink)}
.tab .m{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.tab .live{color:var(--amber);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab[aria-current="step"]{background:var(--amberT);border-bottom-color:var(--amber)}
.tab[aria-current="step"] .l{color:var(--amber)}
.tab.done .l{color:var(--amber2)}
.tab.brief{min-width:96px}
/* ---------------- layout ---------------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 90px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:30px}
.wrap.full{grid-template-columns:minmax(0,1fr)}
main{min-width:0}
aside.rail{position:sticky;top:calc(var(--hdr,140px) + 14px);align-self:start;max-height:calc(100vh - var(--hdr,140px) - 30px);overflow:auto}
@media(max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}aside.rail{display:none}}
/* ---------------- step head ---------------- */
.sh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.badge{flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--amber);color:#000;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sh h2{font-size:28px;line-height:1.15;color:var(--white)}
@media(max-width:480px){.sh h2{font-size:23px}}
.sh .plain{font-size:14.5px;color:var(--amber);margin-top:3px}
.sh .q{font-size:19px;color:var(--ink);margin-top:5px}
.sh .h{font-size:14.5px;color:var(--muted);margin-top:4px}
.livebar{display:flex;align-items:center;gap:10px;background:var(--amberT);border:1px solid rgba(232,178,58,.35);border-radius:var(--r);padding:9px 14px;margin:0 0 16px;font-size:14px}
.livebar b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
/* ---------------- cards and fields ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card.quiet{background:var(--panel2)}
.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:3px}
.card .hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.card h4{font-size:17px;color:var(--white);margin-bottom:4px}
textarea,input[type=text],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;font-size:16px;line-height:1.45;resize:vertical}
textarea{min-height:76px;overflow:hidden}
textarea:focus,input:focus{outline:none;border-color:var(--amber);box-shadow:var(--focus)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
.lab{display:block;font-size:14px;font-weight:700;color:var(--white);margin:0 0 6px}
.sub{font-weight:400;color:var(--muted);font-size:13.5px}
.given{font-size:15.5px;line-height:1.55;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:11px 13px}
/* ---------------- coach ---------------- */
.coach{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cq{display:flex;gap:10px;align-items:flex-start;background:rgba(232,178,58,.07);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 10px;font-size:14.5px}
.cq .qi{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#000;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cq .mw{display:inline-block;background:var(--raise);border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin:0 3px 0 0;font-size:12.5px;color:var(--muted)}
.cq .x{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:underline;white-space:nowrap}
.cq.warn{border-left-color:var(--red);background:var(--redT)}
.cq.warn .qi{background:var(--red)}
/* ---------------- chips and choice cards ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:14.5px}
.chip:hover{border-color:var(--amber2);background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--amberT);border-color:var(--amber);color:var(--white);font-weight:700}
.kinds{margin-top:8px}
@media(min-width:700px){.scant td:nth-child(2){min-width:10.5em}}.allk{margin-top:12px}.allk summary{cursor:pointer;color:var(--amber);font-size:14.5px}.kfam{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.chip small{color:var(--muted);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.choice{text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.choice:hover{border-color:var(--amber2);background:var(--raise)}
.choice[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 1px var(--amber)}
.choice b{font-size:16px;color:var(--white)}
.choice span{font-size:14px;color:var(--muted)}
.choice em{font-style:normal;font-size:13.5px;color:var(--ink)}
.fam{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;width:max-content}
.fam.control{background:var(--redT);color:var(--red)}.fam.enable{background:var(--greenT);color:var(--green)}
/* ---------------- think / reveal ---------------- */
.gatebtn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.gatebtn .why{font-size:13.5px;color:var(--muted)}
.reveal{border:1px solid rgba(232,178,58,.4);background:linear-gradient(180deg,rgba(232,178,58,.07),rgba(232,178,58,0) 60%);border-radius:var(--r);padding:16px 18px;margin:12px 0 14px}
.reveal.fresh{animation:rin .35s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.reveal>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:8px}
.mech{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel2);margin-bottom:8px}
.mech .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mech .nm{font-weight:700;color:var(--white)}
.mech .tn{font-size:13px;color:var(--muted)}
.bars{display:inline-flex;gap:3px;margin-left:auto}.bars i{display:block;width:9px;height:14px;border-radius:2px;background:var(--line2)}.bars i.on{background:var(--amber)}
.whys{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.whys span{font-size:12.5px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.mech details{margin-top:6px}.mech summary{font-size:13.5px;color:var(--amber);cursor:pointer}
.mech .more{font-size:14px;color:var(--ink);margin-top:6px;display:flex;flex-direction:column;gap:6px}
.mech .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin-top:8px}
.tag b{color:var(--white)}
/* evidence badges */
.ev{font:inherit;background:none;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:5px;white-space:nowrap}
.ev.strong{border:1px solid var(--ink);color:var(--ink)}
.ev.mixed{border:1px solid var(--amber);color:var(--amber)}
.ev.extrapolation{border:1px dashed var(--muted);color:var(--muted)}
.ev.structural{border:1px solid var(--blue);color:var(--blue)}
.cite{font-size:12.5px;color:var(--dim)}
/* side-effect cards */
.se{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--panel2);margin-bottom:10px}
.se.close{border-color:var(--amber)}
.se .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.se .nm{font-weight:700;font-size:16px;color:var(--white)}
.se .who{font-size:12.5px;color:var(--muted)}
.se p{font-size:14.5px;margin-top:5px}
.se dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px;margin-top:8px}
.se dt{color:var(--muted)}
.se .marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mk{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2)}
.mk[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);color:var(--white);font-weight:700}
.closest{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--amber);border-radius:4px;padding:2px 7px;font-weight:700}
.trail{border-left:3px solid var(--amber);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14.5px;margin:10px 0}
.prov{font-size:12.5px;margin-top:6px}.prov.tool{color:var(--red)}.prov.adapted{color:var(--amber)}.prov.own{color:var(--green)}
/* ---------------- dots ---------------- */
.dotrow{display:flex;align-items:center;gap:12px;margin:6px 0}
.dotrow .dl{width:170px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;font-size:11px;color:var(--dim)}
.dot.on{background:var(--muted);border-color:var(--muted);color:#000}
.dots.after .dot.on{background:var(--amber);border-color:var(--amber)}
.delta{font-size:14.5px;color:var(--ink);margin-top:6px}
@media(max-width:560px){.dotrow{flex-direction:column;align-items:flex-start}}
/* ---------------- nav foot ---------------- */
.foot{display:flex;align-items:center;gap:12px;margin-top:22px;margin-bottom:14px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .open{font-size:13.5px;color:var(--muted)}
.foot .open[data-live]{flex:1 1 100%;order:-1}.foot .open[data-live]:empty{display:none}
.foot .sp{flex:1}
/* ---------------- rail: the chain ---------------- */
.chain{display:flex;flex-direction:column;gap:0}
.chain h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.cn{display:block;width:100%;text-align:left;position:relative;padding:9px 12px 11px 30px;border-radius:9px}
.cn:hover{background:var(--panel)}
.cn::before{content:"";position:absolute;left:11px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--line2)}
.cn.ok::before{background:var(--amber)}
.cn::after{content:"";position:absolute;left:15px;top:25px;bottom:-12px;width:1px;background:var(--line2)}
.cn:last-child::after{display:none}
.cn b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cn span{display:block;font-size:14px;color:var(--ink);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cn span.o{color:var(--dim);font-style:italic}
.cn.hot b{color:var(--amber)}
.railnote{font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.45}
/* ---------------- start ---------------- */
.hero h1{font-size:56px;letter-spacing:.04em;color:var(--white);line-height:1}
.hero .tl{font-size:30px;line-height:1.2;color:var(--white);margin-top:4px;max-width:820px;font-family:"EB Garamond",Georgia,serif}
.hero .out{font-size:16.5px;color:var(--muted);margin-top:10px;max-width:820px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 26px}
@media(max-width:900px){.steps5{grid-template-columns:1fr 1fr}}
.s5{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.s5 .l{font-size:26px;font-weight:700;color:var(--amber)}
.s5 b{display:block;font-size:14px;color:var(--white);margin-top:2px}
.s5 span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.s5 span.pl{color:var(--amber);font-size:12.5px;margin-top:3px}
.s5 .m{font-size:12px;color:var(--dim);margin-top:6px}
.s5 .m span{display:inline;margin:0}
.s5 .live{color:var(--amber);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.cases{display:flex;flex-wrap:wrap;gap:12px}   /* a short last row stretches to the full width: no empty slot, an even gap */
.cs{flex:1 1 270px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:15px 16px}
.cs:hover{border-color:var(--amber)}
.cs{position:relative}
.cs[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 2px var(--amber)}
.cs[aria-pressed="true"]::after{content:"\2713  Chosen";position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#000;background:var(--amber);border-radius:999px;padding:2px 10px}
.cs[aria-pressed="true"] .k{padding-right:84px}
.cs b{display:block;font-size:16px;color:var(--white)}
.cs span{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.cs .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.cs.own{border-style:solid;border-color:rgba(232,178,58,.5)}
.honest{font-size:13px;color:var(--dim);margin-top:18px;max-width:820px;line-height:1.5}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amberT);border:1px solid rgba(232,178,58,.4);border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
/* ---------------- brief ---------------- */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px}
@media(max-width:1100px){.bgrid{grid-template-columns:1fr}}
.paper{background:#fff;color:#1A1B1E;border-radius:6px;padding:34px 38px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paper .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B8860B;font-weight:700}
.paper h2{font-size:24px;color:#1A1B1E;margin-top:3px}
.paper .meta{font-size:13px;color:#6C6C6E;margin-top:3px}
.paper hr{border:0;border-top:2px solid #B8860B;margin:12px 0 14px}
.paper .rb{background:#FAF6EC;border-left:3px solid #B8860B;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:12px}
.paper .rb.no{font-weight:400;color:#6C6C6E}
.paper .sec{border-top:1px solid #B8860B;padding:8px 0 6px}
.paper .sec h4{font-size:14.5px;color:#1A1B1E;margin-bottom:4px}
.paper .sec h4 i{font-style:normal;color:#B8860B;margin-right:8px}
.paper dl{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:13.5px}
.paper dt{color:#6C6C6E;font-weight:700;font-size:12px;padding-top:1px}
.paper dd.o{color:#A0A0A3;font-style:italic}
.paper .map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:12px;border-top:1px solid #D7D7D9;margin-top:8px;padding-top:8px}
.paper .map b{display:block;color:#6C6C6E;font-size:11px}
.paper .tr{font-size:12px;color:#6C6C6E;border-top:1px solid #D7D7D9;margin-top:8px;padding-top:6px}
.paper .pft{font-size:11px;color:#6C6C6E;margin-top:6px}
@media(max-width:600px){.paper{padding:20px}.paper dl{grid-template-columns:1fr}.paper .map{grid-template-columns:1fr 1fr}}
.checks{list-style:none;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.checks li i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;border:1.5px solid var(--line2)}
.checks li.ok i{background:var(--amber);border-color:var(--amber)}
.checks li button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2)}
.checks li.ok button{color:var(--muted);text-decoration:none}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .ib{justify-content:center;border-radius:8px}
.exports .why{font-size:13px;color:var(--muted)}
.gatebtn .why,.exports .why{overflow-wrap:anywhere}
.rbbig{font-size:19px;line-height:1.4;color:var(--white);font-weight:700}
.rbbig.no{color:var(--muted);font-weight:400;font-size:15px}
/* ---------------- presenter (waterline) ---------------- */
.pres{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;justify-content:safe center;padding:6vh 8vw;overflow-y:auto}
.pres .k{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.pres .above,.pres .se,.pres .sg,.pres .tgt{text-wrap:balance}
.pres .k2{margin-top:2.2vh;color:var(--muted);font-size:12px}
.pres .above{font-size:3.2vw;line-height:1.25;color:var(--white);max-width:78vw;margin-top:1.5vh}
.pres .tgt{font-size:1.6vw;color:var(--muted);margin-top:1.4vh}
.pres .water{height:3px;background:var(--amber);margin:4vh 0;transform-origin:left;animation:wl .8s ease-out both}
@keyframes wl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pres .below{opacity:0;animation:up .35s ease-out .25s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

68-425."},{"id":"muralidharan2011","short":"Muralidharan and Sundararaman (2011)","text":"Muralidharan, K. and Sundararaman, V. (2011). Teacher performance pay: experimental evidence from India. Journal of Political Economy, 119(1), 39-77."},{"id":"augenblick2015","short":"Augenblick, Niederle and Sprenger (2015)","text":"Augenblick, N., Niederle, M. and Sprenger, C. (2015). Working over time: dynamic inconsistency in real effort tasks. Quarterly Journal of Economics, 130(3), 1067-1115."},{"id":"falk_neuber_szech2020","short":"Falk, Neuber and Szech (2020)","text":"Falk, A., Neuber, T. and Szech, N. (2020). Diffusion of being pivotal and immoral outcomes. Review of Economic Studies, 87(5), 2205-2229."},{"id":"bisin_hyndman2020","short":"Bisin and Hyndman (2020)","text":"Bisin, A. and Hyndman, K. (2020). Present-bias, procrastination and deadlines in a field experiment. Games and Economic Behavior, 119, 339-357."},{"id":"belot_schroder2016","short":"Belot and Schröder (2016)","text":"Belot, M. and Schröder, M. (2016). The spillover effects of monitoring: a field experiment. Management Science, 62(1), 37-45."},{"id":"neal_schanzenbach2010","short":"Neal and Schanzenbach (2010)","text":"Neal, D. and Schanzenbach, D. W. (2010). Left behind by design: proficiency counts and test-based accountability. Review of Economics and Statistics, 92(2), 263-283."},{"id":"courty_marschke2004","short":"Courty and Marschke (2004)","text":"Courty, P. and Marschke, G. (2004). An empirical investigation of gaming responses to explicit performance incentives. Journal of Labor Economics, 22(1), 23-56."},{"id":"jacob2005","short":"Jacob (2005)","text":"Jacob, B. A. (2005). Accountability, incentives and behavior: the impact of high-stakes testing in the Chicago Public Schools. Journal of Public Economics, 89(5-6), 761-796."},{"id":"propper2010","short":"Propper et al. (2010)","text":"Propper, C., Sutton, M., Whitnall, C. and Windmeijer, F. (2010). Incentives and targets in hospital care: evidence from a natural experiment. Journal of Public Economics, 94(3-4), 318-335."},{"id":"jones_molitor_reif2019","short":"Jones, Molitor and Reif (2019)","text":"Jones, D., Molitor, D. and Reif, J. (2019). What do workplace wellness programs do? Evidence from the Illinois Workplace Wellness Study. Quarterly Journal of Economics, 134(4), 1747-1791."},{"id":"kawaguchi2021","short":"Kawaguchi (2021)","text":"Kawaguchi, K. (2021). When will workers follow an algorithm? A field experiment with a retail business. Management Science, 67(3), 1670-1695."},{"id":"jachimowicz2019","short":"Jachimowicz et al. (2019)","text":"Jachimowicz, J. M., Duncan, S., Weber, E. U. and Johnson, E. J. (2019). When and why defaults influence decisions: a meta-analysis of default effects. Behavioural Public Policy, 3(2), 159-186."},{"id":"finkelstein2009","short":"Finkelstein (2009)","text":"Finkelstein, A. (2009). E-ZTax: tax salience and tax rates. Quarterly Journal of Economics, 124(3), 969-1010."},{"id":"bhargava_manoli2015","short":"Bhargava and Manoli (2015)","text":"Bhargava, S. and Manoli, D. (2015). Psychological frictions and the incomplete take-up of social benefits: evidence from an IRS field experiment. American Economic Review, 105(11), 3489-3529."},{"id":"carroll2009","short":"Carroll et al. (2009)","text":"Carroll, G. D., Choi, J. J., Laibson, D., Madrian, B. C. and Metrick, A. (2009). Optimal defaults and active decisions. Quarterly Journal of Economics, 124(4), 1639-1674."},{"id":"dolan2010","short":"Dolan et al. (2010)","text":"Dolan, P., Hallsworth, M., Halpern, D., King, D. and Vlaev, I. (2010). MINDSPACE: Influencing behaviour through public policy. Institute for Government and Cabinet Office."}],"steps":[{"id":"recognise","plain":"Pin down the behaviour as a number","letter":"R","name":"Recognise the friction","question":"What are people actually doing?","help":"State it as something you could count. Causes come in the next step.","minutes":3,"live":false,"sceptic":"Could you count this next week, or is it an impression?"},{"id":"analyse","plain":"Two rival causes, and what tells them apart","letter":"A","name":"Analyse the trigger","question":"Why might they be doing it? Give two different reasons.","help":"Two different causes, then an observation that favours one over the other.","minutes":4,"live":true,"sceptic":"What would you see if reason 1 were wrong?"},{"id":"design","plain":"One change, matched to the cause","letter":"D","name":"Design the change","question":"What will you change, and why does it fit your reason?","help":"One change, matched to the reason you suspect.","minutes":3,"live":false,"sceptic":"Which of your two reasons does this change leave untouched?"},{"id":"act","plain":"A first step, an owner and a date","letter":"A","name":"Act","question":"What is the first step, who takes it, and by when?","help":"Small enough to start next week, without new budget or approval.","minutes":1,"live":false,"sceptic":"Would the owner say yes to this on Monday?"},{"id":"routinise","plain":"Stress-test the change, then make it routine","letter":"R","name":"Routinise","question":"Six months after launch, it backfired. What happened?","help":"Pre-mortem first, then sweep the evidence, then let the group next to you attack it. Fix what got through.","minutes":13,"live":true,"sceptic":"Who would be glad this side effect never shows up in a report?"}],"frameworks":[{"id":"basic","name":"BASIC","kind":"scheme","owner":"OECD","expansion":"Behaviour, Analysis, Strategies, Intervention, Change","stages":["Behaviour","Analysis","Strategies","Intervention","Change"],"plain":"A staged toolkit for running a behavioural project from defining the behaviour to scaling what works.","side_effects":"The most explicit of the five. It lists ‘potential side effects’ as one of the nine parts of every behavioural insight, asks at the Behaviour stage about ‘any potential risks or unintended consequences’, and says to monitor potential side effects ‘throughout all relevant stages’.","gap":"BASIC asks you to consider side effects and plan measures to monitor them. It does not fill that in for you: there is no catalogue from the kind of change you plan to the second behaviour it tends to move and the number that would show it.","radar_map":{"recognise":"Behaviour","analyse":"Analysis","design":"Strategies and Intervention","act":"Intervention","routinise":"Change"},"assessment":"Named in the course outline as an example design scheme.","citation":"oecd_basic2019"},{"id":"tests","name":"TESTS","kind":"scheme","owner":"Behavioural Insights Team","expansion":"Target, Explore, Solution, Trial, Scale","stages":["Target","Explore","Solution","Trial","Scale"],"plain":"BIT's five-phase method for running a behavioural project, moving back and forth between phases as you learn.","side_effects":"Asks at the Solution phase, when you prioritise interventions: 'Are there any potential safety considerations, possible negative side-effects or any other ethical concerns?', and whether the initiative could harm equity. Its worked example names one specific second behaviour.","gap":"A question and an example. It does not give you a way to generate the likely second behaviour for your own change, or its signal.","radar_map":{"recognise":"Target","analyse":"Explore","design":"Solution","act":"Trial","routinise":"Trial and Scale"},"assessment":"Named in the course outline as an example design scheme.","citation":"bit_tests"},{"id":"rare","name":"RARE","kind":"scheme","owner":"Rare (rare.org)","expansion":"Rare's Behavior-Centered Design: Frame, Empathize, Map, Ideate, Prototype, Test, Launch, Assess","stages":["Frame","Empathize","Map","Ideate","Prototype","Test","Launch","Assess"],"plain":"Rare's own eight-step method, Behavior-Centered Design, described in the toolkit Rare wrote with the Behavioural Insights Team (2019).","side_effects":"The toolkit's chapters on strategies warn that payments can crowd out the motives people already had, that a fine can be read as a price, and that guilt and fear appeals can backfire, with remedies for each.","gap":"Specific warnings for incentives, fines and emotional appeals. No general way to get from any change you plan to its second behaviour and signal.","radar_map":{"recognise":"Frame and Empathize","analyse":"Map","design":"Ideate and Prototype","act":"Test and Launch","routinise":"Assess"},"assessment":"Named in the course outline as an example design scheme, and among the Phase 3 methods.","citation":"rare_bit2019"},{"id":"east","name":"EAST","kind":"inventory","owner":"Behavioural Insights Team","expansion":"Easy, Attractive, Social, Timely","stages":["Easy","Attractive","Social","Timely"],"plain":"Four levers for making a behaviour more likely.","side_effects":"The revised edition (2024) adds ‘behavioural pitfall’ boxes, for example on financial incentives that backfire by undermining the reasons people already had.","gap":"A list of levers with warnings attached to some. Use it inside the Design step; it has no step for forecasting what else will move.","radar_map":{"design":"Pick the lever"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"bit_east2024"},{"id":"mindspace","name":"MINDSPACE","kind":"inventory","owner":"Institute for Government and Cabinet Office","expansion":"Messenger, Incentives, Norms, Defaults, Salience, Priming, Affect, Commitments, Ego","stages":["Messenger","Incentives","Norms","Defaults","Salience","Priming","Affect","Commitments","Ego"],"plain":"A checklist of nine influences on behaviour, set inside the report's 6 Es framework for applying them to policy.","side_effects":"Says it ‘can also show how policymaking can have unintended and perverse effects on behaviour’, with examples such as the energy-use boomerang, where households below the average used more once told the average.","gap":"Examples, but no systematic way from the change you plan to its likely second behaviour and signal.","radar_map":{"design":"Pick the influence"},"assessment":"Listed in the course outline among the Phase 3 methods: 'behavioural frameworks such as EAST, MINDSPACE, and Rare Approach'.","citation":"dolan2010"}],"mechanisms":[{"id":"reactance","family":"behavioural","name":"Pushback against control","technical":"Reactance; the hidden costs of control","gloss":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom. A related finding, the hidden costs of control, is that some people then do the minimum the rule requires and withdraw the effort nobody specified.","example":"Managers complete mandatory training at the minimum time the system allows, and stop volunteering for related work.","see":["Behaviour clusters at the minimum the rule will accept","A voluntary version of the same activity gets more real engagement","Related effort that nobody required falls after the rule starts"],"cues":["mandatory","compulsory","required","requirement","forced","enforce","enforced","imposed","policed","monitored","surveillance","tick box","box ticking","bare minimum","do the minimum","minimum effort","minimum required","just the minimum","resent","resentment","pushback from","pushback against","pushback problem","pushback issue","push back against","get pushback","getting pushback","face pushback","facing pushback","lots of pushback","strong pushback","told to","micromanaged","micromanage","micromanagement","feel controlled","feel distrusted","treated like children","waste of time","telling off","told off","humiliating","humiliated","public shaming","take their jobs","take their job","take our jobs","lose their jobs","lose their job","lose our jobs","job losses","job security","made redundant"],"strength":"mixed","basis":"Two related findings. Reactance theory: people push back to restore a freedom that is threatened (Brehm). The hidden costs of control: in a laboratory principal-agent game, being controlled lowered the effort of most agents, and agents who reacted negatively said they read the control as a signal of distrust (Falk and Kosfeld; that is the agents' own explanation); repetitions found the effect smaller, and control often still paid for the person imposing it (Ziegelmeyer and colleagues). Observational firm data fit the pattern but are not experimental.","citations":["brehm1966","falk_kosfeld2006","ziegelmeyer2012","dobbin_kalev2016"]},{"id":"crowding_out","family":"behavioural","name":"Paying for it makes it a transaction","technical":"Motivation crowding out","gloss":"A fine, fee or bonus can turn a social or professional duty into a purchase, and some people then buy their way out.","example":"After a late fee was introduced at day-care centres, more parents collected their children late.","see":["The behaviour gets worse among people who used to do it without being paid or charged","People talk about the fee or the bonus, not the reason for the rule","Removing the fee or bonus does not bring the old behaviour back"],"cues":["penalty","penalties","penalised","late fee","late fees","charge~~=fee","charge~~=fees","pay~~=fee","pay~~=fees","new fee","new fees","introduce~~=fee","introduce~~=fees","=charged","charge for","charge them","bonus","bonuses","incentive","incentives","=reward","=rewards","reward them","reward people","reward staff","rewarded for doing","=commission","=commissions","paid for"],"strength":"mixed","basis":"Real but context-dependent: a field experiment in day-care centres and two broad reviews find incentives can crowd out the motives people already had; in other settings incentives and those motives add up. Bowles and Polanía-Reyes name four routes: the incentive carries information about the principal, frames the situation, compromises autonomy, or changes how preferences are learned.","citations":["gneezy_rustichini2000","frey_jegen2001","bowles_polania2012"]},{"id":"descriptive_norm","family":"behavioural","name":"What you advertise is what you get","technical":"Descriptive norms","gloss":"A message saying how many people break a rule tells everyone else that breaking it is normal.","example":"'Only 40 per cent have completed the module' tells the 60 per cent who have not that they are the majority, and takes the pressure off.","see":["The people still to act slow down after the statistic is published","In a repeated behaviour, people who were doing better than the stated rate drift towards it","Staff quote the statistic back as a justification"],"cues":["only a few","only half","only a third","percent of","per cent of","most people do","most people here","most people around here","most people in our","most people already","most people skip","most people ignore","most people just","most people never","most people simply","most people don't","most people do not","majority","nobody else","hardly anyone","everyone else","statistic","leaderboard","awareness campaign","poster campaign","below average","above average","average colleague","average colleagues","average team","team average","average peer","compliance rate","published rate","published rates","published figures","published statistics","does not model","do not model","doesn't model","don't model","not model the","never model","fails to model","role model","role models","lead by example","set the example","set an example","walk the talk","practise what","do not follow","does not follow","do not practise","does not practise","do not practice","does not practice","one rule for"],"strength":"mixed","basis":"Clear in a few field studies, smaller and less consistent at scale. A sign saying many visitors took petrified wood was followed by more theft in a US national park than signs stressing disapproval (there was no no-sign comparison); households using less energy than average used more once told the average, unless the message added approval (Schultz and colleagues). In a programme covering about 600,000 households (Allcott), the lowest-use households did not raise their use on average, and approval labels made no significant difference to them.","citations":["cialdini2006","schultz2007","allcott2011","bicchieri_dimant2022"]},{"id":"social_proximity","family":"behavioural","name":"Rules from strangers erode","technical":"Social proximity and norm compliance","gloss":"People copy what they see others do. When they feel little connection to the people around them, they copy the breaches they see and ignore the compliance, so a rule erodes after launch. When they identify with the group, they copy both, and compliance holds.","example":"A rule sent by a head office nobody has met is followed at first, then slips office by office as staff see colleagues stop.","see":["Compliance starts high and falls month by month after launch","The fall is steepest where people can see others breaking the rule","Teams whose own leaders introduced the rule hold compliance better"],"cues":["head office","headquarters","group compliance","from the centre","central team","imposed from above","never met","do not know them","don't know them","feel no connection","no connection to","not one of us","us and them","not our rule","their rule","someone else's rule","copy what others","copy others","copy colleagues","copying others","copying colleagues","see others break","see colleagues break","others stopped","colleagues stopped","everyone stopped","stopped bothering","follow the crowd","monkey see"],"strength":"extrapolation","basis":"In a laboratory experiment, people repeatedly chose whether to follow a norm after seeing what others had done. With no social proximity to the group, compliance eroded quickly: people followed the breaches they observed and ignored the compliance they observed. When people identified with the group, they followed both, and the decline stopped (Bicchieri, Dimant, Gächter and Nosenzo). The firm-level prediction, that a rule sent by a distant head office erodes the same way, is what your signal tests.","citations":["bicchieri_etal2022"]},{"id":"diffusion","family":"behavioural","name":"Everyone signs, nobody owns","technical":"Diffusion of responsibility","gloss":"When a decision passes through many hands, each person feels less responsible for the outcome.","example":"Four approvers each assume one of the others checked the detail.","see":["Each approver spends less time per decision as the chain grows","After a failure, each person names someone else","Decisions stall while everyone waits for someone else to act"],"cues":["approver","approvers","multiple approvals","several approvals","many approvals","too many approvals","multiple signatures","several signatures","many signatures","too many signatures","multiple sign offs","several sign offs","many sign offs","too many sign offs","fourth signature","third signature","four signatures","three signatures","five signatures","four approvals","three approvals","four sign offs","three sign offs","nobody feels responsible","no one feels responsible","nobody takes responsibility","no one takes responsibility","nobody is responsible","no one is responsible","everyone signs","everybody signs","all sign off","everyone approves","everybody approves","by committee","committee approval","approval committee","committee sign off","approval chain","chain of","escalation","layers","four eyes","each approver","nobody owns","assume someone else","assumes someone else","assume another","assumes another","someone else will","somebody else will","not my job","not my responsibility","pass the buck","no one owns","owns the problem","own the problem","no ownership"],"strength":"extrapolation","basis":"Laboratory evidence that people act less when responsibility is shared is long-standing. Applying it to approval chains is a reasonable extrapolation, not a tested regularity in firms.","citations":["darley_latane1968","falk_neuber_szech2020"]},{"id":"metric_gaming","family":"behavioural","name":"Hitting the target, missing the point","technical":"Metric gaming (Goodhart's and Campbell's law)","gloss":"Once a number is rewarded, people move the number by the cheapest route, which is often not the behaviour it was meant to track.","example":"English hospitals met waiting-time targets partly by adjusting waiting lists.","see":["Results cluster just at or above the target","The easy-to-move part of the metric improves while the rest does not","Activity bunches at the end of the reporting period"],"cues":["target","targets","kpi","kpis","quota","quotas","metric","metrics","scorecard","hit the number","hit their number","hit the numbers","hit their numbers","exactly","threshold","quarter end","end of quarter","score","scores","audit","audits","auditor","auditors","inspection","inspector","judged on","assessed on","rated on","measured on","=rating","=ratings","ranked","dashboard","nps","look good on","game the","gaming the","fiddle the","massage the numbers","look good on paper","somebody is watching","someone is watching","when watched","being watched","when observed","for show","window dressing"],"strength":"strong","basis":"Documented across public services and firms: English health-care targets were met with gaming alongside real improvement (Bevan and Hood); in a large government organisation, gaming of reported results harmed its true goal (Courty and Marschke); software salespeople agreed to lower prices to close deals in the quarters when it paid them (Larkin); and manufacturing sales are higher at the end of the fiscal year and lower at its start (Oyer). Holmström and Milgrom give the theory.","citations":["bevan_hood2006","courty_marschke2004","larkin2014","oyer1998","holmstrom_milgrom1991"]},{"id":"automation_bias","family":"behavioural","name":"The model becomes the decision","technical":"Automation bias and complacency","gloss":"When a system recommends, people check less and override less, even when the system is wrong.","example":"Recruiters stop overriding an AI ranking and spend seconds per application.","see":["Override rates fall over time without accuracy rising","Time spent per decision drops sharply","Reviewers cannot say why they agreed with the model"],"cues":["ai","algorithm","algorithmic","the model","a model","ai model","risk model","scoring model","automated","automation","ranking","recommendation","recommends","screening","override","overrides","algorithm aversion","distrust~system","distrust~model","distrust~algorithm","mistrust~system","mistrust~model","mistrust~algorithm","do not trust~system","do not trust~model","do not trust~algorithm","do not trust~software","do not trust~tool","don't trust~system","don't trust~model","don't trust~algorithm","don't trust~software","don't trust~tool","do not believe~system","do not believe~model","do not believe~algorithm","do not believe~software","don't believe~system","don't believe~model","don't believe~algorithm"],"unless":["take their jobs","take their job","take our jobs","take my job","lose their jobs","lose their job","lose our jobs","job security","job losses","made redundant","replace them","replace us","replaced by"],"strength":"mixed","basis":"Automation bias is well documented in aviation and medicine, including among experts. The opposite error is documented too: in laboratory studies people distrust an algorithm after seeing it err, and in a vending-machine firm workers were reluctant to follow algorithmic advice (Kawaguchi). In a hiring study across 15 firms, managers who appeared to hire against a job test's recommendations ended up with hires who stayed for less time. Only your own data can show which error dominates.","citations":["parasuraman_manzey2010","dietvorst2015","hoffman2018","kawaguchi2021"]},{"id":"present_bias","family":"behavioural","name":"Later always looks cheaper","technical":"Present bias and procrastination","gloss":"People put off anything with a cost now and a benefit later, even when they fully intend to do it.","example":"Everyone agrees to complete the review, and does it the day before the deadline.","see":["Activity bunches just before deadlines, whatever the deadline is","People say they intend to act and then do not","A fixed slot or reminder changes timing more than any argument does"],"cues":["deadline","deadlines","later","postpone","postponed","=delay","=delaying","procrastinate","procrastination","last minute","intend","intended","eventually","backlog","put off"],"strength":"mixed","basis":"Well established in theory, with real but varied experimental support. Standard models explain why tasks bunch at deadlines, and a longitudinal experiment found present bias in effort, much weaker in money, and demand for commitment devices (Augenblick and colleagues). In a field experiment with students, many chose their own deadlines and present bias was widespread, but the deadlines did not raise completion, and present-biased students who put off single tasks managed repeated ones (Bisin and Hyndman). Not tested for workplace deadlines.","citations":["odonoghue_rabin1999","augenblick2015","bisin_hyndman2020"]},{"id":"hassle","family":"behavioural","name":"Small frictions, big effects","technical":"Hassle factors and friction costs","gloss":"A few extra steps, forms or logins stop people who fully intend to act.","example":"Expense claims pile up when the system needs four screens and a receipt scan.","see":["Many start and do not finish","Completion rises sharply when a single step is removed","People who get help with the process complete it"],"cues":["=form","=forms","login","logins","steps","portal","paperwork","complicated","cumbersome","admin","clicks","screens","hassle","process","crash","buggy","clunky","fiddly","logs you out","logged out","takes too long","too many clicks"],"strength":"mixed","basis":"A field experiment that helped families complete a financial-aid form raised form completion and college attendance; information alone did not (Bettinger and colleagues). The help came with a streamlined process and aid estimates, so the effect of fewer steps alone is not isolated. An IRS field experiment found that simplified, more salient mailings raised take-up of a tax credit, but attempts to reduce the perceived cost of applying did not (Bhargava and Manoli).","citations":["bettinger2012","bhargava_manoli2015"]},{"id":"defaults","family":"behavioural","name":"The pre-set option wins","technical":"Defaults and status quo bias","gloss":"Whatever happens when nobody chooses is what most people end up with.","example":"Pension enrolment jumped when joining became the default instead of an opt-in.","see":["Most people end up on the pre-set option","Changing the default moves the outcome far more than information does"],"cues":["default","defaults","opt in","opt out","automatically","preset","pre set","enrol","enrolment","always done it","always done this","how we have always","way we have always","always been done","always been that way","habit","habits","force of habit","status quo","inertia","used to doing","old ways","routine","autopilot","nobody questions","unquestioned"],"strength":"strong","basis":"A meta-analysis of 58 default studies (pooled n = 73,675) found a considerable average effect, with wide variation: most studies find positive effects, a few find none or negative ones (Jachimowicz and colleagues). A large-firm study found automatic enrolment raised pension participation sharply, and people stayed at the default contribution rate (Madrian and Shea).","citations":["madrian_shea2001","jachimowicz2019"]},{"id":"attention","family":"behavioural","name":"Out of sight, out of mind","technical":"Limited attention and salience","gloss":"People respond to what is visible at the moment of decision and ignore what is not.","example":"Shoppers reacted to a tax once it was shown on the price tag, though it had always applied.","see":["Behaviour changes when information is moved, not when it is added","People say they did n measures","name":"Measure a small basket, not one number","plain":"Pair the target with a counterweight that is hard to game.","family":"enable","runs_through":[],"counters":["metric_gaming"],"side_effects":["attention_spread_thin"],"cues":["basket","balanced scorecard","counterweight","quality measure"],"unless":[],"levers":[],"counter_why":{"metric_gaming":"Gaming one number now shows up in the other."}},{"id":"add_capacity","name":"Add time or resources","plain":"Give people the time, cover or budget the behaviour needs.","family":"enable","runs_through":[],"counters":["capacity"],"side_effects":["time_absorbed"],"cues":["more time","headcount","cover for","extra cover","resource","resources","protected time","hire a","hire an","hire~more","hire~extra","hire~additional","recruit a","recruit~more","recruit~extra","backfill","locum","temporary staff","agency staff","extra~staff","more~staff","additional~staff","more people","extra people","more capacity","extra capacity","more hands"],"unless":[],"levers":[],"counter_why":{"capacity":"It removes the constraint instead of working around it."}},{"id":"train_clarify","name":"Train or clarify","plain":"Close the knowledge or skill gap.","family":"enable","runs_through":[],"counters":["information"],"side_effects":["training_becomes_box_ticking"],"cues":["training","train","guidance","clarify","instructions"],"unless":[],"levers":[],"counter_why":{"information":"People then know how to do what is asked."}},{"id":"realign_incentive","name":"Remove the conflicting reward","plain":"Change the rule or reward that pays for the behaviour you want to stop.","family":"enable","runs_through":[],"counters":["misaligned"],"side_effects":["useful_effect_lost"],"cues":["realign","remove the incentive","change the bonus","conflicting target"],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."}}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours pushback. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is pushback; if effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap; if minimum effort persists, it is pushback."},{"a":"reactance","b":"hassle","observation":"Remove one step for a random sample. If more of them complete it, or complete it properly, it was friction; if they still do the minimum, it is pushback."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample of people more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity; if the easy parts still carry the number and the hard parts still lag, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"Look inside the period. Gaming concentrates on the cheapest component; procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target; if it is where another reward conflicts, it is misalignment."},{"a":"diffusion","b":"hassle","observation":"Remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion; if only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. Shallow checks even with more time favour diffusion. Deeper checks favour time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. Rare overrides even with more time favour deference to the model. More overrides favour time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones simply track the model, including where it was wrong, they were deferring; if blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams whose own leader introduced the rule with teams that got it from head office. If compliance holds only where their own leader introduced it, distance is the problem; if both slide to the same minimum, it is pushback against the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance; if everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction; if compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds of the group no message, the message with the statistic, and the same message without it. If the version without the statistic does better than the version with it, the statistic was the problem. If both messages beat no message by about the same amount, the message worked by drawing attention and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"Look at who got worse. If it is the people who used to do it without being paid or charged, it is crowding out; if it is where a competing reward is strongest, it is misalignment."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction; if starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity; if instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"Watch three people try. If they know what to do but give up on the process, it is friction; if they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention; if most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default; if only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the designed time.","preset":{"change_iv":"make_voluntary","change":"Make the training voluntary, with a choice of format and timing","justify":"It removes the signal of distrust behind the pushback against being told","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or a pushback problem? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","kalev_dobbin2020"]},{"id":"c1","kind":"preset","title":"The compliance module everybody finishes","short":"Compliance module","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"Teaching case written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The quarterly target every team just hits","short":"Quarterly target","situation":"A services business set each regional team a target of 40 client reviews a quarter, tied to the team bonus.","behaviour":"Mean review length fell from 52 minutes to 31. The share of reviews booked in the last two weeks of the quarter rose from 18 per cent to 47 per cent. Client satisfaction is unchanged. In six quarters no region has reported fewer than 40, and none has reported more than 42.","note":"Teaching case written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustra     if (el.closest("style,script") || el.querySelector("p,li,div,dd,td,table,ul,ol,input,textarea,button,select,style,script")) return;   /* never touch CSS or code */
