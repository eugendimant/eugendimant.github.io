<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADAR · Dr. Eugen Dimant · Cambridge Judge Business School</title>
<meta name="description" content="RADAR, developed by Dr. Eugen Dimant (University of Pennsylvania) for the Executive MBA elective at Cambridge Judge Business School, Session 4. It runs offline, and nothing entered leaves this device.">
<meta name="color-scheme" content="light">
<style>:root{
 --bg:#000;--panel:#171A20;--panel2:#101318;--raise:#1F232B;--line:#2C323A;--line2:#3A414A;
 --amber:#E8B23A;--amber2:#C9932A;--amberT:rgba(232,178,58,.13);--ink:#F2F2F2;--white:#fff;
 --muted:#A3A8AF;--dim:#8E949C;--red:#E0625D;--redT:rgba(224,98,93,.12);--green:#6CC08A;--greenT:rgba(108,192,138,.12);
 --blue:#8FB3D9;--r:10px;--focus:0 0 0 3px rgba(232,178,58,.55);
 --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:var(--hdr,140px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--amber)}
/* ---------------- header ---------------- */
header.hd{position:sticky;top:0;z-index:40;background:#000;border-bottom:1px solid var(--line)}
.credit{max-width:1240px;margin:0 auto;padding:7px 20px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.credit a{color:inherit;font-weight:600;display:inline-block;padding:14px 0;margin:-14px 0;text-decoration:underline;text-underline-offset:2px}
.credit a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hrow{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px}
.mark{display:flex;gap:4px}.mark i{display:block;width:6px;height:24px;background:var(--amber)}
.brand b{display:block;font-size:20px;letter-spacing:.06em;color:var(--white)}
.brand span{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700}
.sp{flex:1}
.clock{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px}
.clock output{font-weight:700;font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.clock.warn output{color:var(--red)}.clock.done output{color:var(--red)}
.clock small{font-size:11.5px;color:var(--muted);max-width:110px;line-height:1.2}
.ib{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;font-size:14px;background:var(--panel2)}
.ib:hover{border-color:var(--amber)}
.ib.pri{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.ib.pri:hover{background:var(--amber2)}
.ib[disabled]{cursor:not-allowed;color:var(--muted);background:var(--raise);border-color:var(--line2)}
.ib.pri[disabled]{background:#3A3524;border-color:#5A5030;color:#D9D3BF}   /* still reads as the main action, and still legible */
nav.tabs{max-width:1240px;margin:10px auto 0;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:132px;text-align:left;padding:8px 12px 9px;border-radius:9px 9px 0 0;background:var(--panel);border-bottom:3px solid transparent;color:var(--muted)}
.tab .l{font-size:18px;font-weight:700;color:#5E6773;margin-right:7px}
.tab .n{font-size:13.5px;color:var(--ink)}
.tab .m{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.tab .live{color:var(--amber);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab[aria-current="step"]{background:var(--amberT);border-bottom-color:var(--amber)}
.tab[aria-current="step"] .l{color:var(--amber)}
.tab.done .l{color:var(--amber2)}
.tab.brief{min-width:96px}
/* ---------------- layout ---------------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 90px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:30px}
.wrap.full{grid-template-columns:minmax(0,1fr)}
main{min-width:0}
aside.rail{position:sticky;top:calc(var(--hdr,140px) + 14px);align-self:start;max-height:calc(100vh - var(--hdr,140px) - 30px);overflow:auto}
@media(max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}aside.rail{display:none}}
/* ---------------- step head ---------------- */
.sh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.badge{flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--amber);color:#000;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sh h2{font-size:28px;line-height:1.15;color:var(--white)}
@media(max-width:480px){.sh h2{font-size:23px}}
.sh .plain{font-size:14.5px;color:var(--amber);margin-top:3px}
.sh .q{font-size:19px;color:var(--ink);margin-top:5px}
.sh .h{font-size:14.5px;color:var(--muted);margin-top:4px}
.livebar{display:flex;align-items:center;gap:10px;background:var(--amberT);border:1px solid rgba(232,178,58,.35);border-radius:var(--r);padding:9px 14px;margin:0 0 16px;font-size:14px}
.livebar b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
/* ---------------- cards and fields ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card.quiet{background:var(--panel2)}
.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:3px}
.card .hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.card h4{font-size:17px;color:var(--white);margin-bottom:4px}
textarea,input[type=text],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;font-size:16px;line-height:1.45;resize:vertical}
textarea{min-height:76px;overflow:hidden}
textarea:focus,input:focus{outline:none;border-color:var(--amber);box-shadow:var(--focus)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
.lab{display:block;font-size:14px;font-weight:700;color:var(--white);margin:0 0 6px}
.sub{font-weight:400;color:var(--muted);font-size:13.5px}
.given{font-size:15.5px;line-height:1.55;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;padding:11px 13px}
/* ---------------- coach ---------------- */
.coach{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cq{display:flex;gap:10px;align-items:flex-start;background:rgba(232,178,58,.07);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 10px;font-size:14.5px}
.cq .qi{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#000;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cq .mw{display:inline-block;background:var(--raise);border:1px solid var(--line2);border-radius:5px;padding:0 6px;margin:0 3px 0 0;font-size:12.5px;color:var(--muted)}
.cq .x{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:underline;white-space:nowrap}
.cq.warn{border-left-color:var(--red);background:var(--redT)}
.cq.warn .qi{background:var(--red)}
/* ---------------- chips and choice cards ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:14.5px}
.chip:hover{border-color:var(--amber2);background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--amberT);border-color:var(--amber);color:var(--white);font-weight:700}
.kinds{margin-top:8px}
@media(min-width:700px){.scant td:nth-child(2){min-width:10.5em}}.allk{margin-top:12px}.allk summary{cursor:pointer;color:var(--amber);font-size:14.5px}.kfam{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.chip small{color:var(--muted);font-weight:400}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.choice{text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.choice:hover{border-color:var(--amber2);background:var(--raise)}
.choice[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 1px var(--amber)}
.choice b{font-size:16px;color:var(--white)}
.choice span{font-size:14px;color:var(--muted)}
.choice em{font-style:normal;font-size:13.5px;color:var(--ink)}
.fam{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;width:max-content}
.fam.control{background:var(--redT);color:var(--red)}.fam.enable{background:var(--greenT);color:var(--green)}
/* ---------------- think / reveal ---------------- */
.gatebtn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.gatebtn .why{font-size:13.5px;color:var(--muted)}
.reveal{border:1px solid rgba(232,178,58,.4);background:linear-gradient(180deg,rgba(232,178,58,.07),rgba(232,178,58,0) 60%);border-radius:var(--r);padding:16px 18px;margin:12px 0 14px}
.reveal.fresh{animation:rin .35s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.reveal>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:8px}
.mech{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel2);margin-bottom:8px}
.mech .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mech .nm{font-weight:700;color:var(--white)}
.mech .tn{font-size:13px;color:var(--muted)}
.bars{display:inline-flex;gap:3px;margin-left:auto}.bars i{display:block;width:9px;height:14px;border-radius:2px;background:var(--line2)}.bars i.on{background:var(--amber)}
.whys{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.whys span{font-size:12.5px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.mech details{margin-top:6px}.mech summary{font-size:13.5px;color:var(--amber);cursor:pointer}
.mech .more{font-size:14px;color:var(--ink);margin-top:6px;display:flex;flex-direction:column;gap:6px}
.mech .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin-top:8px}
.tag b{color:var(--white)}
/* evidence badges */
.ev{font:inherit;background:none;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:5px;white-space:nowrap}
.ev.strong{border:1px solid var(--ink);color:var(--ink)}
.ev.mixed{border:1px solid var(--amber);color:var(--amber)}
.ev.extrapolation{border:1px dashed var(--muted);color:var(--muted)}
.ev.structural{border:1px solid var(--blue);color:var(--blue)}
.cite{font-size:12.5px;color:var(--dim)}
/* side-effect cards */
.se{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--panel2);margin-bottom:10px}
.se.close{border-color:var(--amber)}
.se .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.se .nm{font-weight:700;font-size:16px;color:var(--white)}
.se .who{font-size:12.5px;color:var(--muted)}
.se p{font-size:14.5px;margin-top:5px}
.se dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px;margin-top:8px}
.se dt{color:var(--muted)}
.se .marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mk{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2)}
.mk[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);color:var(--white);font-weight:700}
.closest{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--amber);border-radius:4px;padding:2px 7px;font-weight:700}
.trail{border-left:3px solid var(--amber);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14.5px;margin:10px 0}
.prov{font-size:12.5px;margin-top:6px}.prov.tool{color:var(--red)}.prov.adapted{color:var(--amber)}.prov.own{color:var(--green)}
/* ---------------- dots ---------------- */
.dotrow{display:flex;align-items:center;gap:12px;margin:6px 0}
.dotrow .dl{width:170px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;font-size:11px;color:var(--dim)}
.dot.on{background:var(--muted);border-color:var(--muted);color:#000}
.dots.after .dot.on{background:var(--amber);border-color:var(--amber)}
.delta{font-size:14.5px;color:var(--ink);margin-top:6px}
@media(max-width:560px){.dotrow{flex-direction:column;align-items:flex-start}}
/* ---------------- nav foot ---------------- */
.foot{display:flex;align-items:center;gap:12px;margin-top:22px;margin-bottom:14px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .open{font-size:13.5px;color:var(--muted)}
.foot .open[data-live]{flex:1 1 100%;order:-1}.foot .open[data-live]:empty{display:none}
.foot .sp{flex:1}
/* ---------------- rail: the chain ---------------- */
.chain{display:flex;flex-direction:column;gap:0}
.chain h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.cn{display:block;width:100%;text-align:left;position:relative;padding:9px 12px 11px 30px;border-radius:9px}
.cn:hover{background:var(--panel)}
.cn::before{content:"";position:absolute;left:11px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--line2)}
.cn.ok::before{background:var(--amber)}
.cn::after{content:"";position:absolute;left:15px;top:25px;bottom:-12px;width:1px;background:var(--line2)}
.cn:last-child::after{display:none}
.cn b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cn span{display:block;font-size:14px;color:var(--ink);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cn span.o{color:var(--dim);font-style:italic}
.cn.hot b{color:var(--amber)}
.railnote{font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.45}
/* ---------------- start ---------------- */
.hero h1{font-size:56px;letter-spacing:.04em;color:var(--white);line-height:1}
.hero .tl{font-size:30px;line-height:1.2;color:var(--white);margin-top:4px;max-width:820px;font-family:"EB Garamond",Georgia,serif}
.hero .out{font-size:16.5px;color:var(--muted);margin-top:10px;max-width:820px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 26px}
@media(max-width:900px){.steps5{grid-template-columns:1fr 1fr}}
.s5{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.s5 .l{font-size:26px;font-weight:700;color:var(--amber)}
.s5 b{display:block;font-size:14px;color:var(--white);margin-top:2px}
.s5 span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.s5 span.pl{color:var(--amber);font-size:12.5px;margin-top:3px}
.s5 .m{font-size:12px;color:var(--dim);margin-top:6px}
.s5 .m span{display:inline;margin:0}
.s5 .live{color:var(--amber);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.cases{display:flex;flex-wrap:wrap;gap:12px}   /* a short last row stretches to the full width: no empty slot, an even gap */
.cs{flex:1 1 270px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:15px 16px}
.cs:hover{border-color:var(--amber)}
.cs{position:relative}
.cs[aria-pressed="true"]{border-color:var(--amber);background:var(--amberT);box-shadow:inset 0 0 0 2px var(--amber)}
.cs[aria-pressed="true"]::after{content:"\2713  Chosen";position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#000;background:var(--amber);border-radius:999px;padding:2px 10px}
.cs[aria-pressed="true"] .k{padding-right:84px}
.cs b{display:block;font-size:16px;color:var(--white)}
.cs span{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.cs .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.cs.own{border-style:solid;border-color:rgba(232,178,58,.5)}
.honest{font-size:13px;color:var(--dim);margin-top:18px;max-width:820px;line-height:1.5}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amberT);border:1px solid rgba(232,178,58,.4);border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
/* ---------------- brief ---------------- */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px}
@media(max-width:1100px){.bgrid{grid-template-columns:1fr}}
.paper{background:#fff;color:#1A1B1E;border-radius:6px;padding:34px 38px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paper .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B8860B;font-weight:700}
.paper h2{font-size:24px;color:#1A1B1E;margin-top:3px}
.paper .meta{font-size:13px;color:#6C6C6E;margin-top:3px}
.paper hr{border:0;border-top:2px solid #B8860B;margin:12px 0 14px}
.paper .rb{background:#FAF6EC;border-left:3px solid #B8860B;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:12px}
.paper .rb.no{font-weight:400;color:#6C6C6E}
.paper .sec{border-top:1px solid #B8860B;padding:8px 0 6px}
.paper .sec h4{font-size:14.5px;color:#1A1B1E;margin-bottom:4px}
.paper .sec h4 i{font-style:normal;color:#B8860B;margin-right:8px}
.paper dl{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:13.5px}
.paper dt{color:#6C6C6E;font-weight:700;font-size:12px;padding-top:1px}
.paper dd.o{color:#A0A0A3;font-style:italic}
.paper .map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:12px;border-top:1px solid #D7D7D9;margin-top:8px;padding-top:8px}
.paper .map b{display:block;color:#6C6C6E;font-size:11px}
.paper .tr{font-size:12px;color:#6C6C6E;border-top:1px solid #D7D7D9;margin-top:8px;padding-top:6px}
.paper .pft{font-size:11px;color:#6C6C6E;margin-top:6px}
@media(max-width:600px){.paper{padding:20px}.paper dl{grid-template-columns:1fr}.paper .map{grid-template-columns:1fr 1fr}}
.checks{list-style:none;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.checks li i{flex:0 0 auto;width:18px;height:18px;border-radius:50%;margin-top:2px;border:1.5px solid var(--line2)}
.checks li.ok i{background:var(--amber);border-color:var(--amber)}
.checks li button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2)}
.checks li.ok button{color:var(--muted);text-decoration:none}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .ib{justify-content:center;border-radius:8px}
.exports .why{font-size:13px;color:var(--muted)}
.gatebtn .why,.exports .why{overflow-wrap:anywhere}
.rbbig{font-size:19px;line-height:1.4;color:var(--white);font-weight:700}
.rbbig.no{color:var(--muted);font-weight:400;font-size:15px}
/* ---------------- presenter (waterline) ---------------- */
.pres{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;justify-content:safe center;padding:6vh 8vw;overflow-y:auto}
.pres .k{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
.pres .above,.pres .se,.pres .sg,.pres .tgt{text-wrap:balance}
.pres .k2{margin-top:2.2vh;color:var(--muted);font-size:12px}
.pres .above{font-size:3.2vw;line-height:1.25;color:var(--white);max-width:78vw;margin-top:1.5vh}

/* Editorial RADAR skin. The five-step interaction is unchanged. */
:root{

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:#C9D6D2}

div.rounds .rp.done i{background:var(--green);border-color:var(--green);color:#fff}
div.rounds .rp.next{opacity:.75}
div.rounds .rp:not([disabled]):hover i{border-color:#19343B}
@media(max-width:620px){div.rounds{grid-template-columns:repeat(3,minmax(0,1fr))}div.rounds .rp{font-size:12px}div.rounds .rp i{width:34px;height:34px}div.rounds .rs:not(:last-child)::after{top:17px;left:calc(50% + 19px);right:calc(-50% + 19px)}}
/* the stage card */
.rpanel .scen{font-size:17px;margin:0 0 var(--s3)}
.dchip{display:inline-block;margin-left:6px;padding:1px 9px;border:1px solid var(--line2);font-size:13px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.chg1{margin:0 0 var(--s4);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chg1>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-right:6px}
.rpanel [data-live="fcspec"] .spec{margin:var(--s2) 0 var(--s3)}
.gatebtn{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3) var(--s5);margin-top:var(--s3)}
.gatebtn .pmadd{margin:0}
/* the margin: quieter than the main column, folded under one disclosure when narrow */
aside.rail{font-size:14px}
aside.rail .chain h3,aside.rail .still h3{font-size:12px;letter-spacing:.08em;color:var(--muted)}
aside.rail .cn b{color:var(--muted)}aside.rail .cn span{color:var(--ink);opacity:.85}
details.bsf>summary{display:none}
.still{margin:0 0 var(--s5);padding:0 0 var(--s4);border-bottom:1px solid var(--line)}
.still ul{list-style:none;margin:var(--s2) 0 0;padding:0}
.still li{position:relative;padding:3px 0 3px 20px;font-size:13.5px;color:var(--ink)}
.still li::before{content:"";position:absolute;left:2px;top:8px;width:10px;height:10px;border:1.5px solid var(--muted)}
@media(max-width:1100px){
 aside.rail{display:block;position:static;max-height:none;overflow:visible;margin-top:0}
 details.bsf{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
 details.bsf>summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
 details.bsf[open]>summary{margin-bottom:var(--s3)}
}
/* slim footer bar, aligned with the content */
.foot{margin-top:var(--s5);padding:var(--s3) 0;border-top:1px solid var(--line);gap:var(--s3)}
.foot .open[data-live]{flex:1 1 auto;order:0}
@media(max-width:620px){.foot{flex-direction:row;flex-wrap:wrap}.foot .ib{width:auto}.foot .pri{order:2;margin-left:auto}.foot .ib:not(.pri){order:1}.foot .open[data-live]{flex:1 1 100%;order:0}}
/* toasts: top right, inside the header band, never over a field */
#toast{left:auto;right:max(16px,calc((100vw - 1200px)/2));transform:none}
@media(max-width:620px){#toast{right:16px;left:16px}}
.chg1{white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.chg1 .lk{white-space:normal;text-align:left}
@media(max-width:620px){.chg1{-webkit-line-clamp:2}}
aside.rail .still h3{text-transform:uppercase;font-weight:700}
@media(max-width:620px){.se dl{grid-template-columns:minmax(0,1fr);gap:2px}.se dd{margin:0 0 6px}.rpanel details.evid{margin-left:-6px;margin-right:-6px}}
/* the research and the evidence table before the pre-mortem: a quiet note, no study named */
.rnote .rlock{font-size:14px;line-height:1.5;color:var(--muted);margin:var(--s2) 0 0;padding-top:var(--s2);border-top:1px solid var(--line)}
.sheet .lknote{font-size:14px;color:var(--muted);margin:0 0 var(--s2)}
.ib[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.tof{font-size:13.5px;line-height:1.45;color:var(--muted);margin:6px 0 0}
/* the five steps beside the hero: one line each on a wide screen, so the list ends level with the hero text (no minutes are shown) */
.s5{grid-template-columns:24px minmax(0,1fr);padding:8px 0}
@media (min-width:1100px){.s5 .sx{display:flex;flex-wrap:wrap;column-gap:12px;align-items:baseline}.s5 .sx .pl{display:inline;margin:0}}

/* the board pitch: five items in large type */
.pitch .pcol{max-width:min(1100px,84vw)}
.pitch .p5{margin:2vh 0 0}.pitch .p5 dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7FD6A6;font-weight:700;margin-top:2.6vh}
.pitch .p5 dd{margin:.6vh 0 0;font:600 4.2vh/1.2 "EB Garamond",Georgia,serif;color:#F6F3EC;text-wrap:pretty}.pitch .p5 dd.o{color:#9DB5AE;font-style:italic;font-weight:400}
@media(max-width:700px){.pitch .p5 dd{font-size:21px}}

/* the research under each step's task: open by default, one quiet control hides it on every step */
.rbar{display:flex;justify-content:flex-start;margin:calc(-1 * var(--s2)) 0 var(--s2)}
.rtog{font:inherit;font-size:13.5px;background:none;border:0;padding:10px 0;color:var(--teal);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:40px}
.rtog:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
/* the header is not sticky on the start screen, so it never covers the opening text */
body.onstart header.hd{position:static}
/* the tagline's last three words ("interventions in organisations") always fit one line, so it never ends on two */
@media(min-width:981px){.hero .tl{font-size:min(44px,3.9vw)}}
@media(max-width:480px){.hero .tl{font-size:min(30px,calc(7.4vw - 3px))}}
/* the scan's type column holds a tag, a name and the matched words: wide enough that its last line never holds one or two words */
.scant th:nth-child(2),.scant td:nth-child(2){min-width:13.5em}
@media(max-width:480px){.sh h2{font-size:min(30px,calc(6.6vw + 1px))}}
/* the tagline reads as even lines at every width */
.hero .tl{text-wrap:balance}
/* toasts sit at the bottom left, clear of the header and its step tabs */
#toast{top:auto;bottom:16px;left:16px;right:auto;transform:none;max-width:min(440px,calc(100% - 32px));white-space:normal;overflow:visible;text-overflow:clip}
@media(max-width:620px){#toast{top:auto;bottom:12px;left:16px;right:16px;max-width:none}}
/* toasts: drawn in the header's free space (the live region #toast is read aloud only), never over a field or the step tabs */
#toast{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0!important;pointer-events:none}
.hrow .htoast{flex:1 1 auto;min-width:0;margin:0 16px;text-align:center;font-size:14px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:0;transition:opacity .2s}
.hrow .htoast.on{opacity:1}
.hrow .htoast.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:1px}
/* on a phone the message takes the brand's place for a moment, in the same row */
@media(max-width:620px){.hrow .htoast{flex:1 1 0;margin:0 4px;text-align:left;font-size:12.5px;line-height:1.3}.hrow:has(.htoast.on) .brand{display:none}.hrow .htoast.on::before{display:none}}
@media (prefers-reduced-motion:reduce){.hrow .htoast{transition:none}}

e,"sceptic":"Which cause does this leave untouched?","research":{"after_pm":true,"headline":"A fine for lateness made lateness more common","finding":"At one of six day-care centres that fined late pick-ups, late-coming parents rose from 7.25 to 12.5 a week, and to 15.25 after the fine was withdrawn.","manager":"ask whether a control turns a duty into a price or signals distrust. Try an enabling option first.","plate":{"title":"Late-coming parents per week at one fined centre","unit":"","highlight":2,"source":"gneezy_rustichini2000","bars":[["Before the fine, weeks 1 to 4",7.25],["With the fine, weeks 5 to 16",12.5],["After it ended, weeks 17 to 20",15.25]]},"scope":"Ten day-care centres were observed for 20 weeks. Six introduced a fine of NIS 10 for delays of ten minutes or more, and the four control centres showed no noticeable change. Falk and Kosfeld report the distrust reading of control from a laboratory game."},"citations":["gneezy_rustichini2000","falk_kosfeld2006"]},{"id":"act","outline":"Assessment Phase 4: implement the intervention","outline_full":"Assessment Phase 4: Implement the intervention (hypothetical)","plain":"Who starts, and by when","letter":"A","name":"Act","question":"Who takes the first step, and by when?","why":"Nothing happens until someone owns the first step.","done":"You have a first step, an owner and a deadline.","help":"Name the first step, who takes it and by when.","minutes":1,"live":false,"sceptic":"Would the owner agree to this next week?","research":{"headline":"Plans that fix when and where are carried out more often","finding":"Gollwitzer reviews experiments in which if-then plans, stating when, where and how a person will act, helped people act on intentions they already held.","manager":"leave with one name, one first step and one date.","plate":null,"scope":"Experiments on individuals pursuing their own goals, reviewed by the psychologist who proposed the concept."},"citations":["gollwitzer1999"]},{"id":"routinise","outline":"Assessment Phase 5: evaluate the results","outline_full":"Assessment Phase 5: Evaluate the results of the intervention (hypothetical)","plain":"How it could backfire, and what to watch","letter":"R","name":"Routinise","question":"Why did the intervention backfire?","why":"Side effects are cheapest to fix before launch.","done":"You have the side effect to watch, its indicator and a decision on the design.","help":"Assume it has failed. Say how, then pick the side effect to watch.","minutes":17,"live":true,"sceptic":"Who would rather this side effect never showed up in a report?","research":{"headline":"Imagining a failure as past brings more reasons to light","finding":"People generated more reasons for an outcome when they imagined it had already happened, which Mitchell, Russo and Pennington called prospective hindsight and Klein built into the pre-mortem.","manager":"assume it has failed and ask why. Give each likely side effect an indicator and a reviewer.","plate":null,"scope":"Laboratory studies of how people explain events. Klein describes the pre-mortem as a working method for project teams."},"citations":["mitchell1989","klein2007"]}],"frameworks":[{"id":"basic","name":"BASIC","kind":"scheme","owner":"OECD","expansion":"Behaviour, Analysis, Strategies, Intervention, Change","stages":["Behaviour","Analysis","Strategies","Intervention","Change"],"plain":"A staged toolkit for running a behavioural project from defining the behaviour to scaling what works.","side_effects":"It names ‘potential side effects’ as one of the nine parts of every behavioural insight, asks at the Behaviour stage about ‘any potential risks or unintended consequences’, and says to monitor potential side effects ‘throughout all relevant stages’.","gap":"BASIC asks you to consider side effects and plan measures to monitor them. It does not supply them: there is no catalogue linking a type of intervention to the side effects it tends to produce and the indicators that would reveal them.","radar_map":{"recognise":"Behaviour","analyse":"Analysis","design":"Strategies and Intervention","act":"Intervention","routinise":"Change"},"assessment":"Named in the course outline as an example design scheme.","citation":"oecd_basic2019"},{"id":"tests","name":"TESTS","kind":"scheme","owner":"Behavioural Insights Team","expansion":"Target, Explore, Solution, Trial, Scale","stages":["Target","Explore","Solution","Trial","Scale"],"plain":"BIT's five-phase method for running a behavioural project, moving back and forth between phases as you learn.","side_effects":"Asks at the Solution phase, when you prioritise interventions: 'Are there any potential safety considerations, possible negative side-effects or any other ethical concerns?', and whether the initiative could harm equity. Its worked example gives one specific side effect.","gap":"It offers a question and an example, but no method for deriving the likely side effect of a given intervention or an indicator for it.","radar_map":{"recognise":"Target","analyse":"Explore","design":"Solution","act":"Trial","routinise":"Trial and Scale"},"assessment":"Named in the course outline as an example design scheme.","citation":"bit_tests"},{"id":"rare","name":"RARE","kind":"scheme","owner":"Rare (rare.org)","expansion":"Rare's Behavior-Centered Design: Frame, Empathize, Map, Ideate, Prototype, Test, Launch, Assess","stages":["Frame","Empathize","Map","Ideate","Prototype","Test","Launch","Assess"],"plain":"Rare's own eight-step method, Behavior-Centered Design, described in the toolkit Rare wrote with the Behavioural Insights Team (2019).","side_effects":"The toolkit's chapters on strategies warn that payments can crowd out the motives people already had, that a fine can be read as a price, and that guilt and fear appeals can backfire, with remedies for each.","gap":"It gives specific warnings for incentives, fines and emotional appeals, but no general method for deriving the likely side effect of other interventions or an AST, MINDSPACE, and Rare Approach'.","citation":"dolan2010"}],"mechanisms":[{"id":"reactance","family":"behavioural","name":"Resistance to control","technical":"Reactance and the hidden costs of control","gloss":"When a rule removes choice or signals distrust, some people push back to restore their sense of freedom. A related finding, the hidden costs of control, is that some people then do the minimum the rule requires and withdraw the effort nobody specified.","example":"Managers complete mandatory training at the minimum time the system allows, and stop volunteering for related work.","see":["Behaviour clusters at the minimum the rule will accept","A voluntary version of the same activity gets more real engagement","Related effort that was never required falls after the rule starts"],"cues":["mandatory","compulsory","required","requirement","forced","enforce","enforced","imposed","policed","monitored","surveillance","tick box","box ticking","bare minimum","do the minimum","minimum effort","minimum required","just the minimum","resent","resentment","pushback from","pushback against","pushback problem","pushback issue","push back against","get pushback","getting pushback","face pushback","facing pushback","lots of pushback","strong pushback","told to","micromanaged","micromanage","micromanagement","feel controlled","feel distrusted","treated like children","waste of time","telling off","told off","humiliating","humiliated","public shaming","take their jobs","take their job","take our jobs","lose their jobs","lose their job","lose our jobs","job losses","job security","made redundant"],"strength":"mixed","basis":"Two related findings support this. Reactance theory: people push back to restore a freedom that is threatened (Brehm). The hidden costs of control: in a laboratory principal-agent game, being controlled lowered the effort of most agents, and agents who reacted negatively said they read the control as a signal of distrust (Falk and Kosfeld, by the agents' own account). Repetitions found the effect smaller, and control often still paid for the person imposing it (Ziegelmeyer and colleagues). Observational firm data fit the pattern but are not experimental.","citations":["brehm1966","falk_kosfeld2006","ziegelmeyer2012","dobbin_kalev2016"]},{"id":"crowding_out","family":"behavioural","name":"Payment displaces existing motives","technical":"Motivation crowding out","gloss":"A fine, fee or bonus can turn a social or professional duty into a purchase, and some people then buy their way out.","example":"After a late fee was introduced at day-care centres, more parents collected their children late.","see":["The behaviour gets worse among people who used to do it without being paid or charged","People talk about the fee or the bonus, not the reason for the rule","Removing the fee or bonus does not bring the old behaviour back"],"cues":["penalty","penalties","penalised","late fee","late fees","charge~~=fee","charge~~=fees","pay~~=fee","pay~~=fees","new fee","new fees","introduce~~=fee","introduce~~=fees","=charged","charge for","charge them","bonus","bonuses","incentive","incentives","=reward","=rewards","reward them","reward people","reward staff","rewarded for doing","=commission","=commissions","paid for"],"strength":"mixed","basis":"Real but context-dependent: a field experiment in day-care centres and two broad reviews find incentives can crowd out the motives people already had. In other settings incentives and those motives add up. Bowles and Polanía-Reyes name four routes: the incentive carries information about the principal, frames the situation, compromises autonomy, or changes how preferences are learned.","citations":["gneezy_rustichini2000","frey_jegen2001","bowles_polania2012"]},{"id":"descriptive_norm","family":"behavioural","name":"Compliance messages can normalise non-compliance","technical":"Descriptive norms","gloss":"A message saying how many people break a rule tells everyone else that breaking it is normal.","example":"'Only 40 per cent have completed the module' tells the 60 per cent who have not that they are the majority, and takes the pressure off.","see":["The people still to act slow down after the statistic is published","In a repeated behaviour, people who were doing better than the stated rate drift towards it","Staff quote the statistic back as a justification"],"cues":["only a few","only half","only a third","percent of","per cent of","most people do","most people here","most people around here","most people in our","most people already","most people skip","most people ignore","most people just","most people never","most people simply","most people don't","most people do not","majority","nobody else","hardly anyone","everyone else","statistic","leaderboard","awareness campaign","poster campaign","below average","above average","average colleague","average colleagues","average team","team average","average peer","compliance rate","published rate","published rates","published figures","published statistics","does not model","do not model","doesn't model","don't model","not model the","never model","fails to model","role model","role models","lead by example","set the example","set an example","walk the talk","practise what","do not follow","does not follow","do not practise","does not practise","do not practice","does not practice","one rule for"],"strength":"mixed","basis":"Clear in a few field studies, smaller and less consistent at scale. A sign saying many visitors took petrified wood was followed by more theft in a US national park than signs stressing disapproval (there was no no-sign comparison). Households using less energy than average used more once told the average, unless the message added approval (Schultz and colleagues). In a programme covering about 600,000 households (Allcott), the lowest-use households did not raise their use on average, and approval labels made no significant difference to them.","citations":["cialdini2006","schultz2007","allcott2011","bicchieri_dimant2022"]},{"id":"social_proximity","family":"behavioural","name":"Rules from distant authorities erode","technical":"Social proximity and norm compliance","gloss":"People copy what they see others do. When they feel little connection to the people around them, they copy the breaches they see and ignore the compliance, so a rule erodes after launch. When they identify with the group, they copy both, and compliance holds.","example":"A rule issued by a head office that staff have never met is followed at first, then lapses office by office as staff see colleagues stop.","see":["Compliance starts high and falls month by month after launch","The fall is steepest where people can see others breaking the rule","Teams whose own leaders introduced the rule hold compliance better"],"cues":["head office","headquarters","group compliance","from the centre","central team","imposed from above","never met","do not know them","don't know them","feel no connection","no connection to","not one of us","us and them","not our rule","their rule","someone else's rule","copy what others","copy others","copy colleagues","copying others","copying colleagues","see others break","see colleagues break","others stopped","colleagues stopped","everyone stopped","stopped bothering","follow the crowd","monkey see"],"strength":"extrapolation","basis":"In a laboratory experiment, people repeatedly chose whether to follow a norm after seeing what others had done. With no social proximity to the group, compliance eroded quickly: people followed the breaches they observed and ignored the compliance they observed. When people identified with the group, they followed both, and the decline stopped (Bicchieri, Dimant, Gächter and Nosenzo). The firm-level prediction, that a rule sent by a distant head office erodes the same way, is what your indicator would test.","citations":["bicchieri_etal2022"]},{"id":"diffusion","family":"behavioural","name":"Shared sign-off dilutes responsibility","technical":"Diffusion of responsibility","gloss":"When a decision passes through many hands, each person feels less responsible for the outcome.","example":"Four approvers each assume one of the others checked the detail.","see":["Each approver spends less time per decision as the chain grows","After a failure, each person names someone else","Decisions stall while everyone waits for someone else to act"],"cues":["approver","approvers","multiple approvals","several approvals","many approvals","too many approvals","multiple signatures","several signatures","many signatures","too many signatures","multiple sign offs","several sign offs","many sign offs","too many sign offs","fourth signature","third signature","four signatures","three signatures","five signatures","four approvals","three approvals","four sign offs","three sign offs","nobody feels responsible","no one feels responsible","nobody takes responsibility","no one takes responsibility","nobody is responsible","no one is responsible","everyone signs","everybody signs","all sign off","everyone approves","everybody approves","by committee","committee approval","approval committee","committee sign off","approval chain","chain of","escalation","layers","four eyes","each approver","nobody owns","assume someone else","assumes someone else","assume another","assumes another","someone else will","somebody else will","not my job","not my responsibility","pass the buck","no one owns","owns the problem","own the problem","no ownership"],"strength":"extrapolation","basis":"Laboratory evidence that people act less when responsibility is shared is long-standing. Applying it to approval chains is a reasonable extrapolation, not a tested regularity in firms.","citations":["darley_latane1968","falk_neuber_szech2020"]},{"id":"metric_gaming","family":"behavioural","name":"Effort shifts to what the metric rewards","technical":"Metric gaming (Goodhart's and Campbell's law)","gloss":"Once a number is rewarded, people move e deadline is","People say they intend to act and then do not","A fixed slot or reminder changes timing more than any argument does"],"cues":["deadline","deadlines","later","postpone","postponed","=delay","=delaying","procrastinate","procrastination","last minute","intend","intended","eventually","backlog","put off"],"strength":"mixed","basis":"Well established in theory, with real but varied experimental support. Standard models explain why tasks bunch at deadlines, and a longitudinal experiment found present bias in effort, much weaker in money, and demand for commitment devices (Augenblick and colleagues). In a field experiment with students, many chose their own deadlines and present bias was widespread, but the deadlines did not raise completion, and present-biased students who put off single tasks managed repeated ones (Bisin and Hyndman). These findings have not been tested for workplace deadlines.","citations":["odonoghue_rabin1999","augenblick2015","bisin_hyndman2020"]},{"id":"hassle","family":"behavioural","name":"Administrative friction","technical":"Hassle factors and friction costs","gloss":"A few extra steps, forms or logins can stop people who fully intend to act.","example":"Expense claims pile up when the system needs four screens and a receipt scan.","see":["Many start and do not finish","Completion rises sharply when a single step is removed","People who get help with the process complete it"],"cues":["=form","=forms","login","logins","steps","portal","paperwork","complicated","cumbersome","admin","clicks","screens","hassle","process","crash","buggy","clunky","fiddly","logs you out","logged out","takes too long","too many clicks"],"strength":"mixed","basis":"A field experiment that helped families complete a financial-aid form raised form completion and college attendance. Information alone did not (Bettinger and colleagues). The help came with a streamlined process and aid estimates, so the effect of fewer steps alone is not isolated. An IRS field experiment found that simplified, more salient mailings raised take-up of a tax credit, but attempts to reduce the perceived cost of applying did not (Bhargava and Manoli).","citations":["bettinger2012","bhargava_manoli2015"]},{"id":"defaults","family":"behavioural","name":"People stay with the default","technical":"Defaults and status quo bias","gloss":"The outcome that applies when no one makes a choice is the outcome most people end up with.","example":"Pension enrolment jumped when joining became the default instead of an opt-in.","see":["Most people end up on the pre-set option","Changing the default moves the outcome far more than information does"],"cues":["default","defaults","opt in","opt out","automatically","preset","pre set","enrol","enrolment","always done it","always done this","how we have always","way we have always","always been done","always been that way","habit","habits","force of habit","status quo","inertia","used to doing","old ways","routine","autopilot","nobody questions","unquestioned"],"strength":"strong","basis":"A meta-analysis of 58 default studies (pooled n = 73,675) found a considerable average effect with wide variation, including a few null or negative results (Jachimowicz and colleagues). In a large firm, automatic enrolment raised pension participation, and people stayed at the default contribution rate (Madrian and Shea).","citations":["madrian_shea2001","jachimowicz2019"]},{"id":"attention","family":"behavioural","name":"Limited attention","technical":"Limited attention and salience","gloss":"People respond to what is visible at the moment of decision and ignore what is not.","example":"Shoppers reacted to a tax once it was shown on the price tag, though it had always applied.","see":["Behaviour changes when information is moved, not when it is added","People say they did not know about something that was technically published"],"cues":["hidden","buried","visible","noticed","unaware","forgot","forget","inbox","overload","overl the incentive","change the bonus","conflicting target"],"unless":[],"levers":[],"counter_why":{"misaligned":"It takes away the reason to keep doing it."}}],"pair_tests":[{"a":"reactance","b":"capacity","observation":"Compare effort, not timing, between managers with light and heavy workloads. Minimum effort even with a light workload favours resistance. Fuller engagement in that group favours time pressure."},{"a":"reactance","b":"present_bias","observation":"Move the deadline or add a fixed slot. If timing moves but effort stays at the minimum, it is resistance. If effort recovers once it is scheduled, it was procrastination."},{"a":"reactance","b":"information","observation":"Give clear how-to instructions, with no rationale, to a random half. If effort rises there, it was an information gap. If minimum effort persists, it is resistance."},{"a":"reactance","b":"hassle","observation":"Remove one step for a random sample. If more of them complete it, or complete it properly, it was friction. If they still do the minimum, it is resistance."},{"a":"metric_gaming","b":"capacity","observation":"Give a random sample more time or cover, with the target unchanged, and compare the hard parts of the metric. If the hard parts catch up, it was capacity. If the easy parts still carry the number, it is gaming."},{"a":"metric_gaming","b":"present_bias","observation":"Look inside the period. Gaming concentrates on the cheapest component. Procrastination moves everything late but keeps the mix."},{"a":"metric_gaming","b":"misaligned","observation":"Look at who games most. If it is where the target pays most, it is the target. If it is where another reward conflicts, it is misalignment."},{"a":"diffusion","b":"hassle","observation":"Remove one approver for a sample. If the remaining approvers check more carefully, it was diffusion. If only speed improves, it was friction."},{"a":"diffusion","b":"capacity","observation":"Give approvers more time for a sample. If checks remain shallow despite the extra time, this points to diffusion of responsibility. Deeper checks point to time pressure."},{"a":"automation_bias","b":"capacity","observation":"Give reviewers more time per case for a sample, and look at cases where the model was later shown to be wrong. If overrides remain rare despite the extra time, this points to deference to the model. More overrides would point to time pressure."},{"a":"automation_bias","b":"information","observation":"Score reviewers' blind judgements and their model-assisted judgements against later outcomes. If blind judgements are good but assisted ones track the model, including where it was wrong, they were deferring. If blind judgements are poor, it is a skill gap."},{"a":"social_proximity","b":"reactance","observation":"Compare teams whose own leader introduced the rule with teams that got it from head office. If compliance holds only where their own leader introduced it, distance is the problem. If both slide to the same minimum, it is resistance to the rule itself."},{"a":"social_proximity","b":"descriptive_norm","observation":"Look at what people could see before they stopped. If breaches spread from team to team where people see each other, it is copying across distance. If everyone slows after a published low rate, it is the statistic."},{"a":"social_proximity","b":"hassle","observation":"Remove one step of the process for a random half of the teams. If those teams comply more, it was friction. If compliance still slides where people can see others breaking the rule, it is copying."},{"a":"descriptive_norm","b":"attention","observation":"Send random thirds no message, the message with the statistic, or the same message without it. If the version without the statistic wins, the statistic was the problem. If both beat no message equally, attention did the work and the statistic did no harm."},{"a":"crowding_out","b":"misaligned","observation":"Look at who got worse. If it is the people who used to do it without being paid or charged, it is crowding out. If it is where a competing reward is strongest, it is misalignment."},{"a":"present_bias","b":"hassle","observation":"In the logs, compare when people first open the task with where they stop. If many open it early and abandon it at a particular step, it was friction. If starts bunch just before the deadline and almost everyone who starts finishes, it was procrastination."},{"a":"present_bias","b":"capacity","observation":"Look at people with light workloads. Last-day action even with light workloads favours procrastination. Earlier action favours capacity constraints."},{"a":"capacity","b":"information","observation":"Give time without instruction to one group and instruction without time to another. If time fixes it, it was capacity. If instruction fixes it, it was information."},{"a":"hassle","b":"information","observation":"Observe three people attempting it. If they know what to do but give up on the process, it is friction. If they do not know what to do, it is information."},{"a":"attention","b":"present_bias","observation":"Check who actually opened the prompt. If many of those who did not act never opened it, it was attention. If most had opened it and still acted only close to the deadline, it was procrastination."},{"a":"defaults","b":"information","observation":"Change the default for one group, add information for a second, and leave a third alone. If only the default group moves, it was the default. If only the information group moves, it was information."}],"cases":[{"id":"dk","kind":"worked","title":"Worked example: required diversity training","short":"Worked example","situation":"A large firm requires every manager to complete diversity training within a set window. Completion is reported to the board.","behaviour":"Illustrative: completion is 100 per cent, and most managers finish in the last three days of the window, spending about a quarter of the designed time.","preset":{"change_iv":"make_voluntary","change":"Make the training voluntary, with a choice of format and timing","justify":"It removes the expression of distrust behind managers' resistance to being instructed","private_mode":"room"},"existing":"mandate","likely":["reactance","capacity","present_bias"],"bridge":"Is the late, minimal completion a scheduling problem or resistance to the requirement? What would managers with light workloads tell you?","note":"Teaching version: the late, minimal completion pattern is invented for this session. The contrast between required and voluntary training comes from Dobbin and Kalev's observational firm data.","citations":["dobbin_kalev2016","kalev_dobbin2020"]},{"id":"c1","kind":"preset","title":"The annual conduct module","short":"Conduct module","teaser":"After a regulatory finding, a 5,000-person firm made its annual conduct module mandatory. Completion is now 100 per cent, at a median of 9 minutes.","theme":"Annual training in a regulated firm","situation":"A 5,000-person firm made its annual conduct module mandatory after a regulatory finding. Completion is reported to the board each quarter. It now runs at 100 per cent.","behaviour":"Median time spent in a module designed for 45 minutes is 9 minutes. Two-thirds of completions land in the final 48 hours of the window. Reported concerns to the confidential line fell by a third since the module became mandatory.","note":"This teaching case was written for this session. The firm and the figures are invented, not a real organisation.","illustrative":"Illustrative: invented firm and figures","existing":"mandate","likely":["reactance","present_bias","capacity"],"bridge":"Did concerns fall because there is less to report, or because people now treat conduct as something the module took care of?"},{"id":"c2","kind":"preset","title":"The client-review target","short":"Client-review target","teaser":"Each regional team’s bonus depends on 40 client reviews a quarter. For six quarters, every region has reported between 40 and function shortBlock() { return blockMin() === KB.meta.short_minutes; }
/* the rounds with their start and end, in minutes from the start of the block */
function phasePlan() {
  var t = 0, key = shortBlock() ? "short" : "full";
  return KB.meta.phases.map(function (p) { var o = {id: p.id, name: p.name, from: t, to: t + p[key]}; t += p[key]; return o; });
}
function phaseNow() {
  if (!S.started || !S.deadline) return null;
  var left = S.paused_left !== null ? S.paused_left : S.deadline - Date.now(), el = (blockMin() * 60000 - left) / 60000, P = phasePlan();
  for (var i = 0; i < P.length; i++) if (el < P[i].to) return {p: P[i], i: i, el: el};
  return {p: P[P.length - 1], i: P.length - 1, el: el, over: true};
}
/* the minutes a step should take on this clock: the steps R to A share the first round, Routinise holds the other three */
function stepMinutes(i) {
  if (!shortBlock()) return KB.steps[i].minutes;
  var P = phasePlan(), ra = 0, k;
  for (k = 0; k < 4; k++) ra += KB.steps[k].minutes;
  if (i < 4) return Math.round(KB.steps[i].minutes * P[0].to / ra * 2) / 2;
  return blockMin() - P[0].to;
}
var PHASE_TOAST = {premortem: "Pre-mortem: assume the intervention was introduced six months ago and has failed. Describe what went wrong.",
  sweep: "Evidence check: compare the pre-mortem with the documented side effects.",

  var left = S.paused_left !== null ? S.paused_left : S.deadline - Date.now();
  var out = $("#clockOut"), box = $("#clock"), note = $("#clockNote"), btn = $("#clockBtn");
  if (!out) return;
  out.textContent = fmt(left);
  box.className = "clock" + (left <= 0 ? " done" : left <= 120000 ? " warn" : "");
  if (btn) { btn.textContent = S.paused_left !== null ? "Resume" : "Pause"; btn.hidden = left <= 0 && S.paused_left === null; }
  var total = blockMin() * 60000, elapsed = total - left, i = stepIndex(S.screen), budget = 0;
  for (var k = 0; k <= i && k < KB.steps.length; k++) budget += stepMinutes(k) * 60000;
  tickPhases();
  note.textContent = S.paused_left !== null ? "paused" : left <= 0 ? "time is up" : (i >= 0 && elapsed > budget + 60000 ? "behind schedule" : "remaining");
  if (S.paused_left !== null) return;
  var sh = $('[data-live="short"]'); if (sh) { var shh = liveShort(); if (sh.__h !== shh) { sh.innerHTML = shh; sh.__h = shh; } }
  if (left <= 120000 && !S.warned.w2) { S.warned.w2 = true; save(); toast("Two minutes remain. Please agree who will present the report-back."); }
  if (left <= 0 && !S.warned.w0) { S.warned.w0 = true; save(); render(); toast("Time is up. The report-back sentence is on the brief page."); }   /* the after-class folds open up */
}

/* ---------------- events ---------------- */
function onClick(e) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  if (el.disabled) return;
  var fn = A[el.getAttribute("data-act")]; if (!fn) return;
  e.preventDefault(); fn(el.getAttribute("data-arg"), el);
}
function onInput(e) {
  var t = e.target, f = t.getAttribute && t.getAttribute("data-field");
  if (f) {
    S[f] = t.value.slice(0, MAXLEN[f] || 400);
    var cn = document.getElementById("cnt_" + f), left = (MAXLEN[f] || 400) - t.value.length;
    if (cn) cn.textContent = left <= Math.max(20, (MAXLEN[f] || 400) * 0.1) ? (left > 0 ? left + " characters remaining" : "That is the limit for this field.") : "";
    if (f === "forecast" && !S.forecast_at && words(S.forecast) >= 5) S.forecast_at = Date.now();
    if (f === "change") pruneDirs();
    grow(t); saveSoon(); liveSoon(); return;
  }
  if (t.getAttribute && t.getAttribute("data-pm") !== null) {   /* a failure story: the group’s forecast is the stories together */
    if (S.revealed_at) return;
    var v = pmVals(); v[+t.getAttribute("data-pm")] = t.value.slice(0, PM_MAX); S.pm = v; S.forecast = pmJoin(v);
    if (!S.forecast_at && words(S.forecast) >= 5) S.forecast_at = Date.now();
    grow(t); saveSoon(); liveSoon(); return;
  }
  if (t.id === "lkq") {
    UI.lq = t.value; var b = $("#lkbody"), holder = document.createElement("div"); holder.innerHTML = lookupHTML();
    var nb = holder.querySelector("#lkbody"); if (b && nb) b.innerHTML = nb.innerHTML;
    var tabs = holder.querySelector(".stabs"), ot = $(".sheet .stabs"), srch = $(".sheet .search");
    if (!tabs && ot) ot.remove();
    if (tabs && !ot && srch) srch.insertAdjacentElement("afterend", tabs);   /* clearing the search brings the tabs back */
    return;
  }
  if (t.id === "scanIn") { UI.scanText = t.value; }
  if (t.id === "pfIn") { UI.pfDraft = t.value.slice(0, 400); grow(t); }
  if (t.id === "candIn") { UI.candDraft = t.value.slice(0, 240); }
  var pk = t.getAttribute && t.getAttribute("data-prep"); if (pk && UI.prep.hasOwnProperty(pk)) { UI.prep[pk] = t.value; }
}
function onChange(e) {
  var t = e.target;
  if (t.id === "fileIn" && t.files && t.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      try { if (String(r.result).length > 60000) throw new Error("size"); var o = JSON.parse(r.result); if (!o || o.v !== 2) throw new Error("version"); S = sanitise(o); pruneDirs(); UI.restorable = null;   /* the group chose this file over any earlier work */
        S.deadline = null; S.paused_left = null; S.warned = {};   /* a saved clock is never resumed */
        S.started = S.started || !!S.case; save(); render(true); toast("File opened. All work has been restored."); }
      catch (err) { toast("That file is not a RADAR save from this version, so nothing was changed."); }
    };
    r.readAsText(t.files[0]);
  }
  if (t.id === "caseIn" && t.files && t.files.length) {   /* a member’s case file, or a full RADAR save: only its situation and behaviour are used */
    Array.prototype.slice.call(t.files, 0, 4 - S.candidates.length).forEach(function (file) {
      var rd = new FileReader();
      rd.onload = function () {
        try { if (String(rd.result).length > 60000) throw new Error("size"); var o = JSON.parse(rd.result); if (!o || o.v !== 2 || S.candidates.length >= 4) throw new Error("shape");
          var sit = typeof o.situation === "string" ? cleanText(o.situation, 700) : "", beh = typeof o.behaviour === "string" ? cleanText(o.behaviour, 500) : "";
          var ex = typeof o.existing === "string" && o.kind === "radar_case" ? cleanText(o.existing, 140) : typeof o.existing_other === "string" ? cleanText(o.existing_other, 140) : "";
          var nm = typeof o.name === "string" ? cleanText(o.name, 40).trim() : "";
          if (!sit.trim() && !beh.trim()) throw new Error("empty");
          var line = (nm ? nm + ": " : "") + ((beh.trim() || sit.trim()).match(/^[\s\S]*?[.!?](?=\s|$)/) || [beh.trim() || sit.trim()])[0];
          S.candidates.push({line: cleanText(line, 240), sit: sit, beh: beh, ex: ex, can_change: false, observable: false, safe: false}); save(); render(); toast("Case added: " + line);
        } catch (err) { toast("That file is not a RADAR case file, so nothing was added."); }
      };
      rd.readAsText(file);
    });
  }
  if (t.getAttribute && t.getAttribute("data-field") && t.type === "date") { S[t.getAttribute("data-field")] = t.value; save(); refreshLive(true); }
}
function onKey(e) {
  if (e.key === "Enter" && e.target && e.target.id === "candIn") { e.preventDefault(); A.addcand(); return; }
  if (e.key === "Escape") {
    if (UI.evpop) { A.closeev(); return; }
    if (UI.modal) { var back = UI.modal.back; UI.modal = null; render(); focusAct(back); }
    else if (UI.pres) { UI.pres = false; render(); var pb = $('[data-act="present"]'); if (pb) pb.focus(); }
    else if (UI.lookup) { UI.lookup = false; render(); var b = $('[data-act="lookup"]'); if (b) b.focus(); }
    else { var mn = $("details.menu[open]"); if (mn) { mn.removeAttribute("open"); var sm = mn.querySelector("summary"); if (sm) sm.focus(); } }
  }
  if (e.key === "Tab" && (UI.lookup || UI.modal || UI.pres || UI.evpop)) {           /* keep focus inside the open dialog */
    var box = $(UI.evpop ? ".evpop" : UI.modal ? ".modal:not(.evpop)" : UI.pres ? ".pres" : ".sheet"); if (!box) return;
    var f = $$('button,input,textarea,summary,[tabindex]:not([tabindex="-1"])', box).filter(function (x) { return !x.disabled && x.offsetParent !== null; });
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
}

/* ---------------- boot ---------------- */
function boot() {
  try { history.scrollRestoration = "manual"; } catch (e) {}
  window.scrollTo(0, 0);
  var pre = null;
  try { var p = $("#preload"); if (p && p.textContent.trim() && p.textContent.trim() !== "null") pre = JSON.parse(p.textContent); } catch (e) {}
  if (pre && typeof pre._fid === "string" && /^[0-9]{1,24}$/.test(pre._fid)) KEY = KEY + "_" + pre._fid;   /* a take-home file keeps its own slot */
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); } catch (e) { UI.saveFailed = true; }
  if (pre && stored && pre._fid && hasContent(stored)) { S = sanitise(stored); S.started = !!S.case; }   /* reopened later: the later work wins over the snapshot */
  else if (pre) { S = sanitise(pre); S.started = !!S.case; if (S.screen === "start" && S.case) S.screen = "brief"; }
  else if (stored && hasContent(stored)) { UI.restorable = sanitise(stored); }
  else if (stored) { S = sanitise(stored); }
  try { if (localStorage.getItem(KEY + "_proj")) document.body.classList.add("proj"); } catch (e) {}
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  document.addEventListener("toggle", function (e) { var d = e.target; if (d && d.getAttribute && d.getAttribute("data-fold")) { UI.folds = UI.folds || {}; UI.folds[d.getAttribute("data-fold")] = d.open; } if (d && d.open && d.tagName === "DETAILS") tieLast(d); }, true);
  window.addEventListener("resize", function () { setHdr(); growAll(); });
  /* a fast reload or a closed tab must never lose the last edit: write it now, not after the typing pause */
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("beforeprint", fitPrint);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushSave(); });
  window.addEventListener("beforeunload", function (e) { if (UI.saveFailed && hasContent(S)) { e.preventDefault(); e.returnValue = ""; } });
  preflight();
  render(true);
  setInterval(tickClock, 1000);
  window.RADAR_APP = {state: function () { return JSON.parse(JSON.stringify(S)); }, engine: E, version: KB.meta.version};
}
/* ---------------- preflight: the checks a facilitator would otherwise discover mid-session ---------------- */
function preflight() {
  var fails = [];
  try { localStorage.setItem(KEY + "_pf", "1"); localStorage.removeItem(KEY + "_pf"); }
  catch (e) { fails.push("This browser does not allow the page to store work (for example in a private window, or when opened from an email or ZIP file). Please open it from a normal folder in a normal window, or use Save progress regularly."); }
  if (/[\\/]Temp[\\/].*\.zip|\.zip[\\/]/i.test(decodeURIComponent(location.pathname || ""))) fails.push("This file is open from inside a ZIP archive. Please extract the folder first, or work may be lost when the window closes.");
  if (typeof Blob === "undefined" || !window.URL || typeof URL.createObjectURL !== "function") fails.push("This browser cannot create downloads, so the PDF and saved files will not work. Use another browser.");
  if (typeof window.print !== "function") fails.push("Printing is not available in this browser. Please use Download PDF.");
  if (window.innerWidth && window.innerWidth < 340) fails.push("The window is very narrow. Make it wider, or use a laptop.");
  UI.preflight = {fails: fails};
  var t0 = Date.now();
  setTimeout(function () { if (Date.now() - t0 > 4500) { UI.preflight.fails.push("The browser is slowing this page\u2019s timers, often because of a battery saver. Please keep this tab in front so that the clock stays accurate."); if (S.screen === "start") render(); } }, 2500);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
